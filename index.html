const ptrs=new Map();let drag=null,pinch=null,lastPtr=null;
const tileAtS=(sx,sy)=>{const w=s2w(sx,sy);return{x:Math.floor(w.x/TS),y:Math.floor(w.y/TS),wx:w.x,wy:w.y};};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  Snd.init();cv.focus({preventScroll:true});try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){TD=null;drag=null;const[a,b]=[...ptrs.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:cam.z,anchor:s2w(mx,my)};return;}
  if(ptrs.size>2)return;
  const pan=e.button===1||e.button===2||tool==='select'||tool==='place'||tool==='pick';
  drag={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:0,pan,btn:e.button};
  if(pan&&tool==='select')cv.style.cursor='grabbing';
  if(!pan)toolDown(tileAtS(e.clientX,e.clientY));
});
cv.addEventListener('pointermove',e=>{
  lastPtr={x:e.clientX,y:e.clientY};
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const tp=tileAtS(e.clientX,e.clientY);hoverT=inMap(tp.x,tp.y)?tp:null;
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;cam.z=clamp(pinch.z*d/pinch.d,minZoom(),2.6);cam.x=pinch.anchor.x-(mx-VWp/2)/cam.z;cam.y=pinch.anchor.y-(my-VHp/2)/cam.z;clampCam();FOLLOW=null;return;}
  if(!drag){if(tool==='select')cv.style.cursor=hoverHit(tp)?'pointer':'grab';return;}
  const dx=e.clientX-drag.lx,dy=e.clientY-drag.ly;drag.lx=e.clientX;drag.ly=e.clientY;drag.moved+=Math.abs(dx)+Math.abs(dy);
  if(drag.pan){if(drag.moved>5){cam.x-=dx/cam.z;cam.y-=dy/cam.z;clampCam();FOLLOW=null;}}
  else toolMove(tp);
});
const endPtr=e=>{
  const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;drag=null;return;}
  if(!had||!drag)return;
  if(drag.pan&&drag.moved<7&&drag.btn===0&&e.type==='pointerup')clickAt(tileAtS(e.clientX,e.clientY));
  else if(!drag.pan)toolUp();
  drag=null;if(tool==='select')cv.style.cursor='grab';
};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{hoverT=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();const before=s2w(e.clientX,e.clientY);cam.z=clamp(cam.z*Math.exp(-e.deltaY*.0015),minZoom(),2.6);const after=s2w(e.clientX,e.clientY);cam.x+=before.x-after.x;cam.y+=before.y-after.y;clampCam();},{passive:false});

function hoverHit(tp){if(!inMap(tp.x,tp.y))return false;const i=idx(tp.x,tp.y);if(G.stn[i]>=0||G.own[i]!==-1)return true;const m=G.track[i];if(m&&pieceCount(m)>1)return true;return!!trainAt(tp.wx,tp.wy);}
function trainAt(wx,wy){let best=null,bd=20;for(const t of G.trains)for(const p of vehiclePoses(t)){const d=Math.hypot(p.x-wx,p.y-wy);if(d<bd){bd=d;best=t;}}return best;}
function clickAt(tp){
  if(tool==='place'){placeTrainAt(tp.x,tp.y);return;}
  if(tool==='pick'){pickStation(tp.x,tp.y);return;}
  const tr=trainAt(tp.wx,tp.wy);if(tr){Snd.click();select('train',tr.id);return;}
  if(!inMap(tp.x,tp.y)){closePanel();return;}
  const i=idx(tp.x,tp.y),m=G.track[i];
  if(m&&pieceCount(m)>1){let be=-1,bd=1e9;for(let e=0;e<4;e++){if(edgeCount(m,e)<2)continue;const ex=tp.x*TS+H+DX[e]*H,ey=tp.y*TS+H+DY[e]*H,d=Math.hypot(ex-tp.wx,ey-tp.wy);if(d<bd){bd=d;be=e;}}
    if(be>=0){const k=tp.x+','+tp.y+','+be;G.sw[k]=((G.sw[k]||0)+1)%edgeCount(m,be);Snd.sw();for(let q=0;q<5;q++)puff(tp.x*TS+H+DX[be]*(H-5),tp.y*TS+H+DY[be]*(H-5),{vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,r:1.8,gr:0,max:.4,col:'255,214,90',a:1,kind:'spark'});return;}}
  if(G.stn[i]>=0){Snd.click();select('station',G.stn[i]);return;}
  const o=G.own[i];if(o>=2000){Snd.click();select('ind',o-2000);return;}if(o>=1000){Snd.click();select('town',o-1000);return;}
  closePanel();
}
function toolDown(tp){
  if(!inMap(tp.x,tp.y))return;
  if(tool==='track'){TD={tiles:[[tp.x,tp.y]],plan:null};}
  else{TD={done:new Set(),err:false};applyTile(tp);}
}
function applyTile(tp){
  if(!inMap(tp.x,tp.y))return;const k=idx(tp.x,tp.y);if(TD.done.has(k))return;TD.done.add(k);
  let r=false;
  if(tool==='station'){r=addStationTile(tp.x,tp.y);if(r===true){Snd.build(TD.done.size);for(let q=0;q<4;q++)puff(tp.x*TS+H,tp.y*TS+H,{vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,r:3,gr:7,max:.5,col:'230,220,200',a:.7});}}
  else if(tool==='bulldoze'){buildOcc();r=bulldozeAt(tp.x,tp.y);}
  else if(tool==='tree')r=plantAt(tp.x,tp.y);
  if(typeof r==='string'&&!TD.err){TD.err=true;errToast(r);}
}
function toolMove(tp){
  if(!TD)return;
  if(tool==='track'){
    if(!inMap(tp.x,tp.y))return;const T=TD.tiles;let[lx,ly]=T[T.length-1];let guard=0;
    while((lx!==tp.x||ly!==tp.y)&&guard++<200){const dx=tp.x-lx,dy=tp.y-ly;if(Math.abs(dx)>=Math.abs(dy))lx+=Math.sign(dx);else ly+=Math.sign(dy);
      const k=T.findIndex(([a,b])=>a===lx&&b===ly);if(k>=0)T.length=k+1;else T.push([lx,ly]);}
    buildOcc();TD.plan=planTrack(T);
  }else applyTile(tp);
}
function toolUp(){
  if(tool==='track'&&TD&&TD.plan&&TD.plan.items.length){const r=buildPlan(TD.plan);if(r!==true)errToast(r);}
  TD=null;
}

// keyboard
const keys=new Set();
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  const k=e.key.toLowerCase();
  if(k==='escape'){if(modalOpen)closeModal();else if(tool!=='select')setTool('select');else closePanel();return;}
  if(modalOpen)return;
  if(k===' '){e.preventDefault();setSpeed(G.speed?0:(G.prevSpeed||1));if(G.speed)G.prevSpeed=G.speed;return;}
  const tlist=['select','track','station','bulldoze','tree','trains'];if(/^[1-6]$/.test(k)){setTool(tlist[+k-1]);return;}
  const t=SEL&&SEL.k==='train'?G.trains.find(q=>q.id===SEL.id):null;
  if(t&&t.mode==='manual'){
    if(k==='w'||k==='arrowup'){t.thr=clamp(t.thr+.1,0,1);e.preventDefault();return;}
    if(k==='s'||k==='arrowdown'){t.thr=clamp(t.thr-.1,0,1);e.preventDefault();return;}
    if(k==='b'){t.brk=true;t.thr=0;return;}
    if(k==='r'){if(t.v<1){reversePath(t);t.rev=!t.rev;t.svc=-1;Snd.click();}return;}
  }
  if(t&&k==='h'){Snd.horn(ENGINES[t.eng].kind);return;}
  keys.add(k);
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys.delete(k);if(k==='b'&&SEL&&SEL.k==='train'){const t=G.trains.find(q=>q.id===SEL.id);if(t)t.brk=false;}});
window.addEventListener('blur',()=>keys.clear());

// =====================================================================
// MAIN LOOP
// =====================================================================
let lastT=performance.now(),uiAcc=0,saveAcc=0;
function frame(ts){
  const rdt=Math.min(.05,(ts-lastT)/1000);lastT=ts;
  try{
    if(G.speed>0){let simDt=rdt*G.speed;while(simDt>0){const s=Math.min(simDt,1/30);simStep(s);simDt-=s;}}
    // camera keys & follow
    const ps=420/cam.z*rdt;const manualSel=SEL&&SEL.k==='train'&&G.trains.find(q=>q.id===SEL.id&&q.mode==='manual');
    if(keys.has('a')||keys.has('arrowleft')){cam.x-=ps;FOLLOW=null;}if(keys.has('d')||keys.has('arrowright')){cam.x+=ps;FOLLOW=null;}
    if(!manualSel){if(keys.has('w')||keys.has('arrowup')){cam.y-=ps;FOLLOW=null;}if(keys.has('s')||keys.has('arrowdown')){cam.y+=ps;FOLLOW=null;}}
    if(FOLLOW){const t=G.trains.find(q=>q.id===FOLLOW);if(t){const p=pointBehind(t,trainLen(t)/2);cam.x=lerp(cam.x,p.x,Math.min(1,rdt*4));cam.y=lerp(cam.y,p.y,Math.min(1,rdt*4));}else FOLLOW=null;}
    clampCam();
    render(ts/1000,rdt);
    dispMoney+=(G.money-dispMoney)*Math.min(1,rdt*7);if(Math.abs(G.money-dispMoney)<1)dispMoney=G.money;moneyEl.textContent=fmt(dispMoney);
    uiAcc+=rdt;if(uiAcc>.25){uiAcc=0;updatePanel();checkGoals();updateClock();}
    saveAcc+=rdt;if(saveAcc>20){saveAcc=0;save();}
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
function updateClock(){const d=Math.floor(G.time/DAY)+1,h=(G.time%DAY)/DAY*24,hh=Math.floor(h),mm=Math.floor((h-hh)*60/10)*10;$('#clock').textContent=`Day ${d} · ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;$('#sun').textContent=daylight()>.4?'☀':'☾';}
function startGame(fresh){
  closePanel();FOLLOW=null;SEL=null;P.length=0;FX.length=0;BUILT.clear();DCACHE.clear();catchVer=-1;
  if(fresh||!load())newGame();
  bakeTerrain();
  clouds.length=0;for(let i=0;i<7;i++)clouds.push({x:Math.random()*MW*TS,y:Math.random()*MH*TS-100,s:1.2+Math.random()*1.6});
  resize();cam.z=clamp(window.innerWidth<760?.8:1.05,minZoom(),2.6);const cs=G.camStart||{x:MW*TS/2,y:MH*TS/2};cam.x=cs.x;cam.y=cs.y;clampCam();
  dispMoney=G.money;setSpeed(G.speed||1);setTool('select');renderGoal();updateClock();save();
}
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.addEventListener('pagehide',save);

startGame(false);
requestAnimationFrame(frame);
window.__pj={get G(){return G;},addStationTile,planTrack,buildPlan,spawnTrain,simStep,setTool,select,cam,distTo,buildOcc};
})();
</script>
