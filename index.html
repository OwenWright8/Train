<title>Puffwood Junction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: a 3D model-railway layout on a workshop table; rounded control cards float at the screen edges */
:root{
  --panel:#fffaf1; --panel2:#f3ead9; --ink:#3b342b; --muted:#867c6d; --line:rgba(96,72,40,.15);
  --accent:#e2683a; --accent-ink:#ffffff; --good:#2f8f6a; --gold:#e9b23c; --danger:#cc4636;
  --shadow:0 10px 30px rgba(70,48,18,.20),0 2px 6px rgba(70,48,18,.12);
  --scrim:rgba(40,30,15,.38); --hint:rgba(43,36,27,.82); --hint-ink:#fff;
  --bg:#d6c9b3;
  --display:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --pencil:'Caveat','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#24282b; --panel2:#2f3438; --ink:#f0e9dc; --muted:#a99f8f; --line:rgba(255,255,255,.10);
    --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
    --scrim:rgba(0,0,0,.5); --hint:rgba(20,22,24,.86); --bg:#2a2a2e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#24282b; --panel2:#2f3438; --ink:#f0e9dc; --muted:#a99f8f; --line:rgba(255,255,255,.10);
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.5); --hint:rgba(20,22,24,.86); --bg:#2a2a2e; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
#c{touch-action:none;outline:none}
#ov{pointer-events:none;z-index:1}
#tilt{position:fixed;inset:0;pointer-events:none;z-index:1;-webkit-backdrop-filter:blur(2.2px);backdrop-filter:blur(2.2px);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 26%,transparent 70%,#000 100%);mask-image:linear-gradient(180deg,#000 0%,transparent 26%,transparent 70%,#000 100%)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(40,25,10,.28) 100%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.2px}
.logo{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.pill{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-family:var(--display);font-weight:600;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e9b23c 60%,#c98f1c);box-shadow:inset 0 0 0 1.5px #c98f1c;flex:none;display:inline-block}
#moneyPill.bump{animation:bump .22s ease-out}
@keyframes bump{50%{transform:scale(1.12)}}
.seg{display:flex;gap:2px;padding:3px}
.seg button{border:0;background:transparent;width:34px;height:30px;border-radius:999px;display:grid;place-items:center}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);width:40px;height:40px;border-radius:50%;display:grid;place-items:center}

#goal{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(66px + env(safe-area-inset-top,0px));width:280px;padding:12px 14px;z-index:4;cursor:pointer}
#goal .eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
#goal h3{margin:3px 0 4px;font-family:var(--display);font-weight:600;font-size:17px;text-wrap:balance}
#goal p{margin:0;color:var(--muted);line-height:1.4;font-size:13px}
#goal .reward{margin-top:8px;display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:500;font-size:13px}
#goal.min p,#goal.min .reward{display:none}
#goal.flash{animation:goalflash .9s ease-out}
@keyframes goalflash{30%{transform:scale(1.05);box-shadow:0 0 0 6px rgba(233,178,60,.55),var(--shadow)}}

#tools{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:3px;padding:6px;border-radius:22px;z-index:5}
.tool{width:66px;height:58px;border:0;border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--display);font-size:12px;font-weight:500;transition:transform .15s,background .15s}
.tool:hover{background:var(--panel2)}
.tool.on{background:var(--accent);color:var(--accent-ink);transform:translateY(-4px)}
.tool svg.i{width:22px;height:22px}
#camctl{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:5}
#hint{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:7px 15px;border-radius:999px;background:var(--hint);color:var(--hint-ink);font-size:13px;width:max-content;max-width:calc(100% - 32px);text-align:center;pointer-events:none;z-index:4;line-height:1.35;transition:opacity .6s}

#panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 180px);overflow:auto;padding:14px;z-index:6}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ph .grow{flex:1;min-width:0}
.ph img{width:76px;height:34px;object-fit:contain;flex:none}
.ph input.name{width:100%;border:0;background:transparent;font-family:var(--display);font-weight:600;font-size:19px;padding:2px 4px;border-radius:8px}
.ph input.name:hover{background:var(--panel2)}
.sub{color:var(--muted);font-size:12.5px;padding-left:4px}
.x{border:0;background:var(--panel2);width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center}
.status{padding:8px 11px;border-radius:12px;background:var(--panel2);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;line-height:1.3}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--good)}
.dot.warn{background:var(--gold)}.dot.bad{background:var(--danger)}.dot.idle{background:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stats div{background:var(--panel2);border-radius:12px;padding:6px 9px}
.stats small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stats b{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.sect{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--panel2);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:3px;display:block}
.cars{display:flex;flex-direction:column;gap:4px}
.carrow{display:grid;grid-template-columns:82px 1fr 52px;align-items:center;gap:8px;font-size:12.5px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .25s}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:12px;padding:3px;margin:12px 0 4px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:7px;font-family:var(--display);font-weight:600}
.tabs button.on{background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.12)}
ol.orders{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ol.orders li{display:grid;grid-template-columns:24px 1fr auto auto;gap:6px;align-items:center;padding:6px;border-radius:12px;background:var(--panel2);border:2px solid transparent}
ol.orders li.cur{border-color:var(--accent)}
ol.orders .n{width:24px;height:24px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:12px}
ol.orders select{min-width:0;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px}
ol.orders label{font-size:11.5px;display:flex;align-items:center;gap:3px;white-space:nowrap;color:var(--muted)}
.mini-x{border:0;background:transparent;width:24px;height:24px;border-radius:50%;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 12px;font-family:var(--display);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.grow{flex:1;justify-content:center}
.btn.held{background:var(--danger);color:#fff}
.empty{color:var(--muted);font-size:13px;line-height:1.45;padding:8px 2px}
.tip{color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:8px}
.throttle{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center;margin-top:8px}
.throttle input{width:100%;accent-color:var(--accent);height:28px}
.throttle b{font-family:var(--display);font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.progress{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:6px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:99px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv b{font-variant-numeric:tabular-nums}

.modal-bg{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;padding:16px}
.modal{width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px 20px}
.mh{display:flex;align-items:center;gap:10px}
.mh h2{flex:1;margin:0;font-family:var(--display);font-weight:600;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.vcard{position:relative;border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:6px 10px 10px;text-align:left;display:flex;flex-direction:column;gap:3px}
.vcard.on{border-color:var(--accent);background:var(--panel)}
.vcard img{width:100%;height:64px;object-fit:contain}
.vcard b{font-family:var(--display);font-weight:600;font-size:15px}
.vcard small{color:var(--muted);font-size:12px;line-height:1.3}
.vcard .price{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:600;font-size:13px;margin-top:2px}
.vcard.locked{opacity:.55;cursor:not-allowed}
.vcard .lock{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--muted)}
.meter{display:inline-flex;gap:2px;vertical-align:middle}.meter i{width:12px;height:5px;border-radius:2px;background:var(--line)}.meter i.f{background:var(--accent)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.consist{background:var(--panel2);border-radius:14px;padding:10px;margin-top:10px}
.consist img{width:100%;height:84px;object-fit:contain;display:block}
.consist .chips{margin-top:6px}
.chip .rm{border:0;background:transparent;padding:0 0 0 2px;color:var(--muted);font-weight:700}
.mf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.mf input{flex:1;min-width:140px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px}
.total{font-family:var(--display);font-weight:600;display:flex;gap:6px;align-items:center}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel2);border:0;text-align:left}
.trow b{font-family:var(--display);font-weight:600}
.trow small{color:var(--muted)}
.trow img{width:90px;height:34px;object-fit:contain}
.menu{width:min(440px,100%)}
.menu .btn{width:100%;justify-content:flex-start;margin-top:6px}
.help{color:var(--muted);line-height:1.5;font-size:13.5px}
.help b{color:var(--ink)}
.region-card{width:min(460px,100%)}
.region-hero{height:120px;border-radius:14px;margin:12px 0;display:flex;align-items:flex-end;padding:12px 14px;color:#fff;font-family:var(--pencil);font-size:30px;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.regions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.regions span{padding:6px 9px;border-radius:10px;background:var(--panel2);font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.regions span i{width:10px;height:10px;border-radius:50%}

#toasts{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:30;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{padding:9px 16px;border-radius:999px;font-family:var(--display);font-weight:500;font-size:14.5px;animation:tin .35s cubic-bezier(.2,1.4,.4,1),tout .4s ease-in forwards;animation-delay:0s,var(--life,3s);text-align:center}
.toast.big{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:16px;font-weight:600}
.toast.err{color:var(--danger)}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}
.coinfly{position:fixed;left:0;top:0;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e9b23c 60%,#c98f1c);box-shadow:inset 0 0 0 1.5px #c98f1c;z-index:40;pointer-events:none;transition:transform .75s cubic-bezier(.55,-0.35,.6,1),opacity .2s .65s}
#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:var(--bg);font-family:var(--display);font-size:20px;transition:opacity .6s}
#boot.gone{opacity:0;pointer-events:none}
.hidden{display:none!important}

@media (max-width:760px){
  .brand span,#clockPill{display:none}
  .brand{padding:5px}
  #goal{width:auto;right:max(16px,env(safe-area-inset-right,0px));padding:9px 12px}
  #goal h3{font-size:15px}
  #panel{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-height:46%}
  .tool{width:50px;font-size:10.5px}
  #hint{bottom:calc(148px + env(safe-area-inset-bottom,0px));font-size:12px}
  #camctl{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .seg button{width:28px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

<canvas id="c" tabindex="0" aria-label="Model railway layout"></canvas>
<canvas id="ov" aria-hidden="true"></canvas>
<div id="tilt"></div><div id="vignette"></div>
<div id="boot">Laying the baseboards…</div>

<header id="top">
  <div class="brand card"><div class="logo"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="12" rx="3"/><path d="M5 10h14M8 20l-2 2M16 20l2 2M9 16v2M15 16v2"/></svg></div><span>Puffwood Junction</span></div>
  <div class="pill" id="moneyPill"><span class="coin"></span><span id="money">0</span></div>
  <div class="pill" id="clockPill"><span id="sun">☀</span><span id="clock">Day 1 · 08:00</span></div>
  <div class="spacer"></div>
  <div class="pill seg" id="speeds" role="group" aria-label="Game speed">
    <button data-s="0" title="Pause (Space)" aria-label="Pause"><svg class="i" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    <button data-s="1" title="Normal speed" aria-label="Normal speed"><svg class="i" viewBox="0 0 24 24"><path d="M8 6l9 6-9 6z"/></svg></button>
    <button data-s="2" title="Fast" aria-label="Fast"><svg class="i" viewBox="0 0 24 24"><path d="M4 6l7 6-7 6zM13 6l7 6-7 6z"/></svg></button>
    <button data-s="4" title="Very fast" aria-label="Very fast"><svg class="i" viewBox="0 0 24 24"><path d="M2 7l5 5-5 5zM9 7l5 5-5 5zM16 7l5 5-5 5z"/></svg></button>
  </div>
  <button class="iconbtn" id="muteBtn" aria-label="Sound on or off"></button>
  <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>

<div id="goal" class="card" role="button" tabindex="0" aria-label="Current goal"></div>

<nav id="tools" class="card" aria-label="Tools">
  <button class="tool" data-tool="select" title="Look & select (1)"><svg class="i" viewBox="0 0 24 24"><path d="M6 3l12 7-5.5 1.6L10 18z"/></svg>Select</button>
  <button class="tool" data-tool="track" title="Lay track (2)"><svg class="i" viewBox="0 0 24 24"><path d="M8 3v18M16 3v18M5 6.5h14M5 12h14M5 17.5h14"/></svg>Track</button>
  <button class="tool" data-tool="station" title="Build stations (3)"><svg class="i" viewBox="0 0 24 24"><path d="M3 10l9-6 9 6M5 10v10h14V10M10 20v-5h4v5"/></svg>Station</button>
  <button class="tool" data-tool="bulldoze" title="Remove (4)"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>Remove</button>
  <button class="tool" data-tool="tree" title="Plant trees (5)"><svg class="i" viewBox="0 0 24 24"><path d="M12 22v-5M12 2l6 8h-3l4 6H5l4-6H6z"/></svg>Trees</button>
  <button class="tool" data-tool="trains" title="Train yard (6)"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 9.5h14M8 20l-2 2M16 20l2 2"/><circle cx="9" cy="13" r=".6"/><circle cx="15" cy="13" r=".6"/></svg>Trains</button>
</nav>
<div id="camctl">
  <button class="iconbtn" id="rotL" aria-label="Turn the view left" title="Turn left (Q)"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg></button>
  <button class="iconbtn" id="rotR" aria-label="Turn the view right" title="Turn right (E)"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/></svg></button>
</div>
<div id="hint"></div>
<aside id="panel" class="card hidden" aria-live="polite"></aside>
<div id="toasts"></div>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(()=>{
'use strict';
if(!window.THREE){document.getElementById('boot').textContent='The 3D engine could not load. Check your connection and reload.';return;}
/* =====================================================================
   PUFFWOOD JUNCTION · a model railway on your table
   SIM:      pure game state in G (tiles, regions, track graph, trains, economy)
   RENDER3D: three.js diorama built from G; reads vehiclePoses() each frame
   UI:       DOM panels and a 2D overlay canvas for labels
   ===================================================================== */

// ---------------- CONSTANTS ----------------

const fmt=n=>Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(x,y,s=0){let h=(x*374761393+y*668265263+s*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vn(x,y,s){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return lerp(lerp(hash(ix,iy,s),hash(ix+1,iy,s),u),lerp(hash(ix,iy+1,s),hash(ix+1,iy+1,s),u),v);}
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const regionOf=(x,y)=>(y>=BH?2:0)+(x>=BW?1:0);
const regionBounds=ri=>{const rx=ri%2,ry=ri>>1;return{x0:rx*BW,y0:ry*BH,x1:rx*BW+BW-1,y1:ry*BH+BH-1};};

const nearSeam=(x,y)=>(x>=BW-2&&x<=BW+1)||(y>=BH-2&&y<=BH+1);
class Heap{constructor(){this.k=[];this.p=[];}
  get size(){return this.k.length;}
  push(k,p){const K=this.k,P=this.p;let i=K.length;K.push(k);P.push(p);while(i>0){const j=(i-1)>>1;if(P[j]<=p)break;K[i]=K[j];P[i]=P[j];i=j;}K[i]=k;P[i]=p;}
  pop(){const K=this.k,P=this.p,rk=K[0];this.lp=P[0];const lk=K.pop(),lp=P.pop();
    if(K.length){let i=0;const n=K.length;for(;;){let l=2*i+1;if(l>=n)break;const r=l+1;if(r<n&&P[r]<P[l])l=r;if(P[l]>=lp)break;K[i]=K[l];P[i]=P[l];i=l;}K[i]=lk;P[i]=lp;}
    return rk;}}

let G=null;

function newGame(seed){
  seed=(seed??Math.floor(Math.random()*1e9))>>>0;
  const R=mulberry32(seed);
  G={v:2,seed,money:8000,earned:0,delivered:0,time:DAY*8/24,speed:1,sw:{},swVer:1,stations:[],towns:[],inds:[],trains:[],nid:1,goal:0,trackVer:1,buildVer:1,pieces:0,
    eng:{puffer:true},reg:[true,false,false,false],
    terr:new Uint8Array(N),tree:new Uint8Array(N),track:new Uint8Array(N),stn:new Int16Array(N).fill(-1),own:new Int16Array(N).fill(-1)};
  const landFree=(x,y)=>inMap(x,y)&&!G.terr[idx(x,y)]&&G.own[idx(x,y)]===-1;
  const areaFree=(x0,y0,w,h)=>{for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)if(!landFree(x,y))return false;return true;};
  const inReg=(ri,x,y,m=0)=>{const b=regionBounds(ri);return x>=b.x0+m&&x<=b.x1-m&&y>=b.y0+m&&y<=b.y1-m;};
  REGIONS.forEach((RG,ri)=>{
    const b=regionBounds(ri);
    const blob=(type,count,rmin,rmax)=>{for(let c=0;c<count;c++){
      for(let a=0;a<60;a++){const cx=b.x0+2+R()*(BW-4),cy=b.y0+2+R()*(BH-4);if(nearSeam(Math.round(cx),Math.round(cy)))continue;
        const r=rmin+R()*(rmax-rmin);
        for(let y=Math.floor(cy-r-1);y<=cy+r+1;y++)for(let x=Math.floor(cx-r-1);x<=cx+r+1;x++){if(!inReg(ri,x,y)||nearSeam(x,y))continue;
          const d=Math.hypot((x+.5-cx)/1.15,y+.5-cy)+(vn(x*.7,y*.7,c+ri*7)-.5)*1.6;if(d<r)G.terr[idx(x,y)]=type;}
        break;}}};
    blob(1,RG.ponds,1.6,2.8);
    blob(2,RG.hills,RG.hill==='mound'?.9:1.1,RG.hill==='mound'?1.6:2.3);
  });
  // towns per region
  REGIONS.forEach((RG,ri)=>{
    const names=shuffle(RG.towns.slice(),R);let made=0;
    for(let a=0;a<3000&&made<RG.nTowns;a++){
      const b=regionBounds(ri),x=b.x0+3+Math.floor(R()*(BW-6)),y=b.y0+3+Math.floor(R()*(BH-6));
      if(nearSeam(x,y)||!areaFree(x-2,y-2,5,5))continue;
      if(G.towns.some(t=>Math.hypot(t.x-x,t.y-y)<10))continue;
      const ti=G.towns.length;const tw={x,y,name:names[made],pop:Math.round(80+R()*110),lvl:0,houses:[],acc:{},ri};
      G.towns.push(tw);G.own[idx(x,y)]=1000+ti;tw.houses.push({x,y,hall:true,c:0,r:0,s:1,born:-99});
      const target=Math.ceil(tw.pop/30)+1;for(let k=0;k<target;k++)addHouse(ti,R,true);
      made++;
    }
  });
  // industries per region
  REGIONS.forEach((RG,ri)=>{
    for(const type of RG.inds){
      for(let a=0;a<900;a++){
        const b=regionBounds(ri),x=b.x0+1+Math.floor(R()*(BW-3)),y=b.y0+1+Math.floor(R()*(BH-3));
        if(nearSeam(x,y)||nearSeam(x+1,y+1)||!areaFree(x-1,y-1,4,4))continue;
        if(G.towns.some(t=>Math.hypot(t.x-x,t.y-y)<6))continue;
        if(G.inds.some(t=>Math.hypot(t.x-x,t.y-y)<5))continue;
        const ii=G.inds.length;let near=null,bd=1e9;for(const t of G.towns){const d=Math.hypot(t.x-x,t.y-y);if(d<bd){bd=d;near=t;}}
        G.inds.push({type,x,y,name:(near?near.name+' ':'')+IND[type].name,acc:{},stock:0,ri});
        for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)G.own[idx(x+dx,y+dy)]=2000+ii;
        break;
      }
    }
  });
  // trees
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const i=idx(x,y);if(G.terr[i]||G.own[i]!==-1)continue;const ri=regionOf(x,y),RG=REGIONS[ri];
    const v=vn(x*.18,y*.18,40+ri);let p=v>.6?.75*RG.treeRate+.1:(v>.5?.25:.04);
    for(const ind of G.inds)if(ind.type==='forest'&&Math.abs(ind.x+.5-x)<4&&Math.abs(ind.y+.5-y)<4)p=Math.max(p,.6);
    for(const t of G.towns)if(Math.hypot(t.x-x,t.y-y)<4)p=Math.min(p,.03);
    if(R()<p)G.tree[i]=1+Math.floor(R()*4);
  }
  const t0=G.towns.find(t=>t.ri===0)||G.towns[0];
  G.camStart={x:(t0?t0.x:BW/2)*TS+H,y:(t0?t0.y:BH/2)*TS+H};
}

function addHouse(ti,rnd=Math.random,initial=false){
  const t=G.towns[ti];let best=null,bs=1e9;
  const rad=2+Math.ceil(Math.sqrt(t.houses.length)*1.1);
  for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
    const x=t.x+dx,y=t.y+dy;if(!inMap(x,y)||regionOf(x,y)!==t.ri)continue;const i=idx(x,y);
    if(G.terr[i]||G.own[i]!==-1||G.track[i]||G.stn[i]>=0)continue;
    let adj=false;for(let k=-1;k<=1&&!adj;k++)for(let l=-1;l<=1;l++){if(!k&&!l)continue;const X=x+l,Y=y+k;if(inMap(X,Y)&&G.own[idx(X,Y)]===1000+ti){adj=true;break;}}
    if(!adj)continue;
    const d=Math.hypot(dx,dy)+rnd()*1.7;if(d<bs){bs=d;best=[x,y];}
  }
  if(!best)return false;
  const i=idx(best[0],best[1]);G.own[i]=1000+ti;G.tree[i]=0;
  t.houses.push({x:best[0],y:best[1],c:Math.floor(rnd()*ROOFS.length),r:rnd()<.5?0:1,s:.85+rnd()*.25,born:initial?-99:G.time});
  G.buildVer++;return true;
}

// ---- track graph ----
function cands(s){
  const pc=PIECES[s.p],e=s.d?pc[0]:pc[1],nx=s.x+DX[e],ny=s.y+DY[e],out=[];
  if(!inMap(nx,ny))return out;const m=G.track[idx(nx,ny)];if(!m)return out;const en=(e+2)&3;
  for(let p=0;p<6;p++)if(m&(1<<p)){const q=PIECES[p];if(q[0]===en)out.push({x:nx,y:ny,p,d:0});else if(q[1]===en)out.push({x:nx,y:ny,p,d:1});}
  return out;
}
const flip=s=>({x:s.x,y:s.y,p:s.p,d:1-s.d});
const prevs=s=>cands(flip(s)).map(flip);
const key=s=>((s.y*MW+s.x)*6+s.p)*2+s.d;
function swKey(s){const pc=PIECES[s.p],e=s.d?pc[0]:pc[1];return(s.x+DX[e])+','+(s.y+DY[e])+','+((e+2)&3);}
function piecePoint(x,y,p,u){
  const cx=x*TS+H,cy=y*TS+H;
  if(p<2){const[a,b]=PIECES[p];const ax=cx+DX[a]*H,ay=cy+DY[a]*H,bx=cx+DX[b]*H,by=cy+DY[b]*H;return{x:ax+(bx-ax)*u,y:ay+(by-ay)*u,a:Math.atan2(by-ay,bx-ax)};}
  const g=CURVE[p],ang=g.aa+g.d*u;return{x:cx+g.kx+Math.cos(ang)*H,y:cy+g.ky+Math.sin(ang)*H,a:ang+(g.d>0?Math.PI/2:-Math.PI/2)};
}
function segPoint(s,t){let u=t/PLEN[s.p];if(s.d)u=1-u;const r=piecePoint(s.x,s.y,s.p,u);if(s.d)r.a+=Math.PI;return r;}
function pieceCount(m){let c=0;for(let p=0;p<6;p++)if(m&(1<<p))c++;return c;}
function edgeCount(m,e){let c=0;for(let p=0;p<6;p++)if(m&(1<<p)&&PIECES[p].includes(e))c++;return c;}
function connectsInto(x,y,e){const nx=x+DX[e],ny=y+DY[e];if(!inMap(nx,ny))return false;const m=G.track[idx(nx,ny)];const o=(e+2)&3;for(let p=0;p<6;p++)if(m&(1<<p)&&PIECES[p].includes(o))return true;return false;}

const DCACHE=new Map();
function distTo(stId){
  const c=DCACHE.get(stId);if(c&&c.ver===G.trackVer)return c.D;
  const D=new Float32Array(N*12).fill(Infinity),hp=new Heap();
  const st=stById(stId);
  if(st)for(const[x,y]of st.tiles){const m=G.track[idx(x,y)];for(let p=0;p<6;p++)if(m&(1<<p))for(let d=0;d<2;d++){const k=key({x,y,p,d});D[k]=0;hp.push(k,0);}}
  while(hp.size){
    const k=hp.pop(),dk=hp.lp;if(dk>D[k]+.01)continue;
    const d=k&1,r=k>>1,p=r%6,ti=(r-p)/6,x=ti%MW,y=(ti-x)/MW;
    for(const v of prevs({x,y,p,d})){const kv=key(v),nd=dk+PLEN[v.p];if(nd<D[kv]-.01){D[kv]=nd;hp.push(kv,D[kv]);}}
  }
  DCACHE.set(stId,{ver:G.trackVer,D});return D;
}

// ---- stations ----
function stById(id){for(const s of G.stations)if(s.id===id)return s;return null;}
function stationCenter(st){let x=0,y=0;for(const t of st.tiles){x+=t[0];y+=t[1];}st.cx=x/st.tiles.length;st.cy=y/st.tiles.length;}
function stationName(st){
  let best=null,bd=1e9;
  for(const t of G.towns){const d=Math.hypot(t.x-st.cx,t.y-st.cy);if(d<bd){bd=d;best=t.name;}}
  if(bd>7)for(const ind of G.inds){const d=Math.hypot(ind.x+.5-st.cx,ind.y+.5-st.cy);if(d<bd+2&&d<6){bd=d;best=ind.name;}}
  let name=best||'Halt';const used=new Set(G.stations.filter(s=>s!==st).map(s=>s.name));
  if(used.has(name)){for(const suf of[' Junction',' Halt',' Sidings',' Road',' Parkway']){if(!used.has(name+suf)){name+=suf;break;}}}
  return name;
}
function lockedMsg(x,y){return`Unlock ${REGIONS[regionOf(x,y)].name} first.`;}
function addStationTile(x,y){
  if(!inMap(x,y))return'off';const i=idx(x,y);
  if(!isOpen(x,y))return lockedMsg(x,y);
  if(G.stn[i]>=0)return'exists';
  const m=G.track[i];if(m!==1&&m!==2)return'Stations go on plain straight track.';
  if(G.terr[i])return'Stations can’t go on bridges.';
  if(G.money<COST.station)return'Not enough coins.';
  const ids=new Set();for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(inMap(nx,ny)){const s=G.stn[idx(nx,ny)];if(s>=0)ids.add(s);}}
  let st;
  if(!ids.size){st={id:G.nid++,name:'',tiles:[],cargo:{},col:STCOL[G.stations.length%STCOL.length]};G.stations.push(st);}
  else{const arr=[...ids];st=stById(arr[0]);
    for(let k=1;k<arr.length;k++){const o=stById(arr[k]);for(const[tx,ty]of o.tiles){G.stn[idx(tx,ty)]=st.id;st.tiles.push([tx,ty]);}for(const c in o.cargo)st.cargo[c]=(st.cargo[c]||0)+o.cargo[c];removeStationObj(o,st.id);}}
  st.tiles.push([x,y]);G.stn[i]=st.id;G.tree[i]=0;stationCenter(st);if(!st.name)st.name=stationName(st);
  G.money-=COST.station;G.trackVer++;G.buildVer++;BUILT.set(i,now());
  return true;
}
function removeStationObj(o,replaceId){
  G.stations=G.stations.filter(s=>s!==o);DCACHE.delete(o.id);
  for(const t of G.trains){
    for(const ord of t.orders)if(ord.st===o.id){if(replaceId!=null)ord.st=replaceId;else ord.dead=true;}
    t.orders=t.orders.filter(q=>!q.dead);if(t.oi>=t.orders.length)t.oi=0;
    if(t.at===o.id&&t.st==='load'){t.st=t.mode==='auto'?'depart':'manual';}
  }
}
function removeStationTile(x,y){
  const i=idx(x,y),id=G.stn[i];if(id<0)return;const st=stById(id);G.stn[i]=-1;
  if(st){st.tiles=st.tiles.filter(([a,b])=>a!==x||b!==y);if(!st.tiles.length)removeStationObj(st,null);else stationCenter(st);}
  G.trackVer++;G.buildVer++;
}

// ---- catchment ----
let catchVer=-1;const CATCH=new Map();let TSTS=[],ISTS=[];
function refreshCatch(){
  if(catchVer===G.buildVer)return;catchVer=G.buildVer;CATCH.clear();
  TSTS=G.towns.map(()=>[]);ISTS=G.inds.map(()=>[]);
  for(const st of G.stations){
    const towns=new Set(),inds=new Set();
    for(const[x,y]of st.tiles)for(let dy=-CR;dy<=CR;dy++)for(let dx=-CR;dx<=CR;dx++){const X=x+dx,Y=y+dy;if(!isOpen(X,Y))continue;const o=G.own[idx(X,Y)];if(o>=2000)inds.add(o-2000);else if(o>=1000)towns.add(o-1000);}
    const acc=new Set(),prod=new Set();
    for(const ti of towns){TOWN_ACC.forEach(c=>acc.add(c));prod.add('passengers');prod.add('mail');TSTS[ti].push(st.id);}
    for(const ii of inds){const d=IND[G.inds[ii].type];(d.acc||[]).forEach(c=>acc.add(c));if(d.prod)prod.add(d.prod);if(d.out)prod.add(d.out);ISTS[ii].push(st.id);}
    CATCH.set(st.id,{towns:[...towns],inds:[...inds],acc,prod});
  }
}
const catchOf=id=>{refreshCatch();return CATCH.get(id)||{towns:[],inds:[],acc:new Set(),prod:new Set()};};

// ---- economy ----
function give(ent,sts,c,amt){
  ent.acc[c]=(ent.acc[c]||0)+amt;const w=Math.floor(ent.acc[c]);if(w<1)return;ent.acc[c]-=w;if(!sts.length)return;
  let best=null;for(const id of sts){const st=stById(id);if(!st)continue;if(!best||(st.cargo[c]||0)<(best.cargo[c]||0))best=st;}
  if(best)best.cargo[c]=Math.min(CAP,(best.cargo[c]||0)+w);
}
function econTick(){
  refreshCatch();
  G.inds.forEach((ind,ii)=>{if(!G.reg[ind.ri])return;const d=IND[ind.type];
    if(d.prod)give(ind,ISTS[ii],d.prod,d.rate);
    if(d.out&&ind.stock>0){const n=Math.min(ind.stock,1.5);ind.stock-=n;give(ind,ISTS[ii],d.out,n);}
  });
  G.towns.forEach((t,ti)=>{if(!G.reg[t.ri])return;give(t,TSTS[ti],'passengers',t.pop/95);give(t,TSTS[ti],'mail',t.pop/420);});
}
function townLevel(pop){let l=0;for(let i=0;i<LEVELS.length;i++)if(pop>=LEVELS[i].pop)l=i;return l;}
function growTown(ti,amt){
  const t=G.towns[ti];t.pop+=amt;
  let guard=0;while(t.pop>t.houses.length*30+20&&guard++<4){if(!addHouse(ti))break;else HOOK.houseBuilt(t,t.houses[t.houses.length-1]);}
  const l=townLevel(t.pop);
  if(l>t.lvl){t.lvl=l;const bonus=400*l;G.money+=bonus;G.earned+=bonus;HOOK.levelUp(t,bonus);}
}
function deliverUnits(st,car,k){
  const c=car.c,from=stById(car.from);
  const dist=from?Math.abs(from.cx-st.cx)+Math.abs(from.cy-st.cy):4;
  const pay=Math.round(k*CARGO[c].rate*(dist*.6+2));
  const ca=catchOf(st.id);
  if(CARGO[c].grow&&ca.towns.length){let ti=ca.towns[0];for(const q of ca.towns)if(G.towns[q].pop<G.towns[ti].pop)ti=q;growTown(ti,k*CARGO[c].grow);}
  else for(const ii of ca.inds){const d=IND[G.inds[ii].type];if(d.acc&&d.acc.includes(c)){if(d.out)G.inds[ii].stock+=k;break;}}
  G.delivered+=k;return pay;
}
function unlockRegion(ri){
  const RG=REGIONS[ri];if(G.reg[ri])return true;if(G.money<RG.cost)return'Not enough coins.';
  G.money-=RG.cost;G.reg[ri]=true;G.buildVer++;G.trackVer++;HOOK.regionUnlocked(ri);return true;
}

// ---- trains ----
function trainLen(t){return ENGINES[t.eng].len+t.cars.length*(CARLEN+GAP);}
function specLen(spec){return ENGINES[spec.eng].len+spec.cars.length*(CARLEN+GAP);}
function pointBehind(t,d){
  const S=t.segs;if(d<=t.hp)return segPoint(S[0],t.hp-d);d-=t.hp;
  for(let i=1;i<S.length;i++){const L=PLEN[S[i].p];if(d<=L)return segPoint(S[i],L-d);d-=L;}
  return segPoint(S[S.length-1],0);
}
function vehiclePoses(t){
  const E=ENGINES[t.eng];const list=[{eng:true}].concat(t.cars.map(c=>({car:c})));if(t.rev)list.reverse();
  let off=0;const out=[];
  for(const v of list){const L=v.eng?E.len:CARLEN;const f=pointBehind(t,off),b=pointBehind(t,off+L);
    out.push({x:(f.x+b.x)/2,y:(f.y+b.y)/2,a:Math.atan2(f.y-b.y,f.x-b.x),L,v});off+=L+GAP;}
  return out;
}
function tailInfo(t){
  let rem=trainLen(t);if(rem<=t.hp)return{i:0,q:t.hp-rem};rem-=t.hp;
  for(let i=1;i<t.segs.length;i++){const L=PLEN[t.segs[i].p];if(rem<=L)return{i,q:L-rem};rem-=L;}
  return{i:t.segs.length-1,q:0};
}
function reversePath(t){
  const{i,q}=tailInfo(t);const ns=[];for(let j=i;j>=0;j--)ns.push(flip(t.segs[j]));
  t.hp=PLEN[t.segs[i].p]-q;t.segs=ns;t.v=0;
}
function nextSeg(t,s,commit){
  const c=cands(s);if(c.length<=1)return c[0]||null;
  const k=swKey(s);let i;
  if(t&&t.mode==='auto'&&t.st==='run'&&t.D){
    let best=Infinity;i=-1;for(let j=0;j<c.length;j++){const v=t.D[key(c[j])];if(v<best){best=v;i=j;}}
    if(i<0)i=(G.sw[k]||0)%c.length;
    else if(commit&&(G.sw[k]||0)!==i){G.sw[k]=i;G.swVer++;}
  }else i=(G.sw[k]||0)%c.length;
  return c[i];
}
const OCC=new Map(),BODY=new Map();
function buildOcc(){
  OCC.clear();BODY.clear();
  for(const t of G.trains){let rem=trainLen(t);const S=t.segs;
    let ti=idx(S[0].x,S[0].y);BODY.set(ti,t.id);rem-=t.hp;
    for(let i=1;i<S.length&&rem>0;i++){ti=idx(S[i].x,S[i].y);BODY.set(ti,t.id);rem-=PLEN[S[i].p];}}
  for(const[k,v]of BODY)OCC.set(k,v);
}
function lookahead(t){
  const res={d:0,train:false,dead:false};
  const tgt=(t.mode==='auto'&&t.st==='run'&&t.orders[t.oi])?t.orders[t.oi].st:-99;
  let s=t.segs[0],d=PLEN[s.p]-t.hp,inT=G.stn[idx(s.x,s.y)]===tgt;
  const reserveD=t.v*t.v/(2*BRAKE)+TS*1.5,maxD=Math.max(reserveD,TS*3)+TS*2;
  while(d<maxD){
    const c=nextSeg(t,s,false);
    if(!c){res.d=d;res.dead=true;return res;}
    if(tgt!==-99&&t.D&&t.D[key(c)]===Infinity){res.d=d;res.dead=true;return res;}
    const ti=idx(c.x,c.y),o=OCC.get(ti);
    if(o!==undefined&&o!==t.id){res.d=Math.max(0,d-12);res.train=true;res.by=o;return res;}
    const onT=G.stn[ti]===tgt;
    if(inT&&!onT){res.d=d;return res;}
    if(onT)inT=true;
    if(d<reserveD)OCC.set(ti,t.id);
    s=c;d+=PLEN[c.p];
  }
  res.d=d;return res;
}
function advance(t,ds){
  t.hp+=ds;
  while(t.hp>=PLEN[t.segs[0].p]){
    const c=nextSeg(t,t.segs[0],true);
    if(!c){t.hp=PLEN[t.segs[0].p];t.v=0;break;}
    t.hp-=PLEN[t.segs[0].p];t.segs.unshift(c);HOOK.tileEnter(t);
  }
  let rem=trainLen(t)+TS-t.hp,i=1;while(i<t.segs.length&&rem>0){rem-=PLEN[t.segs[i].p];i++;}
  t.segs.length=Math.max(1,i);
}
function loadFrac(t){let n=0,c=0;for(const car of t.cars){n+=car.n;c+=CARS[car.t].cap;}return c?n/c:0;}
function headStation(t){const s=t.segs[0];return G.stn[idx(s.x,s.y)];}
function arrive(t,stId){t.st='load';t.phase='unload';t.at=stId;t.lt=.35;t.dwell=0;t.pay=0;t.units=0;t.waiting=false;}
function finishLoad(t){
  if(t.pay>0)HOOK.payout(t,stById(t.at));
  t.waiting=false;
  if(t.mode==='auto'){if(t.orders.length)t.oi=(t.oi+1)%t.orders.length;t.st='depart';}
  else{t.st='manual';t.svc=t.at;}
}
function acceptedElsewhere(t,here){const s=new Set();for(const o of t.orders){if(o.st===here)continue;const c=catchOf(o.st);c.acc.forEach(x=>s.add(x));}return s;}
function loadStep(t,dt){
  t.lt-=dt;t.dwell+=dt;if(t.lt>0)return;t.lt=.12;
  const st=stById(t.at);if(!st){finishLoad(t);return;}
  const ca=catchOf(st.id);let moved=false;
  if(t.phase==='unload'){
    for(const car of t.cars){if(car.n>0&&car.c&&ca.acc.has(car.c)&&car.from!==st.id){const k=Math.min(3,car.n);car.n-=k;t.pay+=deliverUnits(st,car,k);t.units+=k;moved=true;if(car.n<=0){car.n=0;car.c=null;}}}
    if(moved)HOOK.unloadTick(t);
    else{if(t.pay>0){HOOK.payout(t,st);t.pay=0;}t.phase='load';}
    return;
  }
  const allow=t.mode==='auto'?acceptedElsewhere(t,st.id):null;
  for(const car of t.cars){
    const def=CARS[car.t],room=def.cap-car.n;if(room<=0)continue;
    const types=car.n>0&&car.c?[car.c]:def.cargo;let bt=null,ba=0;
    for(const c of types){if(allow&&!allow.has(c))continue;const a=Math.floor(st.cargo[c]||0);if(a>ba){ba=a;bt=c;}}
    if(!bt)continue;const k=Math.min(2,room,ba);car.c=bt;car.from=st.id;car.n+=k;st.cargo[bt]-=k;moved=true;
  }
  if(!moved){
    const ord=t.orders[t.oi];
    if(t.mode==='auto'&&ord&&ord.full&&ord.st===st.id){
      const need=t.cars.some(car=>{const def=CARS[car.t];return car.n<def.cap&&def.cargo.some(c=>ca.prod.has(c)&&(!allow||allow.has(c)));});
      if(need){t.waiting=true;return;}
    }
    if(t.dwell>1.3)finishLoad(t);
  }else t.waiting=false;
}
function departChoose(t){
  if(!t.orders.length){t.st='idle';return;}
  const tgt=t.orders[t.oi].st;const D=distTo(tgt);t.D=D;t.Dver=G.trackVer;t.Dst=tgt;
  if(headStation(t)===tgt&&t.orders.length>1){t.oi=(t.oi+1)%t.orders.length;return departChoose(t);}
  const f=D[key(t.segs[0])];const ti=tailInfo(t);const r=D[key(flip(t.segs[ti.i]))];
  if(f===Infinity&&r===Infinity){t.st='noroute';t.timer=2;return;}
  if(f===Infinity||r<f*.7-TS){reversePath(t);if(t.rev)t.rev=false;HOOK.runAround(t);}
  t.st='run';
}
function updateTrain(t,dt){
  const E=ENGINES[t.eng];
  if(t.mode==='auto'){
    if(t.st==='idle'||t.st==='manual')t.st=t.orders.length?'depart':'idle';
    if(t.st==='depart')departChoose(t);
    else if(t.st==='noroute'){t.timer-=dt;if(t.timer<=0)departChoose(t);}
    if(t.st==='run'){const tgt=t.orders[t.oi]&&t.orders[t.oi].st;if(tgt==null){t.st='idle';}else if(t.Dver!==G.trackVer||t.Dst!==tgt){t.D=distTo(tgt);t.Dver=G.trackVer;t.Dst=tgt;}}
  }else{
    if(t.st!=='load')t.st='manual';
    const hs=headStation(t);if(hs<0)t.svc=-1;
    if(t.st==='manual'&&t.v<.5&&hs>=0&&hs!==t.svc&&t.thr<.02){t.dwell2=(t.dwell2||0)+dt;if(t.dwell2>.6){t.dwell2=0;arrive(t,hs);}}else t.dwell2=0;
    if(t.st==='load'&&t.thr>.05){finishLoad(t);}
  }
  if(t.st==='load')loadStep(t,dt);
  const look=lookahead(t);t.blocked=look.train;t.blockedBy=look.train?look.by:0;
  if(look.train&&t.v<1)t.stuckT=(t.stuckT||0)+dt;else t.stuckT=0;
  const vmax=E.speed*(1-.22*loadFrac(t));
  let target=t.mode==='manual'?(t.st==='load'?0:t.thr*vmax):(t.st==='run'?vmax:0);
  if(t.brk)target=0;
  target=Math.min(target,Math.sqrt(2*BRAKE*Math.max(0,look.d-1)));
  const acc=E.accel*(1.15-.45*t.cars.length/E.maxCars);
  if(t.v<target)t.v=Math.min(target,t.v+acc*dt);else t.v=Math.max(target,t.v-BRAKE*1.4*dt);
  const ds=Math.min(t.v*dt,Math.max(0,look.d));
  if(ds<t.v*dt-1e-6)t.v=Math.min(t.v,ds/dt);
  if(ds>0)advance(t,ds);
  if(t.mode==='auto'&&t.st==='run'&&t.stuckT>4){
    const o=G.trains.find(q=>q.id===t.blockedBy);
    if(o&&o.blockedBy===t.id&&(o.mode!=='auto'||t.id>o.id)){const ti=tailInfo(t);if(t.D&&t.D[key(flip(t.segs[ti.i]))]<Infinity){reversePath(t);t.rev=false;t.stuckT=0;HOOK.runAround(t);return;}}
  }
  if(t.mode==='auto'&&t.st==='run'&&t.v<.6){
    const tgt=t.orders[t.oi].st;
    if(headStation(t)===tgt&&look.d<5)arrive(t,tgt);
    else if(look.dead&&look.d<5)t.st='depart';
  }
}
function spawnTrain(spec,x,y){
  const i=idx(x,y);if(G.stn[i]<0)return'Click on a station platform.';
  const m=G.track[i],p=m===1?0:1,sid=G.stn[i],len=specLen(spec);
  let best=null;
  for(const d of[0,1]){
    let s={x,y,p,d};
    for(let k=0;k<30;k++){const c=cands(s);if(c.length!==1)break;if(G.stn[idx(c[0].x,c[0].y)]!==sid)break;s=c[0];}
    const segs=[s],hp=PLEN[p]*.85;let cover=hp;
    while(cover<len+TS&&segs.length<80){const pv=prevs(segs[segs.length-1]);if(!pv.length)break;segs.push(pv[0]);cover+=PLEN[pv[0].p];}
    if(!best||cover>best.cover+1)best={segs,hp,cover};
  }
  if(best.cover<len*.6)return'Not enough track here for this train. Make the platform or line longer.';
  const t={id:G.nid++,name:spec.name,eng:spec.eng,color:spec.color,cars:spec.cars.map(c=>({t:c,c:null,n:0,from:-1})),segs:best.segs,hp:best.hp,v:0,mode:'auto',orders:[],oi:0,st:'idle',thr:0,brk:false,rev:false,profit:0,cost:spec.cost,svc:-1};
  let rem=len;buildOcc();
  const tiles=[idx(t.segs[0].x,t.segs[0].y)];rem-=t.hp;for(let k=1;k<t.segs.length&&rem>0;k++){tiles.push(idx(t.segs[k].x,t.segs[k].y));rem-=PLEN[t.segs[k].p];}
  if(tiles.some(q=>BODY.has(q)))return'Another train is in the way.';
  G.trains.push(t);
  t.orders=[{st:sid,full:false}];
  let bst=null,bd=Infinity;const tl=tailInfo(t);
  for(const st of G.stations){if(st.id===sid)continue;const D=distTo(st.id);const dd=Math.min(D[key(t.segs[0])],D[key(flip(t.segs[tl.i]))]);if(dd<bd){bd=dd;bst=st;}}
  if(bst)t.orders.push({st:bst.id,full:false});
  arrive(t,sid);
  return t;
}
function sellTrain(t){G.trains=G.trains.filter(q=>q!==t);G.money+=Math.round(t.cost*.6);}

let econAcc=0,costAcc=0;
function simStep(dt){
  G.time+=dt;
  econAcc+=dt;while(econAcc>=1){econAcc-=1;econTick();}
  costAcc+=dt;while(costAcc>=10){costAcc-=10;for(const t of G.trains)G.money-=ENGINES[t.eng].run/6;}
  buildOcc();
  const ts=G.trains.slice().sort((a,b)=>a.id-b.id);
  for(const t of ts)updateTrain(t,dt);
}

// ---- track building ----
function pieceFor(e1,e2){for(let p=0;p<6;p++){const[a,b]=PIECES[p];if((a===e1&&b===e2)||(a===e2&&b===e1))return p;}return-1;}
function dirTo(ax,ay,bx,by){if(bx>ax)return 1;if(bx<ax)return 3;if(by>ay)return 2;return 0;}
function planTrack(tiles){
  const out=[],n=tiles.length;let cost=0,err=null;if(n<2)return{items:out,cost,err};
  for(let i=0;i<n;i++){
    const[x,y]=tiles[i];
    let ep=i>0?dirTo(x,y,tiles[i-1][0],tiles[i-1][1]):-1,en=i<n-1?dirTo(x,y,tiles[i+1][0],tiles[i+1][1]):-1;
    const end=ep<0||en<0;
    if(end){
      const known=ep>=0?ep:en,straight=(known+2)&3;let g=-1;
      if(connectsInto(x,y,straight))g=straight;else for(const d of[(known+1)&3,(known+3)&3])if(connectsInto(x,y,d)){g=d;break;}
      if(g<0)g=straight;if(ep<0)ep=g;else en=g;
    }
    const p=pieceFor(ep,en),ii=idx(x,y),m=G.track[ii];let rep=-1,bad=null;
    if(!isOpen(x,y))bad=lockedMsg(x,y);
    else if(G.own[ii]!==-1)bad='Buildings are in the way.';
    else if(G.terr[ii]===2)bad='Rocks and hills are in the way.';
    else if(G.terr[ii]===1&&p>=2)bad='Bridges must be straight.';
    else if(G.stn[ii]>=0&&!(m&(1<<p)))bad='Can’t add junctions inside a station.';
    if(!bad&&end&&m&&!(m&(1<<p))&&pieceCount(m)===1&&G.stn[ii]<0&&!BODY.has(ii)){
      const q=Math.log2(m),[a,b]=PIECES[q],inner=i===0?en:ep,outer=i===0?ep:en;
      if(a===outer||b===outer){const o2=a===outer?b:a;if(o2!==inner&&!connectsInto(x,y,o2))rep=q;}
    }
    let c=0;if(!bad&&!(m&(1<<p))){c=G.terr[ii]?COST.bridge:COST.track;if(G.tree[ii])c+=COST.tree;}
    cost+=c;if(bad&&!err)err=bad;
    out.push({x,y,p,rep,bad,c});
  }
  return{items:out,cost,err};
}
function buildPlan(plan){
  if(plan.err)return plan.err;if(plan.cost>G.money)return'Not enough coins.';
  let k=0;
  for(const it of plan.items){const ii=idx(it.x,it.y);let m=G.track[ii];if(m&(1<<it.p))continue;
    if(it.rep>=0){m&=~(1<<it.rep);G.pieces--;}m|=1<<it.p;G.track[ii]=m;if(G.tree[ii]){G.tree[ii]=0;HOOK.treesChanged(it.x,it.y);}G.pieces++;HOOK.trackBuilt(it.x,it.y,k++);}
  G.money-=plan.cost;G.trackVer++;return true;
}
function bulldozeAt(x,y){
  if(!inMap(x,y))return false;const i=idx(x,y);
  if(!isOpen(x,y))return lockedMsg(x,y);
  if(G.track[i]){
    if(BODY.has(i))return'A train is on that track.';
    const pc=pieceCount(G.track[i]);G.money+=Math.round(pc*(G.terr[i]?COST.bridge:COST.track)/2);
    if(G.stn[i]>=0){removeStationTile(x,y);G.money+=COST.station/2;}
    G.pieces-=pc;G.track[i]=0;for(let e=0;e<4;e++)delete G.sw[x+','+y+','+e];G.trackVer++;HOOK.dust(x,y);HOOK.treesChanged(x,y);return true;
  }
  if(G.tree[i]){if(G.money<COST.tree)return'Not enough coins.';G.money-=COST.tree;G.tree[i]=0;HOOK.leaves(x,y);HOOK.treesChanged(x,y);return true;}
  return false;
}
function plantAt(x,y){
  if(!inMap(x,y))return false;const i=idx(x,y);
  if(!isOpen(x,y))return lockedMsg(x,y);
  if(G.terr[i]||G.own[i]!==-1||G.track[i]||G.tree[i])return false;
  if(G.money<COST.plant)return'Not enough coins.';
  G.money-=COST.plant;G.tree[i]=1+Math.floor(Math.random()*4);BUILT.set(i,now());HOOK.leaves(x,y,true);HOOK.treesChanged(x,y);return true;
}

// ---- save / load ----
const SAVE_KEY='puffwood-junction-v2';
function save(){
  if(!G)return;
  try{const o=Object.assign({},G);for(const k of['terr','tree','track','stn','own'])o[k]=Array.from(G[k]);
    localStorage.setItem(SAVE_KEY,JSON.stringify(o,(k,v)=>(k==='D'||k==='Dver'||k==='Dst')?undefined:v));}catch(e){}
}
function load(){
  try{const s=localStorage.getItem(SAVE_KEY);if(!s)return false;const o=JSON.parse(s);if(!o||o.v!==2)return false;

// ---- lighting ----
function daylight(){const h=(G.time%DAY)/DAY*24;if(h<5||h>=21)return 0;if(h<7)return(h-5)/2;if(h>19)return(21-h)/2;return 1;}
function duskTint(){const h=(G.time%DAY)/DAY*24;return Math.max(0,1-Math.abs(h-19)/1.6)+Math.max(0,1-Math.abs(h-6)/1.4);}
const _bg=new THREE.Color();
function lighting(){
  const light=daylight(),night=1-light,dusk=Math.min(1,duskTint());
  sun.intensity=.1+.66*light;hemi.intensity=.2+.36*light;
  sun.color.setRGB(1,.94-.22*dusk,.84-.38*dusk);hemi.color.setRGB(1-.4*night,.96-.35*night,.9-.15*night);
  _bg.copy(NIGHTBG).lerp(DAYBG,light).lerp(DUSKBG,dusk*.35);scene.background.copy(_bg);scene.fog.color.copy(_bg);
  WIN.emissiveIntensity=night*1.1;LAMP.emissiveIntensity=.4+night*1.6;
  for(const tv of trainVis.values())tv.glow.material.opacity=night*.75;
  return{light,night,dusk};
}

function labelPill(x,y,text,sub,bg,fg,size=13){
  const c=octx;c.font=`600 ${size}px Fredoka, ui-rounded, system-ui, sans-serif`;let w=c.measureText(text).width;let sw=0;
  if(sub){c.font='600 10.5px Nunito, system-ui, sans-serif';sw=c.measureText(sub).width;}
  const W=Math.max(w,sw)+18,Hh=sub?34:22;
  c.fillStyle='rgba(0,0,0,.18)';rrect(c,x-W/2+1,y-Hh/2+2,W,Hh,11);c.fill();
  c.fillStyle=bg;rrect(c,x-W/2,y-Hh/2,W,Hh,11);c.fill();
  c.fillStyle=fg;c.textAlign='center';c.textBaseline='middle';c.font=`600 ${size}px Fredoka, ui-rounded, system-ui, sans-serif`;c.fillText(text,x,sub?y-6:y+.5);
  if(sub){c.font='600 10.5px Nunito, system-ui, sans-serif';c.globalAlpha=.75;c.fillText(sub,x,y+8);c.globalAlpha=1;}

  thumbCam.aspect=w/h;const dist=Math.max(size.x/thumbCam.aspect,size.y*1.4)/(2*Math.tan(11*Math.PI/180))*1.08+20;
  thumbCam.position.set(ctr.x+dist*.35,ctr.y+dist*.42,ctr.z+dist*.84);thumbCam.lookAt(ctr);thumbCam.updateProjectionMatrix();
  thumbR.render(thumbScene,thumbCam);const url=thumbR.domElement.toDataURL('image/png');thumbScene.remove(g);THUMBS.set(k,url);if(THUMBS.size>80)THUMBS.delete(THUMBS.keys().next().value);return url;
}

const tileAtS=(sx,sy)=>{const w=worldAt(sx,sy);if(!w)return{x:-1,y:-1,wx:0,wy:0};return{x:Math.floor(w.x/TS),y:Math.floor(w.y/TS),wx:w.x,wy:w.y};};

  drag={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:0,pan:pan&&!rot,rot,btn:e.button,anchor:worldAt(e.clientX,e.clientY)};
  if(drag.pan&&tool==='select')cv.style.cursor='grabbing';
  if(!pan&&!rot)toolDown(tileAtS(e.clientX,e.clientY));

cv.addEventListener('pointermove',e=>{
  lastPtr={x:e.clientX,y:e.clientY};
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const tp=tileAtS(e.clientX,e.clientY);hoverT=inMap(tp.x,tp.y)?tp:null;
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);cam.dist=clamp(pinch.dist*pinch.d/d,MIND,MAXD);
    cam.yawT=cam.yaw=pinch.yaw-(Math.atan2(b.y-a.y,b.x-a.x)-pinch.ang);applyCam();
    if(pinch.anchor){const w=worldAt((a.x+b.x)/2,(a.y+b.y)/2);if(w){cam.x+=pinch.anchor.x-w.x;cam.y+=pinch.anchor.y-w.y;}}clampCam();FOLLOW=null;return;}
  if(!drag){if(tool==='select')cv.style.cursor=hoverHit(tp)?'pointer':'grab';return;}
  const dx=e.clientX-drag.lx;drag.lx=e.clientX;drag.ly=e.clientY;drag.moved+=Math.abs(dx)+Math.abs(e.movementY||0)+1*(Math.abs(dx)>0);
  if(drag.rot){cam.yawT=cam.yaw=cam.yaw-dx*.006;}
  else if(drag.pan){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>5&&drag.anchor){drag.moved=99;const w=worldAt(e.clientX,e.clientY);if(w){cam.x+=drag.anchor.x-w.x;cam.y+=drag.anchor.y-w.y;clampCam();applyCam();}FOLLOW=null;}}
  else toolMove(tp);
});
const endPtr=e=>{
  const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;drag=null;return;}

  if(drag.pan&&moved<6&&drag.btn===0&&e.type==='pointerup')clickAt(tileAtS(e.clientX,e.clientY),e.clientX,e.clientY);
  else if(!drag.pan&&!drag.rot)toolUp();

};

function hoverHit(tp){if(!inMap(tp.x,tp.y))return false;if(!G.reg[regionOf(tp.x,tp.y)])return true;const i=idx(tp.x,tp.y);if(G.stn[i]>=0||G.own[i]!==-1)return true;const m=G.track[i];if(m&&pieceCount(m)>1)return true;return!!trainAt(tp.wx,tp.wy);}
function trainAt(wx,wy){let best=null,bd=22;for(const t of G.trains)for(const p of vehiclePoses(t)){const d=Math.hypot(p.x-wx,p.y-wy);if(d<bd){bd=d;best=t;}}return best;}
function clickAt(tp,sx,sy){
  for(const p of lockPills)if(sx>=p.x&&sx<=p.x+p.w&&sy>=p.y&&sy<=p.y+p.h){Snd.click();openUnlock(p.ri);return;}
  if(tool==='place'){placeTrainAt(tp.x,tp.y);return;}
  if(tool==='pick'){pickStation(tp.x,tp.y);return;}
  const tr=trainAt(tp.wx,tp.wy);if(tr){Snd.click();select('train',tr.id);return;}
  if(!inMap(tp.x,tp.y)){closePanel();return;}
  if(!G.reg[regionOf(tp.x,tp.y)]){Snd.click();openUnlock(regionOf(tp.x,tp.y));return;}
  const i=idx(tp.x,tp.y),m=G.track[i];
  if(m&&pieceCount(m)>1){let be=-1,bd=1e9;for(let e=0;e<4;e++){if(edgeCount(m,e)<2)continue;const ex=tp.x*TS+H+DX[e]*H,ey=tp.y*TS+H+DY[e]*H,d=Math.hypot(ex-tp.wx,ey-tp.wy);if(d<bd){bd=d;be=e;}}
    if(be>=0){const k=tp.x+','+tp.y+','+be;G.sw[k]=((G.sw[k]||0)+1)%edgeCount(m,be);G.swVer++;Snd.sw();burst(tp.x*TS+H+DX[be]*(H-4),10,tp.y*TS+H+DY[be]*(H-4),6,'#ffd65a',30,{add:true});return;}}
  if(G.stn[i]>=0){Snd.click();select('station',G.stn[i]);return;}
  const o=G.own[i];if(o>=2000){Snd.click();select('ind',o-2000);return;}if(o>=1000){Snd.click();select('town',o-1000);return;}
  closePanel();
}
function toolDown(tp){
  if(!inMap(tp.x,tp.y))return;
  if(tool==='track'){TD={tiles:[[tp.x,tp.y]],plan:null};}
  else{TD={done:new Set(),err:false};applyTile(tp);}
}
function applyTile(tp){
  if(!inMap(tp.x,tp.y))return;const k=idx(tp.x,tp.y);if(TD.done.has(k))return;TD.done.add(k);
  let r=false;
  if(tool==='station'){r=addStationTile(tp.x,tp.y);if(r===true){Snd.build(TD.done.size);burst(tp.x*TS+H,6,tp.y*TS+H,4,'#e6dcc8',30,{r:6,gr:10,g:20,a:.7,max:.6});}}
  else if(tool==='bulldoze'){buildOcc();r=bulldozeAt(tp.x,tp.y);}
  else if(tool==='tree')r=plantAt(tp.x,tp.y);
  if(typeof r==='string'&&!TD.err){TD.err=true;errToast(r);}
}
function toolMove(tp){
  if(!TD)return;
  if(tool==='track'){
    if(!inMap(tp.x,tp.y))return;const T=TD.tiles;let[lx,ly]=T[T.length-1];if(lx===tp.x&&ly===tp.y)return;let guard=0;
    while((lx!==tp.x||ly!==tp.y)&&guard++<200){const dx=tp.x-lx,dy=tp.y-ly;if(Math.abs(dx)>=Math.abs(dy))lx+=Math.sign(dx);else ly+=Math.sign(dy);
      const k=T.findIndex(([a,b])=>a===lx&&b===ly);if(k>=0)T.length=k+1;else T.push([lx,ly]);}
    buildOcc();TD.plan=planTrack(T);buildGhost(TD.plan);
  }else applyTile(tp);
}
function toolUp(){
  if(tool==='track'&&TD&&TD.plan&&TD.plan.items.length){const r=buildPlan(TD.plan);if(r!==true)errToast(r);}
  TD=null;buildGhost(null);
}
const keys=new Set();
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  const k=e.key.toLowerCase();
  if(k==='escape'){if(modalOpen)closeModal();else if(tool!=='select')setTool('select');else closePanel();return;}
  if(modalOpen)return;
  if(k===' '){e.preventDefault();if(G.speed){G.prevSpeed=G.speed;setSpeed(0);}else setSpeed(G.prevSpeed||1);return;}
  const tlist=['select','track','station','bulldoze','tree','trains'];if(/^[1-6]$/.test(k)){setTool(tlist[+k-1]);return;}
  if(k==='q'){cam.yawT-=Math.PI/4;return;}if(k==='e'){cam.yawT+=Math.PI/4;return;}
  const t=SEL&&SEL.k==='train'?G.trains.find(q=>q.id===SEL.id):null;
  if(t&&t.mode==='manual'){
    if(k==='w'||k==='arrowup'){t.thr=clamp(t.thr+.1,0,1);e.preventDefault();return;}
    if(k==='s'||k==='arrowdown'){t.thr=clamp(t.thr-.1,0,1);e.preventDefault();return;}
    if(k==='b'){t.brk=true;t.thr=0;return;}
    if(k==='r'){if(t.v<1){reversePath(t);t.rev=!t.rev;t.svc=-1;Snd.click();}return;}
  }
  if(t&&k==='h'){Snd.horn(ENGINES[t.eng].kind);return;}
  keys.add(k);
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys.delete(k);if(k==='b'&&SEL&&SEL.k==='train'){const t=G.trains.find(q=>q.id===SEL.id);if(t)t.brk=false;}});
window.addEventListener('blur',()=>keys.clear());

// =====================================================================
// MAIN LOOP
// =====================================================================
let lastT=performance.now(),uiAcc=0,saveAcc=0;
function frame(ts){
  const rdt=Math.min(.05,(ts-lastT)/1000);lastT=ts;
  try{
    if(G.speed>0){let simDt=rdt*G.speed;while(simDt>0){const s=Math.min(simDt,1/30);simStep(s);simDt-=s;}}
    const ps=cam.dist*.9*rdt,manualSel=SEL&&SEL.k==='train'&&G.trains.find(q=>q.id===SEL.id&&q.mode==='manual');
    const fx=-Math.cos(cam.yaw),fz=Math.sin(cam.yaw);let mx=0,mz=0;
    if(keys.has('a')||keys.has('arrowleft')){mx-=1;}if(keys.has('d')||keys.has('arrowright')){mx+=1;}
    if(!manualSel){if(keys.has('w')||keys.has('arrowup'))mz-=1;if(keys.has('s')||keys.has('arrowdown'))mz+=1;}
    if(mx||mz){cam.x+=(mx*fx+mz*Math.sin(cam.yaw))*ps;cam.y+=(mx*fz+mz*Math.cos(cam.yaw))*ps;FOLLOW=null;}
    cam.yaw+=(cam.yawT-cam.yaw)*Math.min(1,rdt*8);
    if(FOLLOW){const t=G.trains.find(q=>q.id===FOLLOW);if(t){const p=pointBehind(t,trainLen(t)/2);cam.x=lerp(cam.x,p.x,Math.min(1,rdt*4));cam.y=lerp(cam.y,p.y,Math.min(1,rdt*4));}else FOLLOW=null;}
    clampCam();
    render(ts/1000,rdt);
    dispMoney+=(G.money-dispMoney)*Math.min(1,rdt*7);if(Math.abs(G.money-dispMoney)<1)dispMoney=G.money;moneyEl.textContent=fmt(dispMoney);
    uiAcc+=rdt;if(uiAcc>.25){uiAcc=0;updatePanel();checkGoals();updateClock();}
    saveAcc+=rdt;if(saveAcc>20){saveAcc=0;save();}
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
function updateClock(){const d=Math.floor(G.time/DAY)+1,h=(G.time%DAY)/DAY*24,hh=Math.floor(h),mm=Math.floor((h-hh)*60/10)*10;$('#clock').textContent=`Day ${d} · ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;$('#sun').textContent=daylight()>.4?'☀':'☾';}
function startGame(fresh){
  closePanel();FOLLOW=null;SEL=null;FX.length=0;BUILT.clear();DCACHE.clear();catchVer=-1;
  for(const p of PARTS)scene.remove(p.s);PARTS.length=0;for(const tv of trainVis.values())scene.remove(tv.group);trainVis.clear();houseMesh.clear();
  if(fresh||!load())newGame();
  for(let ri=0;ri<4;ri++)buildRegion(ri);
  trackBuiltVer=-1;swBuiltVer=-1;
  resize();cam.dist=MOBILE?900:1050;const cs=G.camStart||{x:BW*TS/2,y:BH*TS/2};cam.x=cs.x;cam.y=cs.y;clampCam();
  dispMoney=G.money;setSpeed(G.speed||1);setTool('select');renderGoal();updateClock();save();
}
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.addEventListener('pagehide',save);
startGame(false);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(let ri=0;ri<4;ri++)if(!G.reg[ri])buildRegion(ri);});
requestAnimationFrame(t=>{lastT=t;$('#boot').classList.add('gone');frame(t);});
window.__pj={get G(){return G;},addStationTile,planTrack,buildPlan,spawnTrain,simStep,setTool,select,cam,distTo,buildOcc,unlockRegion,worldAt,w2s};
})();
</script>
