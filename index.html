<title>Puffwood Junction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: four model-railway tables on a workshop floor, drawn as layered foam terrain; rounded cards float at the edges */
:root{
  --panel:#fffaf1; --panel2:#f3ead9; --ink:#3b342b; --muted:#867c6d; --line:rgba(96,72,40,.15);
  --accent:#e2683a; --accent-ink:#ffffff; --good:#2f8f6a; --gold:#e9b23c; --danger:#cc4636;
  --shadow:0 10px 30px rgba(70,48,18,.20),0 2px 6px rgba(70,48,18,.12);
  --scrim:rgba(40,30,15,.38); --hint:rgba(43,36,27,.82); --hint-ink:#fff;
  --bg:#3a2d22;
  --display:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --pencil:'Caveat','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#24282b; --panel2:#2f3438; --ink:#f0e9dc; --muted:#a99f8f; --line:rgba(255,255,255,.10);
    --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
    --scrim:rgba(0,0,0,.5); --hint:rgba(20,22,24,.86); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#24282b; --panel2:#2f3438; --ink:#f0e9dc; --muted:#a99f8f; --line:rgba(255,255,255,.10);
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.5); --hint:rgba(20,22,24,.86); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#tilt{position:fixed;inset:0;pointer-events:none;z-index:1;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 22%,transparent 74%,#000 100%);mask-image:linear-gradient(180deg,#000 0%,transparent 22%,transparent 74%,#000 100%)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(20,12,4,.35) 100%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.2px}
.logo{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.pill{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-family:var(--display);font-weight:600;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
button.pill{cursor:pointer}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-size:12px;line-height:18px}
.spacer{flex:1}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e9b23c 60%,#c98f1c);box-shadow:inset 0 0 0 1.5px #c98f1c;flex:none;display:inline-block}
#moneyPill.bump{animation:bump .22s ease-out}
@keyframes bump{50%{transform:scale(1.12)}}
.seg{display:flex;gap:2px;padding:3px}
.seg button{border:0;background:transparent;width:34px;height:30px;border-radius:999px;display:grid;place-items:center}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);width:40px;height:40px;border-radius:50%;display:grid;place-items:center}

#goal{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(66px + env(safe-area-inset-top,0px));width:290px;padding:12px 14px;z-index:4;cursor:pointer}
#goal .eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
#goal h3{margin:3px 0 4px;font-family:var(--display);font-weight:600;font-size:17px;text-wrap:balance}
#goal p{margin:0;color:var(--muted);line-height:1.4;font-size:13px}
#goal .reward{margin-top:8px;display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:500;font-size:13px}
.need{display:flex;flex-direction:column;gap:5px;margin-top:8px}
#goal.min p,#goal.min .reward,#goal.min .need{display:none}
#goal.flash{animation:goalflash .9s ease-out}
@keyframes goalflash{30%{transform:scale(1.05);box-shadow:0 0 0 6px rgba(233,178,60,.55),var(--shadow)}}
.needrow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;font-size:12.5px;font-weight:600}
.needrow i{width:10px;height:10px;border-radius:3px;display:block}
.needrow b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}

#tools{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:3px;padding:6px;border-radius:22px;z-index:5}
.tool{width:66px;height:58px;border:0;border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--display);font-size:12px;font-weight:500;transition:transform .15s,background .15s}
.tool:hover{background:var(--panel2)}
.tool.on{background:var(--accent);color:var(--accent-ink);transform:translateY(-4px)}
.tool svg.i{width:22px;height:22px}
#hint{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:7px 15px;border-radius:999px;background:var(--hint);color:var(--hint-ink);font-size:13px;width:max-content;max-width:calc(100% - 32px);text-align:center;pointer-events:none;z-index:4;line-height:1.35;transition:opacity .6s}

#panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 180px);overflow:auto;padding:14px;z-index:6}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ph .grow{flex:1;min-width:0}
.ph input.name{width:100%;border:0;background:transparent;font-family:var(--display);font-weight:600;font-size:19px;padding:2px 4px;border-radius:8px}
.ph input.name:hover{background:var(--panel2)}
.ttl{font-family:var(--display);font-weight:600;font-size:19px;padding:2px 4px}
.sub{color:var(--muted);font-size:12.5px;padding-left:4px}
.x{border:0;background:var(--panel2);width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center}
.status{padding:8px 11px;border-radius:12px;background:var(--panel2);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;line-height:1.3}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--good)}
.dot.warn{background:var(--gold)}.dot.bad{background:var(--danger)}.dot.idle{background:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stats div{background:var(--panel2);border-radius:12px;padding:6px 9px}
.stats small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stats b{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.sect{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--panel2);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:3px;display:block}
.cars{display:flex;flex-direction:column;gap:4px}
.carrow{display:grid;grid-template-columns:82px 1fr 52px;align-items:center;gap:8px;font-size:12.5px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .25s}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:12px;padding:3px;margin:12px 0 4px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:7px;font-family:var(--display);font-weight:600}
.tabs button.on{background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.12)}
ol.orders{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ol.orders li{display:grid;grid-template-columns:24px 1fr auto auto;gap:6px;align-items:center;padding:6px;border-radius:12px;background:var(--panel2);border:2px solid transparent}
ol.orders li.cur{border-color:var(--accent)}
ol.orders .n{width:24px;height:24px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:12px}
ol.orders select{min-width:0;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px}
ol.orders label{font-size:11.5px;display:flex;align-items:center;gap:3px;white-space:nowrap;color:var(--muted)}
.mini-x{border:0;background:transparent;width:24px;height:24px;border-radius:50%;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 12px;font-family:var(--display);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.grow{flex:1;justify-content:center}
.btn.held{background:var(--danger);color:#fff}
.empty{color:var(--muted);font-size:13px;line-height:1.45;padding:8px 2px}
.tip{color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:8px}
.throttle{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center;margin-top:8px}
.throttle input{width:100%;accent-color:var(--accent);height:28px}
.throttle b{font-family:var(--display);font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.progress{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:99px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv b{font-variant-numeric:tabular-nums}

.modal-bg{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;padding:16px}
.modal{width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px 20px}
.mh{display:flex;align-items:center;gap:10px}
.mh h2{flex:1;margin:0;font-family:var(--display);font-weight:600;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.vcard{position:relative;border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:6px 10px 10px;text-align:left;display:flex;flex-direction:column;gap:3px}
.vcard.on{border-color:var(--accent);background:var(--panel)}
.vcard canvas{align-self:center}
.vcard b{font-family:var(--display);font-weight:600;font-size:15px}
.vcard small{color:var(--muted);font-size:12px;line-height:1.3}
.vcard .price{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:600;font-size:13px;margin-top:2px}
.vcard.locked{opacity:.55;cursor:not-allowed}
.vcard .lock{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--muted)}
.meter{display:inline-flex;gap:2px;vertical-align:middle}.meter i{width:12px;height:5px;border-radius:2px;background:var(--line)}.meter i.f{background:var(--accent)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.consist{background:var(--panel2);border-radius:14px;padding:10px;margin-top:10px}
.consist .chips{margin-top:6px}
.chip .rm{border:0;background:transparent;padding:0 0 0 2px;color:var(--muted);font-weight:700}
.mf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.mf input{flex:1;min-width:140px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px}
.total{font-family:var(--display);font-weight:600;display:flex;gap:6px;align-items:center}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel2);border:0;text-align:left}
.trow b{font-family:var(--display);font-weight:600}
.trow small{color:var(--muted)}
.menu{width:min(440px,100%)}
.menu .btn{width:100%;justify-content:flex-start;margin-top:6px}
.help{color:var(--muted);line-height:1.5;font-size:13.5px}
.help b{color:var(--ink)}
.ctable{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.cregion h4{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.cregion h4 i{width:12px;height:12px;border-radius:4px}
.ccard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.ccard.done{opacity:.6}
.ccard.locked{opacity:.5}
.ccard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ccard .top b{font-family:var(--display);font-weight:600;font-size:15px}
.ccard .top span{font-family:var(--display);font-weight:600;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.ccard p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.4}
.ccard p b{color:var(--ink)}
.tag{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--muted)}
.tag.go{background:var(--accent);color:var(--accent-ink)}

#toasts{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:30;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{padding:9px 16px;border-radius:999px;font-family:var(--display);font-weight:500;font-size:14.5px;animation:tin .35s cubic-bezier(.2,1.4,.4,1),tout .4s ease-in forwards;animation-delay:0s,var(--life,3s);text-align:center}
.toast.big{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:16px;font-weight:600}
.toast.err{color:var(--danger)}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}
.coinfly{position:fixed;left:0;top:0;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e9b23c 60%,#c98f1c);box-shadow:inset 0 0 0 1.5px #c98f1c;z-index:40;pointer-events:none;transition:transform .75s cubic-bezier(.55,-0.35,.6,1),opacity .2s .65s}
.hidden{display:none!important}

@media (max-width:760px){
  .brand span,#clockPill,.ctext{display:none}
  .brand{padding:5px}
  #goal{width:auto;right:max(16px,env(safe-area-inset-right,0px));padding:9px 12px}
  #goal h3{font-size:15px}
  #panel{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-height:46%}
  .tool{width:50px;font-size:10.5px}
  #hint{bottom:calc(88px + env(safe-area-inset-bottom,0px));font-size:12px}
  .seg button{width:28px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

.cons{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.vchip{display:inline-flex;flex-direction:column;padding:4px 9px 4px 11px;border-radius:10px;background:var(--panel2);border-left:4px solid var(--c);line-height:1.15}
.vchip b{font-family:var(--display);font-weight:600;font-size:12.5px}.vchip small{color:var(--muted);font-size:11px}
.vchip.eng{background:var(--panel)}
.cut{border:1px dashed var(--line);background:transparent;border-radius:8px;width:24px;height:30px;padding:0;color:var(--muted);font-size:13px}
.cut:hover{color:var(--danger);border-color:var(--danger)}
.drive{background:var(--panel2);border-radius:14px;padding:10px}
.dirrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dirrow span{color:var(--muted);font-size:12.5px;font-weight:600}
.drive .btn{background:var(--panel)}.drive .btn.primary{background:var(--accent)}.drive .btn.held{background:var(--danger);color:#fff}
ol.phases{margin:6px 0 4px;padding-left:20px;font-size:12.5px;line-height:1.5;color:var(--muted)}
ol.phases li.ok{text-decoration:line-through;opacity:.7}ol.phases li.cur{color:var(--ink);font-weight:600}
ol.phases small{opacity:.8;font-weight:400}
#goal .srcl{margin-top:6px;font-size:12px}
#goal .need{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.need{display:flex;flex-direction:column;gap:5px}
@media (max-width:760px){#panel .sub,#panel p.tip,.dirrow span{display:none}.drive{padding:7px}.drive .row,.throttle{margin-top:4px}#panel .status{margin-bottom:6px;padding:6px 10px}#panel .sect{margin:8px 0 4px}}
</style>

<canvas id="c" tabindex="0" aria-label="Model railway tables"></canvas>
<div id="tilt"></div><div id="vignette"></div>

<header id="top">
  <div class="brand card"><div class="logo"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="12" rx="3"/><path d="M5 10h14M8 20l-2 2M16 20l2 2M9 16v2M15 16v2"/></svg></div><span>Puffwood Junction</span></div>
  <div class="pill" id="moneyPill"><span class="coin"></span><span id="money">0</span></div>
  <div class="pill" id="clockPill"><span id="sun">☀</span><span id="clock">Day 1 · 08:00</span></div>
  <button class="pill" id="contractsBtn" aria-label="Jobs"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/></svg><span class="ctext">Jobs</span><span class="badge" id="cBadge">0</span></button>
  <div class="spacer"></div>
  <div class="pill seg" id="speeds" role="group" aria-label="Game speed">
    <button data-s="0" title="Pause (Space)" aria-label="Pause"><svg class="i" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    <button data-s="1" title="Normal speed" aria-label="Normal speed"><svg class="i" viewBox="0 0 24 24"><path d="M8 6l9 6-9 6z"/></svg></button>
    <button data-s="2" title="Fast" aria-label="Fast"><svg class="i" viewBox="0 0 24 24"><path d="M4 6l7 6-7 6zM13 6l7 6-7 6z"/></svg></button>
    <button data-s="4" title="Very fast" aria-label="Very fast"><svg class="i" viewBox="0 0 24 24"><path d="M2 7l5 5-5 5zM9 7l5 5-5 5zM16 7l5 5-5 5z"/></svg></button>
  </div>
  <button class="iconbtn" id="muteBtn" aria-label="Sound on or off"></button>
  <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>

<script>
(()=>{
'use strict';
/* PUFFWOOD JUNCTION · Stage A: broken main lines, blueprint jobs, manual driving. */


// ---------------- CONSTANTS ----------------
const TS=40,H=20,BW=24,BH=16,GT=3,MW=BW*2+GT,MH=BH*2+GT,N=MW*MH;
const LIFT=9,THICK=26,FLOOR_L=-3,DAY=300,BRAKE=50,GAP=3,CR=3,CAP=160,CARLEN=26,VW=13;
const DX=[0,1,0,-1],DY=[-1,0,1,0];
const PIECES=[[0,2],[1,3],[0,1],[1,2],[2,3],[3,0]];
const QL=Math.PI*H/2;
const PLEN=[TS,TS,QL,QL,QL,QL];
const CURVE=PIECES.map(([a,b],p)=>{
  if(p<2)return null;
  const kx=(DX[a]+DX[b])*H,ky=(DY[a]+DY[b])*H;
  const aa=Math.atan2(DY[a]*H-ky,DX[a]*H-kx),ab=Math.atan2(DY[b]*H-ky,DX[b]*H-kx);
  let d=ab-aa;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  return{kx,ky,aa,d};
});
const REGIONS=[
  {key:'meadow',name:'Clover Meadows',accent:'#5f9a3e',towns:['Clovermead','Hayford','Buttercup Green'],inds:['farm','farm','foodplant','forest'],trees:['oak','oak','birch','bush'],house:'cottage',treeRate:.45,
   lev:['#72a94c','#80b454','#8fbf5c','#9dc964','#a9d06c'],faces:['#8b6a45','#9a7650','#7d5d3c'],water:'#5aaed0'},
  {key:'autumn',name:'Ember Woods',accent:'#d0702e',towns:['Maplewood','Acorn Hollow','Ember Glen'],inds:['forest','forest','sawmill'],trees:['autumn','autumn','pine','autumn'],house:'lodge',treeRate:.85,
   lev:['#8b9044','#999849','#a79d4e','#b3a053','#bea358'],faces:['#7a5232','#8a5e3a','#6c4729'],water:'#4f9fb8'},
  {key:'canyon',name:'Redrock Canyon',accent:'#c0603a',towns:['Sunmesa','Coyote Flats','Dustwell'],inds:['quarry','quarry','farm'],trees:['cactus','cactus','shrub','cactus'],house:'adobe',treeRate:.3,
   lev:['#c48455','#cd9160','#d59d69','#dca972','#e3b47d','#e9bf88'],faces:['#b5583a','#c96d44','#a64c32','#d07a4c'],water:'#55b3c2'},
  {key:'snow',name:'Frostpine Peaks',accent:'#5a7a96',towns:['Frostholm','Pinecrest','Snowbell'],inds:['mine','mine','power','forest'],trees:['snowpine','snowpine','snowpine','pine'],house:'chalet',treeRate:.6,
   lev:['#c9d6de','#d4dfe6','#dee7ec','#e7eef2','#eff4f7','#f6f9fb','#ffffff'],faces:['#7d858e','#8d959e','#6f767f'],water:'#cfe8f2',ice:true},

const TOWN_BUY={planks:90,slabs:120};
const PROJ_DEFS={
  shed:{name:'Fix up the Engine Shed',ri:0,phases:[{label:'Patch the roof and re-ballast the yard',need:{logs:6,gravel:4}}],reward:1500,note:'Unlocks buying cars at the depot and a bigger yard to build in.'},
  culvert:{name:'Washed-out Culvert',ri:0,obstacle:'washout',phases:[{label:'Fill the washout',need:{gravel:6}},{label:'Rebuild the timber trestle',need:{logs:4}}],reward:1200,note:'Reconnects the Cement Works and the next town.'},
  railyard:{name:'Old Rail Yard Siding',ri:0,obstacle:'overgrown',phases:[{label:'Clear the overgrown siding',need:{gravel:4,logs:4}}],reward:600,note:'Reaches an abandoned stockpile of rails and steel beams.'},
  bridgeA:{name:'The Ember Bridge',ri:0,gate:1,obstacle:'landslide',phases:[{label:'Clear the landslide',need:{slabs:4,beams:2}},{label:'Lay the bridge deck',need:{logs:6,rails:4}}],reward:3000,note:'Bridges the gap to Ember Woods.'},
  sawspur:{name:'Sawmill Spur',ri:1,obstacle:'washout',phases:[{label:'Rebuild the embankment',need:{gravel:6,slabs:2}}],reward:1500,note:'Reaches the Sawmill. Gravel and concrete have to come from Clover Meadows.'},
  mogul:{name:'Abandoned Siding',ri:1,obstacle:'overgrown',phases:[{label:'Relay the rotten siding',need:{planks:4,rails:2}}],reward:500,note:'An old Mogul engine was left here. Repair the siding and couple to it to recover it.'},
  camp2:{name:'Upper Camp Line',ri:1,obstacle:'landslide',phases:[{label:'Shore up the cutting',need:{planks:4,gravel:4}}],reward:1500,note:'Reaches the second Lumber Camp.'},
  tunnelT:{name:'Frostpine Pass Tunnel',ri:1,gate:3,obstacle:'landslide',locked:true,phases:[{label:'Blast the rockfall',need:{machinery:2}},{label:'Line the tunnel',need:{slabs:8,beams:4}}],reward:6000,note:'Coming in a future update. It needs machinery from beyond the pass.'},
};
const ROOFS=['#c8553f','#4f72a0','#d9963a','#5f8f63','#8a5b92','#b84a40','#6d7b88','#cf7b4a'];
const LEVELS=[{name:'Hamlet',pop:0},{name:'Village',pop:260},{name:'Town',pop:650},{name:'City',pop:1400}];
const COST={track:20,slope:30,bridge:70,tunnel:120,tree:10,plant:5};
const CROSS={A:{name:'Ember Bridge',from:0,to:1,dir:'h'},T:{name:'Frostpine Pass',from:1,to:3,dir:'v'}};

// ---------------- UTIL ----------------
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const idx=(x,y)=>y*MW+x;
const inMap=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
const fmt=n=>Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(x,y,s=0){let h=(x*374761393+y*668265263+s*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function field(cell,R){const gw=Math.ceil(MW/cell)+2,gh=Math.ceil(MH/cell)+2,g=new Float32Array(gw*gh);for(let i=0;i<g.length;i++)g[i]=R();
  return(x,y)=>{const fx=x/cell,fy=y/cell,ix=Math.floor(fx),iy=Math.floor(fy);let tx=fx-ix,ty=fy-iy;tx=tx*tx*(3-2*tx);ty=ty*ty*(3-2*ty);return lerp(lerp(g[iy*gw+ix],g[iy*gw+ix+1],tx),lerp(g[(iy+1)*gw+ix],g[(iy+1)*gw+ix+1],tx),ty);};}
const tableOf=(x,y)=>{const rx=x<BW?0:x>=BW+GT?1:-1,ry=y<BH?0:y>=BH+GT?1:-1;return rx<0||ry<0?-1:ry*2+rx;};
const tb=ri=>{const rx=ri%2,ry=ri>>1,x0=rx*(BW+GT),y0=ry*(BH+GT);return{x0,y0,x1:x0+BW-1,y1:y0+BH-1};};
const isOpen=(x,y)=>{if(!inMap(x,y))return false;const t=tableOf(x,y);return t>=0&&G.reg[t];};
function hexRGB(h){const c=parseInt(h.slice(1),16);return[c>>16,c>>8&255,c&255];}
function shade(hex,amt){let[r,g,b]=hexRGB(hex);if(amt>0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt;}else{r*=1+amt;g*=1+amt;b*=1+amt;}return`rgb(${r|0},${g|0},${b|0})`;}
class Heap{constructor(){this.k=[];this.p=[];}
  get size(){return this.k.length;}
  push(k,p){const K=this.k,P=this.p;let i=K.length;K.push(k);P.push(p);while(i>0){const j=(i-1)>>1;if(P[j]<=p)break;K[i]=K[j];P[i]=P[j];i=j;}K[i]=k;P[i]=p;}
  pop(){const K=this.k,P=this.p,rk=K[0];this.lp=P[0];const lk=K.pop(),lp=P.pop();
    if(K.length){let i=0;const n=K.length;for(;;){let l=2*i+1;if(l>=n)break;const r=l+1;if(r<n&&P[r]<P[l])l=r;if(P[l]>=lp)break;K[i]=K[l];P[i]=P[l];i=l;}K[i]=lk;P[i]=lp;}
    return rk;}}


const edgeHas=(m,e)=>{for(let p=0;p<6;p++)if(m&(1<<p)&&PIECES[p].includes(e))return true;return false;};
function cands(s){
  const pc=PIECES[s.p],e=s.d?pc[0]:pc[1],nx=s.x+DX[e],ny=s.y+DY[e],out=[];
  if(!inMap(nx,ny))return out;const j=idx(nx,ny),m=G.track[j];if(!m)return out;
  if(Math.abs(G.tl[j]-G.tl[idx(s.x,s.y)])>1)return out;const en=(e+2)&3;
  for(let p=0;p<6;p++)if(m&(1<<p)){const q=PIECES[p];if(q[0]===en)out.push({x:nx,y:ny,p,d:0});else if(q[1]===en)out.push({x:nx,y:ny,p,d:1});}
  return out;
}
const flip=s=>({x:s.x,y:s.y,p:s.p,d:1-s.d});
const prevs=s=>cands(flip(s)).map(flip);
const key=s=>((s.y*MW+s.x)*6+s.p)*2+s.d;
function swKey(s){const pc=PIECES[s.p],e=s.d?pc[0]:pc[1];return(s.x+DX[e])+','+(s.y+DY[e])+','+((e+2)&3);}
function zEdge(x,y,e){const i=idx(x,y),l=G.tl[i],nx=x+DX[e],ny=y+DY[e];if(!inMap(nx,ny))return l;const j=idx(nx,ny),m=G.track[j];if(!m||!edgeHas(m,(e+2)&3))return l;const ln=G.tl[j];return Math.abs(ln-l)>1?l:(l+ln)/2;}
function pieceZ(x,y,p,u){const[a,b]=PIECES[p];const zc=G.tl[idx(x,y)];return u<.5?lerp(zEdge(x,y,a),zc,u*2):lerp(zc,zEdge(x,y,b),u*2-1);}
function piecePoint(x,y,p,u){
  const cx=x*TS+H,cy=y*TS+H;
  if(p<2){const[a,b]=PIECES[p];const ax=cx+DX[a]*H,ay=cy+DY[a]*H,bx=cx+DX[b]*H,by=cy+DY[b]*H;return{x:ax+(bx-ax)*u,y:ay+(by-ay)*u,a:Math.atan2(by-ay,bx-ax)};}
  const g=CURVE[p],ang=g.aa+g.d*u;return{x:cx+g.kx+Math.cos(ang)*H,y:cy+g.ky+Math.sin(ang)*H,a:ang+(g.d>0?Math.PI/2:-Math.PI/2)};
}
function segPoint(s,t){let u=t/PLEN[s.p];if(s.d)u=1-u;const r=piecePoint(s.x,s.y,s.p,u);if(s.d)r.a+=Math.PI;r.z=pieceZ(s.x,s.y,s.p,u);return r;}
function pieceCount(m){let c=0;for(let p=0;p<6;p++)if(m&(1<<p))c++;return c;}
function edgeCount(m,e){let c=0;for(let p=0;p<6;p++)if(m&(1<<p)&&PIECES[p].includes(e))c++;return c;}
function connectsAny(x,y,e){const nx=x+DX[e],ny=y+DY[e];if(!inMap(nx,ny))return false;return edgeHas(G.track[idx(nx,ny)],(e+2)&3);}
function connectsInto(x,y,e){if(!connectsAny(x,y,e))return false;return Math.abs(G.tl[idx(x,y)]-G.tl[idx(x+DX[e],y+DY[e])])<=1;}


// =====================================================================
// SIM · world generation (fixed main lines, blueprint spans, docks)
// =====================================================================
let G=null;
const U8=()=>new Uint8Array(N),I8=()=>new Int8Array(N),I16=()=>new Int16Array(N).fill(-1);
const DOCK=new Map();
function crossTiles(id){const c=G.cross[id],out=[];if(c.dir==='h')for(let x=BW-2;x<=BW+GT+1;x++)out.push([x,c.at]);else for(let y=BH-2;y<=BH+GT+1;y++)out.push([c.at,y]);return out;}
function newGame(seed){const s=(seed??Math.floor(Math.random()*1e9))>>>0;for(let a=0;a<60;a++){let ok=false;try{ok=genWorld((s+a*7919)>>>0);}catch(e){console.warn('gen',e);ok=false;}if(ok)return;}throw new Error('Could not generate a layout');}
function carveRiver(ri,R,mode){
  const b=tb(ri),path=[];const horiz=R()<.5;
  if(horiz){let y=b.y0+3+Math.floor(R()*(BH-6));for(let x=b.x0;x<=b.x1;x++){path.push([x,y]);if(R()<.35){const ny=clamp(y+(R()<.5?-1:1),b.y0+2,b.y1-2);if(ny!==y){y=ny;path.push([x,y]);}}}}
  else{let x=b.x0+3+Math.floor(R()*(BW-6));for(let y=b.y0;y<=b.y1;y++){path.push([x,y]);if(R()<.35){const nx=clamp(x+(R()<.5?-1:1),b.x0+2,b.x1-2);if(nx!==x){x=nx;path.push([x,y]);}}}}
  const D=new Map();for(const[x,y]of path)for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const X=x+dx,Y=y+dy;if(!inMap(X,Y)||tableOf(X,Y)!==ri)continue;const d=Math.max(Math.abs(dx),Math.abs(dy)),k=idx(X,Y);if(!D.has(k)||D.get(k)>d)D.set(k,d);}
  for(const[k,d]of D){
    if(mode==='canyon'){if(d===0){G.terr[k]=1;G.h[k]=0;}else if(d<=2)G.h[k]=0;else if(d===3)G.h[k]=Math.min(G.h[k],2);}
    else if(mode==='valley'){if(d===0){G.terr[k]=1;G.h[k]=0;}else G.h[k]=Math.min(G.h[k],d);}
    else{if(d===0){G.terr[k]=1;G.h[k]=0;}else G.h[k]=Math.min(G.h[k],Math.max(0,d-1));}
  }
}
function lake(ri,R,r){const b=tb(ri);const cx=b.x0+4+R()*(BW-8),cy=b.y0+4+R()*(BH-8);
  for(let y=Math.floor(cy-r-2);y<=cy+r+2;y++)for(let x=Math.floor(cx-r-2);x<=cx+r+2;x++){if(!inMap(x,y)||tableOf(x,y)!==ri)continue;const d=Math.hypot(x+.5-cx,(y+.5-cy)*1.2);const i=idx(x,y);
    if(d<r){G.terr[i]=1;G.h[i]=0;}else if(d<r+1.5)G.h[i]=Math.min(G.h[i],1);}}
function addHouse(ti,rnd=Math.random,initial=false){
  const t=G.towns[ti];let best=null,bs=1e9;const rad=2+Math.ceil(Math.sqrt(t.houses.length)*1.1);
  for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
    const x=t.x+dx,y=t.y+dy;if(!inMap(x,y)||tableOf(x,y)!==t.ri)continue;const i=idx(x,y);
    if(G.terr[i]||G.own[i]!==-1||G.track[i]||G.bp[i]||G.res[i])continue;if(Math.abs(G.h[i]-G.h[idx(t.x,t.y)])>1)continue;
    let adj=false;for(let k=-1;k<=1&&!adj;k++)for(let l=-1;l<=1;l++){if(!k&&!l)continue;const X=x+l,Y=y+k;if(inMap(X,Y)&&G.own[idx(X,Y)]===1000+ti){adj=true;break;}}
    if(!adj)continue;const d=Math.hypot(dx,dy)+rnd()*1.7;if(d<bs){bs=d;best=[x,y];}}
  if(!best)return false;const i=idx(best[0],best[1]);G.own[i]=1000+ti;G.tree[i]=0;
  t.houses.push({x:best[0],y:best[1],c:Math.floor(rnd()*ROOFS.length),r:rnd()<.5?0:1,s:.85+rnd()*.25,born:initial?-99:G.time});G.buildVer++;return true;
}
function pieceFor(e1,e2){for(let p=0;p<6;p++){const[a,b]=PIECES[p];if((a===e1&&b===e2)||(a===e2&&b===e1))return p;}return-1;}
function dirTo(ax,ay,bx,by){if(bx>ax)return 1;if(bx<ax)return 3;if(by>ay)return 2;return 0;}

function genWorld(seed){
  const R=mulberry32(seed);
  G={v:4,seed,money:3000,earned:0,time:DAY*8/24,speed:1,sw:{},swVer:1,towns:[],inds:[],projects:[],trains:[],nid:1,trackVer:1,buildVer:1,pieces:0,
    reg:[true,false,false,false],cross:{},g:{},depot:null,shop:false,
    terr:U8(),tree:U8(),track:U8(),own:I16(),h:I8(),tl:I8(),tk:U8(),fix:U8(),bp:U8(),bpK:U8(),bpP:I16(),seen:U8(),zone:U8(),res:U8()};
  const n1=field(7,R),n2=field(3,R),n3=field(4,R);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=idx(x,y),ri=tableOf(x,y);
    if(ri<0){G.terr[i]=3;G.h[i]=FLOOR_L;continue;}
    const v=clamp((n1(x,y)*.7+n2(x,y)*.3-.22)/.56,0,1),k=REGIONS[ri].key;
    G.h[i]=k==='meadow'?Math.round(v*2.3):k==='autumn'?Math.round(v*3):k==='snow'?Math.round(Math.pow(v,1.1)*6.4):3+(n3(x,y)>.66?2:0);}
  for(let ri=0;ri<4;ri++){const k=REGIONS[ri].key;carveRiver(ri,R,k==='canyon'?'canyon':k==='snow'?'valley':'river');if(k!=='canyon'&&k!=='autumn')lake(ri,R,k==='meadow'?1.6:2.2);}
  G.cross.A={dir:'h',at:4+Math.floor(R()*(BH-9))};G.cross.T={dir:'v',at:BW+GT+5+Math.floor(R()*(BW-10))};

function srcLine(p){const need=curNeed(p);return Object.keys(need).filter(k=>(p.prog[k]||0)<need[k]).map(k=>`<b>${CARGO[k].short||CARGO[k].name}</b> from ${SRC[k]}`).join('; ');}
function guide(){
  const bes=G.trains.find(t=>t.veh.some(v=>v.kind==='eng'&&v.e==='shunter'));
  if(!G.g.met)return{eb:'Getting started',t:'Meet Old Bessie',h:`Your depot has one tired shunter and three old cars. ${COARSE?'Tap':'Click'} the yellow shunter to take the controls.`,focus:bes};
  if(!G.g.coupled)return{eb:'Getting started',t:'Couple up the cars',h:'Raise the throttle and creep Old Bessie into the cars parked on the siding. They couple when you touch them. Use Reverse to change direction.',focus:bes};
  for(const id of ORDER){const p=projBy(id);if(!p||p.done||!G.reg[projDef(p).ri])continue;const D=projDef(p);
    if(!p.seen)return{eb:'Explore',t:'Scout the line',h:`There is more to find on ${REGIONS[D.ri].name}. Drive along the main line (the Scout draisine is fast and sees far) to uncover what is out there.`};
    return{eb:`Job · ${REGIONS[D.ri].name}`,t:D.name,h:`${D.phases.length>1?`Phase ${p.phase+1} of ${D.phases.length}: `:''}${D.phases[p.phase].label}. Stop loaded cars next to the orange sign to unload.`,p,src:srcLine(p),reward:D.reward,note:D.note};}
  return{eb:'All jobs done',t:'Free play',h:'Ember Woods is connected. Keep the towns supplied and grow your yards. Frostpine Pass opens in a future update.'};
}
const goalEl=$('#goal');let goalMin=window.innerWidth<760,goalSig='';
function renderGoal(force){
  const g=guide(),sig=JSON.stringify([g.t,g.h,g.p?g.p.prog:0,goalMin]);if(!force&&sig===goalSig)return;goalSig=sig;
  goalEl.classList.toggle('min',goalMin);
  goalEl.innerHTML=`<div class="eyebrow"><span>${esc(g.eb)}</span><span>${goalMin?'▾':'▴'}</span></div><h3>${esc(g.t)}</h3><p>${esc(g.h)}</p>${g.p?`<div class="need">${needRows(g.p)}</div><p class="srcl">${g.src}</p>`:''}${g.reward?`<div class="reward"><span class="coin"></span>Reward ${fmt(g.reward)}</div>`:''}`;
  goalEl.classList.remove('flash');void goalEl.offsetWidth;goalEl.classList.add('flash');
}
goalEl.addEventListener('click',()=>{goalMin=!goalMin;renderGoal(true);});
goalEl.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goalMin=!goalMin;renderGoal(true);}});
function updateBadge(){$('#cBadge').textContent=G.projects.filter(p=>projActive(p)&&p.seen).length;}
function focusTile(i){const x=i%MW,y=(i-x)/MW;cam.x=x*TS+H;cam.y=y*TS-lev(x,y)*LIFT;FOLLOW=null;clampCam();}

// ---- jobs ----
function projStatus(p){const D=projDef(p);if(p.done)return['Done',''];if(D.locked)return['Future update',''];if(!G.reg[D.ri])return['Region closed',''];if(!p.seen)return['Not found yet',''];return['Open','go'];}
function openContracts(){
  const regions=[0,1].map(ri=>{const ps=G.projects.filter(p=>projDef(p).ri===ri);
    return`<div class="cregion"><h4><i style="background:${REGIONS[ri].accent}"></i>${esc(REGIONS[ri].name)}${G.reg[ri]?'':' · not reached yet'}</h4>${ps.map(p=>{const D=projDef(p),[st,cl]=projStatus(p),show=p.seen&&!D.locked&&G.reg[D.ri];
      const ph=D.phases.map((f,k)=>`<li class="${p.done||k<p.phase?'ok':k===p.phase&&show?'cur':''}">${esc(f.label)} <small>${Object.keys(f.need).map(c=>`${f.need[c]} ${(CARGO[c].short||CARGO[c].name).toLowerCase()}`).join(', ')}</small></li>`).join('');
      return`<div class="ccard ${p.done?'done':''} ${!show&&!p.done?'locked':''}"><div class="top"><b>${show||p.done?esc(D.name):'???'}</b><span class="tag ${cl}">${st}</span></div>
        <p>${show||p.done?esc(D.note):p.seen?esc(D.note):'Explore to find this job.'}</p>${show||p.done?`<ol class="phases">${ph}</ol>`:''}
        ${show&&!p.done?`<div class="need">${needRows(p)}</div><div class="row"><span class="tip" style="flex:1;margin:0">${srcLine(p)}</span><button class="btn" data-show="${p.idx}">Show</button></div>`:''}
        <div class="tip" style="margin:0">Reward <b>${fmt(D.reward)}</b>${D.gate!=null?` · opens ${esc(REGIONS[D.gate].name)}`:''}</div></div>`;}).join('')}</div>`;}).join('');
  openModal(`<div class="modal card"><div class="mh"><h2>Jobs</h2><button class="x" data-a="close" aria-label="Close">✕</button></div><p class="help">The main lines are broken. Each job shows as blueprint track: haul the materials there and the crews rebuild it, phase by phase.</p><div class="ctable">${regions}</div></div>`,m=>{
    m.querySelector('[data-a=close]').onclick=closeModal;m.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{const p=G.projects[+b.dataset.show];closeModal();focusTile(p.site);select('proj',p.idx);});});
}
$('#contractsBtn').addEventListener('click',()=>{Snd.init();Snd.click();openContracts();});

// ---- fleet ----
function consistText(t){return t.veh.map(v=>v.kind==='eng'?v.name:CARS[v.t].name+(v.n?` (${v.n} ${(CARGO[v.c].short||CARGO[v.c].name).toLowerCase()})`:'')).join(' · ');}
function openFleet(){
  const list=G.trains.filter(t=>{const h=pointBehind(t,0);return G.seen[idx(Math.floor(h.x/TS),Math.floor(h.y/TS))];});
  const shop=G.shop?`<div class="sect">Depot · buy a car</div><div class="grid">${Object.keys(CARS).map(k=>`<button class="vcard" data-buy="${k}"><b>${CARS[k].name}</b><small>Carries ${CARS[k].cargo.map(c=>CARGO[c].short||CARGO[c].name).join(', ').toLowerCase()} · ${CARS[k].cap} per car</small><span class="price"><span class="coin"></span>${fmt(CARS[k].cost)}</span></button>`).join('')}</div>`
    :`<p class="tip">There is no train shop. You run what you have, and find more out on the line. Fix up the Engine Shed to buy the odd car.</p>`;
  openModal(`<div class="modal card"><div class="mh"><h2>Fleet</h2><button class="x" data-a="close" aria-label="Close">✕</button></div><div class="tlist">${list.map(t=>`<button class="trow" data-t="${t.id}"><span><b>${esc(t.ab?'Abandoned: '+t.name:t.name)}</b><br><small>${esc(consistText(t))}</small></span><small>${esc(statusOf(t)[0])}</small></button>`).join('')||'<p class="empty">No trains in sight.</p>'}</div>${shop}</div>`,m=>{
    m.querySelector('[data-a=close]').onclick=closeModal;
    m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=G.trains.find(q=>q.id===+b.dataset.t);closeModal();if(t){select('train',t.id);FOLLOW=t.id;}});
    m.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const r=buyCar(b.dataset.buy);if(r===true){closeModal();focusTile(idx(...G.depot.tiles[4]));}else errToast(r);});});
}

// ---- panels ----
const panel=$('#panel');let panelSig='';
function closePanel(){SEL=null;panel.classList.add('hidden');panel.innerHTML='';panelSig='';}
function select(k,id){SEL={k,id};panelSig='';buildPanel();}
const selTrain=()=>SEL&&SEL.k==='train'?G.trains.find(q=>q.id===SEL.id):null;
function statusOf(t){
  if(t.ab)return['Abandoned. Repair its siding, then drive an engine into it to recover it.','idle'];
  if(!hasEng(t))return['Parked. Push an engine into these cars to couple them.','idle'];
  if(t.heavy)return[`Too heavy: this engine can only pull ${t.pull} car${t.pull===1?'':'s'}. Cut some off.`,'bad'];
  if(t.v<.5&&t.svcMsg)return[t.svcMsg,/needs|nothing|full|takes|buys/.test(t.svcMsg)?'warn':''];
  if(t.v<.5&&t.thr>0&&t.look&&t.look.dead)return['End of the line. Reverse to go back.','warn'];
  if(t.v<.5&&t.brk)return['Brakes on','idle'];
  if(t.v<.5)return[t.thr>0?'Starting…':'Stopped. Raise the throttle to move.','idle'];
  return[`${Math.round(t.v)} mph${t.grade>0?' · climbing':t.grade<0?' · downhill':''}`,''];
}
function consHtml(t){
  return t.veh.map((v,i)=>{const cut=i>0&&!t.ab&&hasEng(t)?`<button class="cut" data-cut="${i}" title="Uncouple here" aria-label="Uncouple here">✂</button>`:'';
    const body=v.kind==='eng'?`<span class="vchip eng" style="--c:${v.color}"><b>${esc(v.name)}</b><small>${ENGINES[v.e].name}</small></span>`
      :`<span class="vchip" style="--c:${CARS[v.t].col}"><b>${CARS[v.t].name}</b><small>${v.n?`${v.n}/${CARS[v.t].cap} ${(CARGO[v.c].short||CARGO[v.c].name).toLowerCase()}`:'empty'}</small></span>`;return cut+body;}).join('');
}
function trainPanel(t){
  const e=t.veh.find(v=>v.kind==='eng'),E=e?ENGINES[e.e]:null,drive=e&&!t.ab;
  return`<div class="ph"><div class="grow"><div class="ttl">${esc(t.ab?'Abandoned '+t.name:t.name)}</div><div class="sub">${E?esc(E.desc)+(E.pull?` Pulls ${E.pull} cars.`:''):'Uncoupled rolling stock'}</div></div><button class="x" data-a="close" aria-label="Close">✕</button></div>
  <div class="status"><span class="dot" id="pdot"></span><span id="pst"></span></div>
  ${drive?`<div class="drive"><div class="dirrow"><button class="btn" data-a="rev">⇄ Reverse</button><span id="pdir"></span></div>
    <div class="throttle"><input type="range" min="0" max="100" step="5" id="thr" aria-label="Throttle"><b id="thrv">0%</b></div>
    <div class="row"><button class="btn grow" data-a="brk">Brake</button><button class="btn" data-a="horn">Horn</button><button class="btn" data-a="follow">Follow</button></div></div>`:''}
  <div class="sect">Consist<span>${drive?'✂ to uncouple':''}</span></div><div class="cons" id="pcons"></div>
  ${drive?`<p class="tip">${COARSE?'':'Keys: W/S throttle, R reverse, hold B to brake, H horn. '}Stop under a crane to load or unload. Push into cars to couple.</p>`:''}`;
}
function wireTrain(t){
  const q=s=>panel.querySelector(s);q('[data-a=close]').onclick=closePanel;
  if(q('#thr')){q('#thr').oninput=e=>{const tt=selTrain();if(!tt)return;tt.thr=+e.target.value/100;tt.brk=false;q('#thrv').textContent=e.target.value+'%';if(!FOLLOW&&tt.thr>0)FOLLOW=tt.id;};
    q('[data-a=rev]').onclick=()=>{const tt=selTrain();if(!tt)return;if(tt.v>1){errToast('Stop the train before reversing.');return;}reverseTrain(tt);tt.thr=0;Snd.click();updatePanel(true);};
    const b=q('[data-a=brk]'),on=()=>{const tt=selTrain();if(tt){tt.brk=true;tt.thr=0;b.classList.add('held');}},off=()=>{const tt=selTrain();if(tt)tt.brk=false;b.classList.remove('held');};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
    q('[data-a=horn]').onclick=()=>{const tt=selTrain();if(tt)toot(tt);};
    q('[data-a=follow]').onclick=()=>{const tt=selTrain();if(tt)FOLLOW=FOLLOW===tt.id?null:tt.id;updatePanel(true);};}
}
function indPanel(o){const D=IND[o.type],ks=Object.keys(o.stock).filter(k=>o.stock[k]>0);
  return`<div class="ph"><div class="grow"><div class="ttl">${esc(o.name)}</div><div class="sub">${esc(REGIONS[o.ri].name)}</div></div><button class="x" data-a="close" aria-label="Close">✕</button></div><p class="help" style="margin:0 0 8px">${esc(D.desc)}</p>
  <div class="sect">Ready to load</div><div class="chips">${ks.length?ks.map(k=>`<span class="chip"><i style="background:${CARGO[k].col}"></i>${CARGO[k].name} ${o.stock[k]}</span>`).join(''):'<span class="empty">Nothing yet</span>'}</div>
  ${D.in?`<div class="sect">Delivered ${CARGO[D.in].name.toLowerCase()}</div><div class="chips"><span class="chip"><i style="background:${CARGO[D.in].col}"></i>${o.inp}</span></div>`:''}
  ${D.stock?`<p class="tip">This stockpile does not refill. Spend it on the jobs that need it.</p>`:''}`;}
function townPanel(t){return`<div class="ph"><div class="grow"><div class="ttl">${esc(t.name)}</div><div class="sub">${LEVELS[t.lvl].name} · ${fmt(t.pop)} people</div></div><button class="x" data-a="close" aria-label="Close">✕</button></div>
  <p class="help" style="margin:0">Stop cars at the goods shed to sell. Towns grow as you supply them.</p><div class="sect">Buys</div><div class="chips">${Object.keys(TOWN_BUY).map(k=>`<span class="chip"><i style="background:${CARGO[k].col}"></i>${CARGO[k].name} · ${TOWN_BUY[k]} each</span>`).join('')}</div>`;}
function projPanel(p){const D=projDef(p);
  return`<div class="ph"><div class="grow"><div class="ttl">${esc(D.name)}</div><div class="sub">${esc(REGIONS[D.ri].name)} · reward ${fmt(D.reward)}</div></div><button class="x" data-a="close" aria-label="Close">✕</button></div><p class="help" style="margin:0 0 6px">${esc(D.note)}</p>
  <ol class="phases">${D.phases.map((f,k)=>`<li class="${p.done||k<p.phase?'ok':k===p.phase?'cur':''}">${esc(f.label)}</li>`).join('')}</ol>
  ${p.done?'<p class="tip">Complete.</p>':D.locked?'<p class="tip">Coming in a future update.</p>':`<div class="need">${needRows(p)}</div><p class="tip">${srcLine(p)}. Stop loaded cars beside the orange sign.</p>`}`;}
function depotPanel(){return`<div class="ph"><div class="grow"><div class="ttl">Engine Shed</div><div class="sub">${G.shop?'Repaired':'Run-down'}</div></div><button class="x" data-a="close" aria-label="Close">✕</button></div>
  <p class="help" style="margin:0">${G.shop?'Store engines here and park spare cars on the yard tracks. You can buy the odd car from the Fleet screen.':'The roof leaks and the yard is overgrown. Fix it up (see Jobs) to unlock car purchases and a bigger yard.'}</p>
  ${G.shop?'<div class="row"><button class="btn primary" data-a="fleet">Open Fleet</button></div>':''}`;}
function buildPanel(){
  if(!SEL){closePanel();return;}let html='';
  if(SEL.k==='train'){const t=selTrain();if(!t){closePanel();return;}html=trainPanel(t);panel.innerHTML=html;panel.classList.remove('hidden');wireTrain(t);panelSig='train'+t.id+':'+t.veh.length+(t.ab?1:0);updatePanel(true);return;}
  if(SEL.k==='ind')html=indPanel(G.inds[SEL.id]);else if(SEL.k==='town')html=townPanel(G.towns[SEL.id]);else if(SEL.k==='proj')html=projPanel(G.projects[SEL.id]);else if(SEL.k==='depot')html=depotPanel();
  if(html===panelSig)return;panelSig=html;panel.innerHTML=html;panel.classList.remove('hidden');
  panel.querySelector('[data-a=close]').onclick=closePanel;const f=panel.querySelector('[data-a=fleet]');if(f)f.onclick=openFleet;
}
let consSig='';
function updatePanel(force){
  if(!SEL)return;if(SEL.k!=='train'){buildPanel();return;}
  const t=selTrain();if(!t){closePanel();return;}
  if(panelSig!=='train'+t.id+':'+t.veh.length+(t.ab?1:0)){buildPanel();return;}
  const q=s=>panel.querySelector(s),[st,cl]=statusOf(t);q('#pst').textContent=st;q('#pdot').className='dot '+cl;
  if(q('#thr')){if(document.activeElement!==q('#thr')||force){q('#thr').value=Math.round(t.thr*100);q('#thrv').textContent=Math.round(t.thr*100)+'%';}
    const e=t.veh.find(v=>v.kind==='eng');q('#pdir').textContent=e.flip?'Running backwards':'Running forwards';q('[data-a=follow]').classList.toggle('primary',FOLLOW===t.id);}
  const ch=consHtml(t);if(force||ch!==consSig){consSig=ch;q('#pcons').innerHTML=ch;q('#pcons').querySelectorAll('[data-cut]').forEach(b=>b.onclick=()=>{const tt=selTrain();if(!tt)return;const r=uncouple(tt,+b.dataset.cut);if(r===true){Snd.clunk();toast('Uncoupled','',1.4);buildPanel();}else errToast(r);});}
}

// ---- input ----
function hoverHit(tp){if(!inMap(tp.x,tp.y))return false;const i=idx(tp.x,tp.y);if(!G.seen[i])return false;if(G.own[i]!==-1||DOCK.has(i)||G.bp[i])return true;const m=G.track[i];if(m&&pieceCount(m)>1)return true;return!!trainAt(tp);}
function trainAt(tp){let best=null,bd=COARSE?30:18;const sy=tp.wy-(inMap(tp.x,tp.y)?lev(tp.x,tp.y):0)*LIFT;for(const t of G.trains)for(const p of vehiclePoses(t)){const tx=Math.floor(p.x/TS),ty=Math.floor(p.y/TS);if(!inMap(tx,ty)||!G.seen[idx(tx,ty)])continue;const d=Math.hypot(p.x-tp.wx,(p.y-p.z-5)-sy);if(d<bd){bd=d;best=t;}}return best;}
function clickAt(tp){
  const tr=trainAt(tp);if(tr){Snd.click();if(tr.veh.some(v=>v.kind==='eng'&&v.e==='shunter'))G.g.met=true;select('train',tr.id);renderGoal();return;}
  if(!inMap(tp.x,tp.y)){closePanel();return;}const i=idx(tp.x,tp.y);
  if(tableOf(tp.x,tp.y)>=0&&!isOpen(tp.x,tp.y)){Snd.click();openContracts();return;}
  if(tableOf(tp.x,tp.y)>=0&&!G.seen[i]){toast('Unexplored. Drive a train nearby to scout it.','',2.2);return;}
  const m=G.track[i];
  if(m&&pieceCount(m)>1){let be=-1,bd=1e9;for(let e=0;e<4;e++){if(edgeCount(m,e)<2)continue;const ex=tp.x*TS+H+DX[e]*H,ey=tp.y*TS+H+DY[e]*H,d=Math.hypot(ex-tp.wx,ey-tp.wy);if(d<bd){bd=d;be=e;}}
    if(be>=0){const k=tp.x+','+tp.y+','+be;G.sw[k]=((G.sw[k]||0)+1)%edgeCount(m,be);G.swVer++;Snd.sw();burst(tp.x*TS+H+DX[be]*(H-4),tp.y*TS+H+DY[be]*(H-4)-G.tl[i]*LIFT-8,6,'255,214,90',40);return;}}
  const o=G.own[i];if(o>=2000){Snd.click();select('ind',o-2000);return;}if(o>=1000){Snd.click();select('town',o-1000);return;}
  if(G.depot.tiles.some(([x,y])=>x===tp.x&&y===tp.y)){Snd.click();const ps=projBy('shed');select(ps.done?'depot':'proj',ps.done?0:ps.idx);return;}
  if(G.bp[i]&&G.bpP[i]>=0){Snd.click();select('proj',G.bpP[i]);return;}
  for(const p of G.projects)if(p.site===i&&!p.done){Snd.click();select('proj',p.idx);return;}
  const d=DOCK.get(i);if(d){Snd.click();select(d.k,d.i);return;}
  closePanel();
}
function toolDown(tp){if(!inMap(tp.x,tp.y))return;if(tool==='track')TD={tiles:[[tp.x,tp.y]],plan:null};else{TD={done:new Set(),err:false};applyTile(tp);}}
function applyTile(tp){
  if(!inMap(tp.x,tp.y))return;const k=idx(tp.x,tp.y);if(TD.done.has(k))return;TD.done.add(k);let r=false;
  if(tool==='bulldoze')r=bulldozeAt(tp.x,tp.y);else if(tool==='tree')r=plantAt(tp.x,tp.y);
  if(typeof r==='string'&&!TD.err){TD.err=true;errToast(r);}
}
function toolMove(tp){
  if(!TD)return;
  if(tool==='track'){if(!inMap(tp.x,tp.y))return;const T=TD.tiles;let[lx,ly]=T[T.length-1];if(lx===tp.x&&ly===tp.y)return;let guard=0;
    while((lx!==tp.x||ly!==tp.y)&&guard++<200){const dx=tp.x-lx,dy=tp.y-ly;if(Math.abs(dx)>=Math.abs(dy))lx+=Math.sign(dx);else ly+=Math.sign(dy);const k=T.findIndex(([a,b])=>a===lx&&b===ly);if(k>=0)T.length=k+1;else T.push([lx,ly]);}
    TD.plan=planTrack(T);}else applyTile(tp);
}
function toolUp(){if(tool==='track'&&TD&&TD.plan&&TD.plan.items.length){const r=buildPlan(TD.plan);if(r!==true)errToast(r);}TD=null;}
const keys=new Set();
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range'||e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();
  if(k==='escape'){if(modalOpen)closeModal();else if(tool!=='select')setTool('select');else closePanel();return;}if(modalOpen)return;
  if(k===' '){e.preventDefault();if(G.speed){G.prevSpeed=G.speed;setSpeed(0);}else setSpeed(G.prevSpeed||1);return;}
  const tlist=['select','track','bulldoze','tree','fleet'];if(/^[1-5]$/.test(k)){setTool(tlist[+k-1]);return;}if(k==='j'){openContracts();return;}
  const t=selTrain();
  if(t&&hasEng(t)&&!t.ab){
    if(k==='w'||k==='arrowup'){t.thr=clamp(t.thr+.1,0,1);t.brk=false;if(!FOLLOW)FOLLOW=t.id;e.preventDefault();updatePanel(true);return;}
    if(k==='s'||k==='arrowdown'){t.thr=clamp(t.thr-.1,0,1);e.preventDefault();updatePanel(true);return;}
    if(k==='b'){t.brk=true;t.thr=0;updatePanel(true);return;}
    if(k==='r'){if(t.v<1){reverseTrain(t);t.thr=0;Snd.click();updatePanel(true);}else errToast('Stop the train before reversing.');return;}
    if(k==='h'){toot(t);return;}if(k==='f'){FOLLOW=FOLLOW===t.id?null:t.id;return;}}
  keys.add(k);
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys.delete(k);if(k==='b'){const t=selTrain();if(t)t.brk=false;}});
window.addEventListener('blur',()=>keys.clear());

try{const th=localStorage.getItem('pj-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}

// ---- input ----
let cvR=null;const cvRect=()=>cvR||(cvR=cv.getBoundingClientRect());
const ex=e=>{const r=cvRect();return(e.clientX-r.left)*(VWp/(r.width||VWp));},ey=e=>{const r=cvRect();return(e.clientY-r.top)*(VHp/(r.height||VHp));};
const ptrs=new Map();let drag=null,pinch=null;
function tileAtS(sx,sy){const w=s2w(sx,sy),tx=Math.floor(w.x/TS);
  for(let y=Math.min(MH-1,Math.floor((w.y+7*LIFT)/TS));y>=Math.max(0,Math.floor(w.y/TS)-1);y--){if(!inMap(tx,y))continue;const i=idx(tx,y);let L=G.track[i]?G.tl[i]:(isOpen(tx,y)?G.h[i]:0);if(G.terr[i]===3&&!G.track[i])L=0;
    const gy=w.y+L*LIFT;if(gy>=y*TS&&gy<(y+1)*TS)return{x:tx,y,wx:w.x,wy:gy};}
  return{x:tx,y:Math.floor(w.y/TS),wx:w.x,wy:w.y};}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  cvR=null;Snd.init();cv.focus({preventScroll:true});try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:ex(e),y:ey(e)});
  if(ptrs.size===2){TD=null;drag=null;const[a,b]=[...ptrs.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:cam.z,anchor:s2w(mx,my)};return;}
  if(ptrs.size>2)return;
  const pan=e.button===1||e.button===2||tool==='select'||tool==='place'||tool==='pick';
  drag={sx:ex(e),sy:ey(e),lx:ex(e),ly:ey(e),pan,btn:e.button};
  if(pan&&tool==='select')cv.style.cursor='grabbing';if(!pan)toolDown(tileAtS(ex(e),ey(e)));
});
cv.addEventListener('pointermove',e=>{
  lastPtr={x:ex(e),y:ey(e)};if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:ex(e),y:ey(e)});
  const tp=tileAtS(ex(e),ey(e));hoverT=inMap(tp.x,tp.y)?tp:null;
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;cam.z=clamp(pinch.z*d/pinch.d,minZoom(),2.6);cam.x=pinch.anchor.x-(mx-VWp/2)/cam.z;cam.y=pinch.anchor.y-(my-VHp/2)/cam.z;clampCam();FOLLOW=null;return;}
  if(!drag){if(tool==='select')cv.style.cursor=hoverHit(tp)?'pointer':'grab';return;}
  const dx=ex(e)-drag.lx,dy=ey(e)-drag.ly;drag.lx=ex(e);drag.ly=ey(e);
  if(drag.pan){if(Math.hypot(ex(e)-drag.sx,ey(e)-drag.sy)>5){cam.x-=dx/cam.z;cam.y-=dy/cam.z;clampCam();FOLLOW=null;}}else toolMove(tp);
});
const endPtr=e=>{
  const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;drag=null;return;}if(!had||!drag)return;
  if(drag.pan&&Math.hypot(ex(e)-drag.sx,ey(e)-drag.sy)<6&&drag.btn===0&&e.type==='pointerup')clickAt(tileAtS(ex(e),ey(e)));else if(!drag.pan)toolUp();
  drag=null;if(tool==='select')cv.style.cursor='grab';
};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);cv.addEventListener('pointerleave',()=>{hoverT=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();const before=s2w(ex(e),ey(e));cam.z=clamp(cam.z*Math.exp(-e.deltaY*.0015),minZoom(),2.6);const after=s2w(ex(e),ey(e));cam.x+=before.x-after.x;cam.y+=before.y-after.y;clampCam();},{passive:false});

// MAIN LOOP

let lastT=performance.now(),uiAcc=0,saveAcc=0;
function frame(ts){
  const rdt=Math.min(.05,(ts-lastT)/1000);lastT=ts;
  if(cv.clientWidth&&(cv.clientWidth!==VWp||cv.clientHeight!==VHp)){cvR=null;resize();}
  try{
    if(G.speed>0){let simDt=rdt*G.speed;while(simDt>0){const s=Math.min(simDt,1/30);simStep(s);simDt-=s;}}
    const ps=480/cam.z*rdt,drv=selTrain()&&hasEng(selTrain());
    if(keys.has('a')||keys.has('arrowleft')){cam.x-=ps;FOLLOW=null;}if(keys.has('d')||keys.has('arrowright')){cam.x+=ps;FOLLOW=null;}
    if(!drv){if(keys.has('w')||keys.has('arrowup')){cam.y-=ps;FOLLOW=null;}if(keys.has('s')||keys.has('arrowdown')){cam.y+=ps;FOLLOW=null;}}
    if(FOLLOW){const t=G.trains.find(q=>q.id===FOLLOW);if(t){const p=pointBehind(t,trainLen(t)/2);cam.x=lerp(cam.x,p.x,Math.min(1,rdt*4));cam.y=lerp(cam.y,p.y-p.z*LIFT,Math.min(1,rdt*4));}else FOLLOW=null;}
    clampCam();render(ts/1000,rdt);
    dispMoney+=(G.money-dispMoney)*Math.min(1,rdt*7);if(Math.abs(G.money-dispMoney)<1)dispMoney=G.money;moneyEl.textContent=fmt(dispMoney);
    uiAcc+=rdt;if(uiAcc>.25){uiAcc=0;updatePanel();renderGoal();updateBadge();updateClock();}
    saveAcc+=rdt;if(saveAcc>20){saveAcc=0;save();}
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
function updateClock(){const d=Math.floor(G.time/DAY)+1,h=(G.time%DAY)/DAY*24,hh=Math.floor(h),mm=Math.floor((h-hh)*60/10)*10;$('#clock').textContent=`Day ${d} · ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;$('#sun').textContent=daylight()>.4?'☀':'☾';}
function startGame(fresh){
  closePanel();FOLLOW=null;SEL=null;FX.length=0;P.length=0;rowVer='';BUILT.clear();
  if(fresh||!load())newGame();
  for(let ri=0;ri<4;ri++){BAKE[ri]=null;if(G.reg[ri])bakeTable(ri);}
  bakeFloor();resize();cam.z=clamp(COARSE?1:1.25,minZoom(),2.6);const cs=G.camStart;cam.x=cs.x;cam.y=cs.y;clampCam();
  dispMoney=G.money;setSpeed(G.speed||1);setTool('select');renderGoal(true);updateClock();updateBadge();save();
  if(fresh!==false||!G.g.welcomed){G.g.welcomed=true;setTimeout(()=>toast('Welcome to the depot. Your railway starts here.','big',3.5),400);}
}
window.addEventListener('resize',()=>{cvR=null;resize();});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{cvR=null;resize();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});window.addEventListener('pagehide',save);
startGame(false);
requestAnimationFrame(t=>{lastT=t;frame(t);});
