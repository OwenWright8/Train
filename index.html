<title>Puffwood Junction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: four model-railway tables on a workshop floor, drawn as layered foam terrain; rounded cards float at the edges */
:root{
  --panel:#fffaf1; --panel2:#f3ead9; --ink:#3b342b; --muted:#867c6d; --line:rgba(96,72,40,.15);
  --accent:#e2683a; --accent-ink:#ffffff; --good:#2f8f6a; --gold:#e9b23c; --danger:#cc4636;
  --shadow:0 10px 30px rgba(70,48,18,.20),0 2px 6px rgba(70,48,18,.12);
  --scrim:rgba(40,30,15,.38); --hint:rgba(43,36,27,.82); --hint-ink:#fff;
  --bg:#3a2d22;
  --display:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --pencil:'Caveat','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#24282b; --panel2:#2f3438; --ink:#f0e9dc; --muted:#a99f8f; --line:rgba(255,255,255,.10);
    --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
    --scrim:rgba(0,0,0,.5); --hint:rgba(20,22,24,.86); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#24282b; --panel2:#2f3438; --ink:#f0e9dc; --muted:#a99f8f; --line:rgba(255,255,255,.10);
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.5); --hint:rgba(20,22,24,.86); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#tilt{position:fixed;inset:0;pointer-events:none;z-index:1;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 22%,transparent 74%,#000 100%);mask-image:linear-gradient(180deg,#000 0%,transparent 22%,transparent 74%,#000 100%)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(20,12,4,.35) 100%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.2px}
.logo{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.pill{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-family:var(--display);font-weight:600;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
button.pill{cursor:pointer}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-size:12px;line-height:18px}
.spacer{flex:1}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e9b23c 60%,#c98f1c);box-shadow:inset 0 0 0 1.5px #c98f1c;flex:none;display:inline-block}
#moneyPill.bump{animation:bump .22s ease-out}
@keyframes bump{50%{transform:scale(1.12)}}
.seg{display:flex;gap:2px;padding:3px}
.seg button{border:0;background:transparent;width:34px;height:30px;border-radius:999px;display:grid;place-items:center}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);width:40px;height:40px;border-radius:50%;display:grid;place-items:center}

#goal{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(66px + env(safe-area-inset-top,0px));width:290px;padding:12px 14px;z-index:4;cursor:pointer}
#goal .eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
#goal h3{margin:3px 0 4px;font-family:var(--display);font-weight:600;font-size:17px;text-wrap:balance}
#goal p{margin:0;color:var(--muted);line-height:1.4;font-size:13px}
#goal .reward{margin-top:8px;display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:500;font-size:13px}
.need{display:flex;flex-direction:column;gap:5px;margin-top:8px}
#goal.min p,#goal.min .reward,#goal.min .need{display:none}
#goal.flash{animation:goalflash .9s ease-out}
@keyframes goalflash{30%{transform:scale(1.05);box-shadow:0 0 0 6px rgba(233,178,60,.55),var(--shadow)}}
.needrow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;font-size:12.5px;font-weight:600}
.needrow i{width:10px;height:10px;border-radius:3px;display:block}
.needrow b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}

#tools{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:3px;padding:6px;border-radius:22px;z-index:5}
.tool{width:66px;height:58px;border:0;border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--display);font-size:12px;font-weight:500;transition:transform .15s,background .15s}
.tool:hover{background:var(--panel2)}
.tool.on{background:var(--accent);color:var(--accent-ink);transform:translateY(-4px)}
.tool svg.i{width:22px;height:22px}
#hint{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:7px 15px;border-radius:999px;background:var(--hint);color:var(--hint-ink);font-size:13px;width:max-content;max-width:calc(100% - 32px);text-align:center;pointer-events:none;z-index:4;line-height:1.35;transition:opacity .6s}

#panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 180px);overflow:auto;padding:14px;z-index:6}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ph .grow{flex:1;min-width:0}
.ph input.name{width:100%;border:0;background:transparent;font-family:var(--display);font-weight:600;font-size:19px;padding:2px 4px;border-radius:8px}
.ph input.name:hover{background:var(--panel2)}
.ttl{font-family:var(--display);font-weight:600;font-size:19px;padding:2px 4px}
.sub{color:var(--muted);font-size:12.5px;padding-left:4px}
.x{border:0;background:var(--panel2);width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center}
.status{padding:8px 11px;border-radius:12px;background:var(--panel2);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;line-height:1.3}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--good)}
.dot.warn{background:var(--gold)}.dot.bad{background:var(--danger)}.dot.idle{background:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stats div{background:var(--panel2);border-radius:12px;padding:6px 9px}
.stats small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stats b{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.sect{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--panel2);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:3px;display:block}
.cars{display:flex;flex-direction:column;gap:4px}
.carrow{display:grid;grid-template-columns:82px 1fr 52px;align-items:center;gap:8px;font-size:12.5px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .25s}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:12px;padding:3px;margin:12px 0 4px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:7px;font-family:var(--display);font-weight:600}
.tabs button.on{background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.12)}
ol.orders{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ol.orders li{display:grid;grid-template-columns:24px 1fr auto auto;gap:6px;align-items:center;padding:6px;border-radius:12px;background:var(--panel2);border:2px solid transparent}
ol.orders li.cur{border-color:var(--accent)}
ol.orders .n{width:24px;height:24px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:12px}
ol.orders select{min-width:0;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px}
ol.orders label{font-size:11.5px;display:flex;align-items:center;gap:3px;white-space:nowrap;color:var(--muted)}
.mini-x{border:0;background:transparent;width:24px;height:24px;border-radius:50%;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 12px;font-family:var(--display);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.grow{flex:1;justify-content:center}
.btn.held{background:var(--danger);color:#fff}
.empty{color:var(--muted);font-size:13px;line-height:1.45;padding:8px 2px}
.tip{color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:8px}
.throttle{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center;margin-top:8px}
.throttle input{width:100%;accent-color:var(--accent);height:28px}
.throttle b{font-family:var(--display);font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.progress{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:99px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv b{font-variant-numeric:tabular-nums}

.modal-bg{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;padding:16px}
.modal{width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px 20px}
.mh{display:flex;align-items:center;gap:10px}
.mh h2{flex:1;margin:0;font-family:var(--display);font-weight:600;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.vcard{position:relative;border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:6px 10px 10px;text-align:left;display:flex;flex-direction:column;gap:3px}
.vcard.on{border-color:var(--accent);background:var(--panel)}
.vcard canvas{align-self:center}
.vcard b{font-family:var(--display);font-weight:600;font-size:15px}
.vcard small{color:var(--muted);font-size:12px;line-height:1.3}
.vcard .price{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:600;font-size:13px;margin-top:2px}
.vcard.locked{opacity:.55;cursor:not-allowed}
.vcard .lock{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--muted)}
.meter{display:inline-flex;gap:2px;vertical-align:middle}.meter i{width:12px;height:5px;border-radius:2px;background:var(--line)}.meter i.f{background:var(--accent)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.consist{background:var(--panel2);border-radius:14px;padding:10px;margin-top:10px}
.consist .chips{margin-top:6px}
.chip .rm{border:0;background:transparent;padding:0 0 0 2px;color:var(--muted);font-weight:700}
.mf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.mf input{flex:1;min-width:140px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px}
.total{font-family:var(--display);font-weight:600;display:flex;gap:6px;align-items:center}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel2);border:0;text-align:left}
.trow b{font-family:var(--display);font-weight:600}
.trow small{color:var(--muted)}
.menu{width:min(440px,100%)}
.menu .btn{width:100%;justify-content:flex-start;margin-top:6px}
.help{color:var(--muted);line-height:1.5;font-size:13.5px}
.help b{color:var(--ink)}
.ctable{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.cregion h4{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.cregion h4 i{width:12px;height:12px;border-radius:4px}
.ccard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.ccard.done{opacity:.6}
.ccard.locked{opacity:.5}
.ccard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ccard .top b{font-family:var(--display);font-weight:600;font-size:15px}
.ccard .top span{font-family:var(--display);font-weight:600;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.ccard p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.4}
.ccard p b{color:var(--ink)}
.tag{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--muted)}
.tag.go{background:var(--accent);color:var(--accent-ink)}

#toasts{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:30;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{padding:9px 16px;border-radius:999px;font-family:var(--display);font-weight:500;font-size:14.5px;animation:tin .35s cubic-bezier(.2,1.4,.4,1),tout .4s ease-in forwards;animation-delay:0s,var(--life,3s);text-align:center}
.toast.big{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:16px;font-weight:600}
.toast.err{color:var(--danger)}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}
.coinfly{position:fixed;left:0;top:0;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e9b23c 60%,#c98f1c);box-shadow:inset 0 0 0 1.5px #c98f1c;z-index:40;pointer-events:none;transition:transform .75s cubic-bezier(.55,-0.35,.6,1),opacity .2s .65s}
.hidden{display:none!important}

@media (max-width:760px){
  .brand span,#clockPill,.ctext{display:none}
  .brand{padding:5px}
  #goal{width:auto;right:max(16px,env(safe-area-inset-right,0px));padding:9px 12px}
  #goal h3{font-size:15px}
  #panel{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-height:46%}
  .tool{width:50px;font-size:10.5px}
  #hint{bottom:calc(88px + env(safe-area-inset-bottom,0px));font-size:12px}
  .seg button{width:28px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

.cons{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.vchip{display:inline-flex;flex-direction:column;padding:4px 9px 4px 11px;border-radius:10px;background:var(--panel2);border-left:4px solid var(--c);line-height:1.15}
.vchip b{font-family:var(--display);font-weight:600;font-size:12.5px}.vchip small{color:var(--muted);font-size:11px}
.vchip.eng{background:var(--panel)}
.cut{border:1px dashed var(--line);background:transparent;border-radius:8px;width:24px;height:30px;padding:0;color:var(--muted);font-size:13px}
.cut:hover{color:var(--danger);border-color:var(--danger)}
.drive{background:var(--panel2);border-radius:14px;padding:10px}
.dirrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dirrow span{color:var(--muted);font-size:12.5px;font-weight:600}
.drive .btn{background:var(--panel)}.drive .btn.primary{background:var(--accent)}.drive .btn.held{background:var(--danger);color:#fff}
ol.phases{margin:6px 0 4px;padding-left:20px;font-size:12.5px;line-height:1.5;color:var(--muted)}
ol.phases li.ok{text-decoration:line-through;opacity:.7}ol.phases li.cur{color:var(--ink);font-weight:600}
ol.phases small{opacity:.8;font-weight:400}
#goal .srcl{margin-top:6px;font-size:12px}
#goal .need{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.need{display:flex;flex-direction:column;gap:5px}
@media (max-width:760px){#panel .sub,#panel p.tip,.dirrow span{display:none}.drive{padding:7px}.drive .row,.throttle{margin-top:4px}#panel .status{margin-bottom:6px;padding:6px 10px}#panel .sect{margin:8px 0 4px}}

body.editing #top,body.editing #tools,body.editing #goal,body.editing #panel,body.editing #hint{display:none!important}
#edBack{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:7;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#edTop{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;padding:7px 10px;z-index:8;border-radius:18px}
.edTitle{font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap}
#edName{flex:0 1 200px;min-width:90px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 10px;font-family:var(--display);font-weight:600}
.edBtns{display:flex;gap:5px;margin-left:auto;overflow-x:auto;scrollbar-width:none}.edBtns .btn{padding:6px 10px;white-space:nowrap}
#edTools{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(66px + env(safe-area-inset-top,0px));bottom:16px;width:92px;overflow-y:auto;padding:6px;z-index:8;border-radius:18px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.edGroup{display:flex;flex-direction:column;gap:2px}.edGroup small{font-family:var(--display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 6px}
.edTool{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:10px;padding:6px 7px;font-size:12px;font-weight:600;text-align:left;color:var(--ink)}
.edTool .i{width:17px;height:17px;flex:none}.edTool:hover{background:var(--panel2)}.edTool.on{background:var(--accent);color:var(--accent-ink)}
#edOpts{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));width:260px;max-height:calc(100% - 90px);overflow:auto;padding:12px 14px;z-index:8;border-radius:18px}
#edOpts .edH{font-family:var(--display);font-weight:600;font-size:17px}#edOpts .tip{margin-top:4px}

}

  G=baseG(seed);G.pdefs=JSON.parse(JSON.stringify(PDEFS9));G.reg=REGIONS.map((_,i)=>i===0);

  // crossings from the centre table to its four edge neighbours (outer end first)
  const C=tb(0),CROSS={};
  const mk=(n,dir)=>{const B=tb(n),t=[];if(dir==='E'||dir==='W'){const y=C.y0+6+Math.floor(R()*(C.h-12));if(dir==='E')for(let x=B.x0+1;x>=C.x1-1;x--)t.push([x,y]);else for(let x=B.x1-1;x<=C.x0+1;x++)t.push([x,y]);}
    else{const x=C.x0+6+Math.floor(R()*(C.w-12));if(dir==='S')for(let y=B.y0+1;y>=C.y1-1;y--)t.push([x,y]);else for(let y=B.y1-1;y<=C.y0+1;y++)t.push([x,y]);}return t;};
  CROSS.E=mk(3,'E');CROSS.S=mk(5,'S');CROSS.W=mk(7,'W');CROSS.N=mk(1,'N');

    for(const[x,y]of t){if(tableOf(x,y)<0)continue;for(let d=-2;d<=2;d++)for(let e=-3;e<=3;e++){const X=hz?x+e:x+d,Y=hz?y+d:y+e;if(inMap(X,Y)&&tableOf(X,Y)===tableOf(x,y)){const j=idx(X,Y);G.h[j]=1;G.terr[j]=0;}}}

  const areaOK=(x0,y0,x1,y1,ri)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(!free(x,y,ri))return false;return true;};
  const avgH=(x0,y0,x1,y1)=>{let s=0,n=0;for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){s+=G.h[idx(x,y)];n++;}return Math.round(s/n);};
  const flat=(x0,y0,x1,y1,lv)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(!inMap(x,y))continue;const j=idx(x,y);if(G.terr[j]!==3){G.h[j]=lv;G.terr[j]=0;}}};

function save(){if(!G)return;try{const o=Object.assign({},G,{tables:curTables()});for(const k in ARR)delete o[k];o.grids={seen:encG(G.seen,0)};for(const k in GRIDS)o.grids[k]=encG(G[k],GRIDS[k][1]);localStorage.setItem(SAVE_KEY,JSON.stringify(o,(k,v)=>(k==='look'||k==='svcMsg')?undefined:v));}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE_KEY);if(!s)return false;const o=JSON.parse(s);if(!o||o.v!==5||!o.tables)return false;setTables(o.tables||DEFAULT_TABLES());if(o.grids){for(const k in GRIDS)o[k]=decG(o.grids[k],GRIDS[k][0],GRIDS[k][1]);o.seen=decG(o.grids.seen,Uint8Array,0);o.own=new Int16Array(N).fill(-1);o.zone=new Uint8Array(N);o.res=new Uint8Array(N);delete o.grids;G=o;recomputeOwnRes();computeZones();}else{if(!o.terr||o.terr.length!==N)return false;for(const k in ARR)o[k]=ARR[k].from(o[k]);G=o;}while(G.reg.length<REGIONS.length)G.reg.push(false);if(!G.pdefs)G.pdefs=JSON.parse(JSON.stringify(PROJ_DEFS));applyNames();rebuildDocks();return true;}catch(e){return false;}}

const Snd={ctx:null,master:null,muted:false,last:{},
  init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:.55;this.master.connect(this.ctx.destination);
    const len=this.ctx.sampleRate*.6|0;this.noise=this.ctx.createBuffer(1,len,this.ctx.sampleRate);const d=this.noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}catch(e){this.ctx=null;}},
  setMuted(m){this.muted=m;if(this.master)this.master.gain.value=m?0:.55;},
  ok(name,gap){const t=performance.now();if(this.last[name]&&t-this.last[name]<gap)return false;this.last[name]=t;return!!this.ctx&&!this.muted;},
  tone(f,dur,type='sine',vol=.2,when=0,slide){const c=this.ctx;if(!c)return;const t=c.currentTime+when;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.05);},
  nz(dur,freq,vol,q=1,when=0){const c=this.ctx;if(!c)return;const t=c.currentTime+when;const s=c.createBufferSource();s.buffer=this.noise;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=c.createGain();
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(this.master);s.start(t,Math.random()*.3);s.stop(t+dur+.05);},
  click(){if(this.ok('click',40))this.tone(900,.05,'triangle',.08,0,600);},
  build(k){if(!this.ctx||this.muted)return;const w=Math.min(k,24)*.028;this.tone(520+Math.min(k,24)*22,.06,'triangle',.09,w);this.nz(.04,3000,.04,1,w);},
  coin(){if(this.ok('coin',55))this.tone(1568,.09,'square',.035,0,1760);},
  cash(amt){if(!this.ok('cash',120))return;this.tone(988,.09,'square',.05);this.tone(1319,.22,'square',.05,.08);if(amt>600)this.tone(1760,.3,'triangle',.06,.18);},

  level(){if(!this.ctx||this.muted)return;[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.22,'triangle',.08,i*.09));},
  goal(){if(!this.ctx||this.muted)return;[784,988,1175,1568].forEach((f,i)=>this.tone(f,.18,'square',.04,i*.07));},

  err(){if(this.ok('err',200))this.tone(170,.16,'square',.05,0,120);},

const cv=$('#c'),ctx=cv.getContext('2d');

function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VWp=cv.clientWidth||window.innerWidth;VHp=cv.clientHeight||window.innerHeight;cv.width=Math.round(VWp*DPR);cv.height=Math.round(VHp*DPR);clampCam();}
const minZoom=()=>Math.min(VWp/(MW*TS+200),VHp/(MH*TS+260));
function clampCam(){cam.z=clamp(cam.z,minZoom(),4);cam.x=clamp(cam.x,-60,MW*TS+60);cam.y=clamp(cam.y,-120,MH*TS+60);}

function worldTf(){ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*(VWp/2-cam.x*cam.z),DPR*(VHp/2-cam.y*cam.z));}
function rr(c,x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

// ---- floor (baked once) ----
let floorCan=null;
function bakeFloor(){
  const s=Math.min(.5,2400/(MW*TS+600)),W=Math.ceil((MW*TS+600)*s),Hh=Math.ceil((MH*TS+600)*s);floorCan=document.createElement('canvas');floorCan.width=W;floorCan.height=Hh;const c=floorCan.getContext('2d');
  c.fillStyle='#3d2e22';c.fillRect(0,0,W,Hh);
  for(let y=0;y<Hh;y+=26){c.fillStyle=(y/26)%2?'#43321f':'#3a2b1e';c.fillRect(0,y,W,25);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(0,y+25,W,1);
    for(let x=(y*7)%180;x<W;x+=180+((y*13)%90))c.fillRect(x,y,1,25);}
  for(let i=0;i<300;i++){c.strokeStyle=`rgba(0,0,0,${.05+Math.random()*.06})`;c.beginPath();const y=Math.random()*Hh;c.moveTo(0,y);c.lineTo(W,y+(Math.random()-.5)*6);c.stroke();}
  c.save();c.scale(s,s);c.translate(300,300);
  for(let ri=0;ri<REGIONS.length;ri++){const b=tb(ri);c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=60;c.shadowOffsetX=16;c.shadowOffsetY=30;c.fillStyle='#2a1e14';c.fillRect(b.x0*TS,b.y0*TS,b.w*TS,b.h*TS+THICK);}
  c.restore();
}

// ---- 2.5D primitives ----
function box(c,cx,cy,z,w,d,h,top,front){c.fillStyle=front;c.fillRect(cx-w/2,cy+d/2-z-h,w,h);c.fillStyle=top;c.fillRect(cx-w/2,cy-d/2-z-h,w,d);}
function cyl(c,cx,cy,z,r,h,top,side){c.fillStyle=side;c.beginPath();c.arc(cx,cy-z,r,0,Math.PI);c.lineTo(cx-r,cy-z-h);c.lineTo(cx+r,cy-z-h);c.closePath();c.fill();c.fillStyle=top;circ(c,cx,cy-z-h,r);}
function poly(c,pts,col){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();c.fillStyle=col;c.fill();}
let NIGHT=0;
const winCol=()=>NIGHT>.35?'#ffd36a':'#3d4a5a';
function house(c,cx,cy,z,w,d,hw,rh,wall,roof,along,opts={}){
  const x0=cx-w/2,x1=cx+w/2,yN=cy-d/2-z,yS=cy+d/2-z;
  c.fillStyle='rgba(20,20,0,.22)';c.fillRect(x0+3,yS-2,w,5);
  if(!along){
    c.fillStyle=wall;c.fillRect(x0,yS-hw,w,hw);
    const ry=cy-z-hw-rh;poly(c,[x0-1.5,yN-hw,x1+1.5,yN-hw,x1+1.5,ry,x0-1.5,ry],shade(roof,.12));poly(c,[x0-1.5,ry,x1+1.5,ry,x1+1.5,yS-hw+1.5,x0-1.5,yS-hw+1.5],roof);
    if(opts.snow){poly(c,[x0-1.5,yN-hw,x1+1.5,yN-hw,x1+1.5,ry,x0-1.5,ry],'#f6f9fb');poly(c,[x0-1.5,ry,x1+1.5,ry,x1+1.5,ry+(yS-hw-ry)*.6,x0-1.5,ry+(yS-hw-ry)*.6],'#eef3f6');}
    c.fillStyle='rgba(255,255,255,.4)';c.fillRect(x0-1.5,ry-.6,w+3,1.2);
  }else{
    const ry=-hw-rh;poly(c,[x0,yS,x1,yS,x1,yS-hw,cx,yS+ry,x0,yS-hw],wall);
    poly(c,[x0-1.5,yN-hw,cx,yN+ry,cx,yS+ry,x0-1.5,yS-hw+1],opts.snow?'#f6f9fb':shade(roof,.1));poly(c,[x1+1.5,yN-hw,cx,yN+ry,cx,yS+ry,x1+1.5,yS-hw+1],opts.snow?'#e4ebf0':shade(roof,-.12));
  }
  c.fillStyle=winCol();const wy=yS-hw*.62;c.fillRect(x0+w*.18,wy,w*.16,hw*.3);c.fillRect(x1-w*.34,wy,w*.16,hw*.3);
  c.fillStyle=opts.door||'#6a4a32';c.fillRect(cx-w*.08,yS-hw*.5,w*.16,hw*.5);
  if(opts.chimney){c.fillStyle='#7d5a48';c.fillRect(x1-w*.28,cy-z-hw-rh*.6-8,3.5,9);}
}




function trackPts(x,y,p,lat,u0=0,u1=1){const n=p<2?2:7,out=[];for(let k=0;k<=n;k++){const u=lerp(u0,u1,k/n),q=piecePoint(x,y,p,u),z=pieceZ(x,y,p,u)*LIFT,nx=-Math.sin(q.a),ny=Math.cos(q.a);out.push([q.x+nx*lat,q.y+ny*lat-z,q.y+ny*lat,z]);}return out;}
function strokePts(c,pts){c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);}

function drawBridge(c,x,y,p,L,groundZ){
  const cx=x*TS+H,cy=y*TS+H,z=L*LIFT,along=p===0;
  const post=(px,py)=>{c.fillStyle='#5e4430';c.fillRect(px-2,py-z,4,z-groundZ);c.fillStyle='rgba(0,0,0,.2)';c.fillRect(px+1,py-z,1.5,z-groundZ);};
  if(along){post(cx-9,cy);post(cx+9,cy);c.strokeStyle='#6e5038';c.lineWidth=1.5;c.beginPath();c.moveTo(cx-9,cy-z+4);c.lineTo(cx+9,cy-groundZ-2);c.moveTo(cx+9,cy-z+4);c.lineTo(cx-9,cy-groundZ-2);c.stroke();
    box(c,cx,cy,z-3,22,TS,3,'#a77e57','#6e5038');c.fillStyle='#5e4430';c.fillRect(cx-12,cy-H-z,2,TS);c.fillRect(cx+10,cy-H-z,2,TS);}
  else{post(cx,cy-9);box(c,cx,cy,z-3,TS,22,3,'#a77e57','#6e5038');post(cx,cy+9);c.strokeStyle='#6e5038';c.lineWidth=1.5;c.beginPath();c.moveTo(cx-H,cy+9-z+3);c.lineTo(cx,cy+9-groundZ);c.lineTo(cx+H,cy+9-z+3);c.stroke();c.fillStyle='#5e4430';c.fillRect(cx-H,cy+10-z-3,TS,2);}
}
function drawPortal(c,x,y,e,L){

  if(e===2){c.fillStyle='#7d7468';rr(c,-13,-20,26,20,3);c.fill();c.fillStyle='#22201d';c.beginPath();c.moveTo(-8,0);c.lineTo(-8,-9);c.arc(0,-9,8,Math.PI,0);c.lineTo(8,0);c.fill();c.fillStyle='#9a9084';c.fillRect(-14,-22,28,4);}
  else if(e===0){c.fillStyle='#22201d';rr(c,-9,-6,18,6,2);c.fill();}
  else{c.fillStyle='#7d7468';c.fillRect(-4,-18,8,18);c.fillStyle='#22201d';c.fillRect(-2,-14,4,14);c.fillStyle='#9a9084';c.fillRect(-5,-20,10,3);}

}

function drawSwitches(c,y){

    for(let e=0;e<4;e++){if(edgeCount(m,e)<2)continue;const list=[];for(let p=0;p<6;p++)if(m&(1<<p)&&PIECES[p].includes(e))list.push(p);
      const act=list[(G.sw[x+','+y+','+e]||0)%list.length],fromA=PIECES[act][0]===e;
      c.strokeStyle='rgba(255,214,90,.95)';c.lineWidth=2.6;c.lineCap='round';c.beginPath();strokePts(c,trackPts(x,y,act,0,fromA?0:.4,fromA?.6:1));c.stroke();
      const z=G.tl[idx(x,y)]*LIFT,ex=x*TS+H+DX[e]*(H-4)+DY[e]*11,ey=y*TS+H+DY[e]*(H-4)-DX[e]*11-z;c.fillStyle='#3b3a38';c.fillRect(ex-.8,ey-9,1.6,9);c.fillStyle='#ffd65a';circ(c,ex,ey-10,2.6);}}

function drawHouseObj(c,o){

function puff(x,y,o){if(P.length>700)return;P.push(Object.assign({x,y,vx:0,vy:0,r:3,gr:8,life:0,max:1.4,col:'250,250,246',a:.7},o));}
function burst(x,y,n,col,sp=60,o={}){for(let k=0;k<n;k++){const a=Math.random()*6.28;puff(x,y,Object.assign({vx:Math.cos(a)*sp*Math.random(),vy:Math.sin(a)*sp*Math.random()-sp*.4,r:2.2,gr:0,max:.8+Math.random()*.4,col,a:1,kind:'spark'},o));}}

function makeGlow(col){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,col);g.addColorStop(.35,col.replace('1)','.45)'));g.addColorStop(1,col.replace('1)','0)'));x.fillStyle=g;x.fillRect(0,0,64,64);return c;}

function daylight(){const h=(G.time%DAY)/DAY*24;if(h<5||h>=21)return 0;if(h<7)return(h-5)/2;if(h>19)return(21-h)/2;return 1;}

const WX=[];
function weather(ri,col,t,size,speed){const b=tb(ri);if(!WX[ri]){WX[ri]=[];for(let i=0;i<180;i++)WX[ri].push([Math.random(),Math.random(),Math.random()]);}

let DIALDRAG=false;
function dcDial(){

  const arc=(a0,a1,r)=>{const p=a=>[(Math.sin(a*Math.PI/180)*r).toFixed(1),(-Math.cos(a*Math.PI/180)*r).toFixed(1)];const[x0,y0]=p(a0),[x1,y1]=p(a1);return`M${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}`;};

  return`<svg class="dcface" viewBox="-62 -62 124 124" role="slider" aria-label="Power controller: left reverse, right forward" tabindex="0">
    <defs><radialGradient id="dcPlate" cx="35%" cy="30%"><stop offset="0" stop-color="#f7f1e2"/><stop offset="1" stop-color="#cdbf9f"/></radialGradient>
    <radialGradient id="dcKnobG" cx="38%" cy="32%"><stop offset="0" stop-color="#5a5550"/><stop offset=".55" stop-color="#26231f"/><stop offset="1" stop-color="#0e0d0c"/></radialGradient></defs>
    <circle r="60" fill="#2b2622"/><circle r="57" fill="url(#dcPlate)"/>
    <path d="${arc(-135,-5,49.5)}" stroke="#c94c3a" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/><path d="${arc(5,135,49.5)}" stroke="#3a9a54" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/>
    ${ticks}<text y="-36" text-anchor="middle" font-size="8.5" font-weight="700" fill="#3a332a">OFF</text>
    <text x="-38" y="44" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b23a2a">REV</text><text x="38" y="44" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2b7d42">FWD</text>
    <g id="dcKnob"><circle r="33" fill="rgba(0,0,0,.35)" cy="2.5"/><circle r="32" fill="url(#dcKnobG)"/>${ridges}<circle r="22" fill="url(#dcKnobG)" stroke="rgba(255,255,255,.08)"/>
      <rect x="-2" y="-30" width="4" height="17" rx="2" fill="#f4efe2"/></g></svg>`;
}

function wireDial(svg){

  svg.addEventListener('keydown',e=>{const t=selTrain();if(!t)return;if(e.key==='ArrowRight'||e.key==='ArrowUp'){setDial((t.dial||0)+.1);e.preventDefault();e.stopPropagation();}else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){setDial((t.dial||0)-.1);e.preventDefault();e.stopPropagation();}else if(e.key==='0'||e.key==='Home'){setDial(0);e.preventDefault();}});
}

function hoverHit(tp){if(!inMap(tp.x,tp.y))return false;if(EDIT)return ED.tool==='select'&&(G.own[idx(tp.x,tp.y)]!==-1||!!trainAt(tp));const i=idx(tp.x,tp.y);if(!G.seen[i])return false;if(G.own[i]!==-1||DOCK.has(i)||G.bp[i])return true;const m=G.track[i];if(m&&pieceCount(m)>1)return true;return!!trainAt(tp);}

function toolDown(tp){if(EDIT){edDown(tp);return;}if(!inMap(tp.x,tp.y))return;if(tool==='track')TD={tiles:[[tp.x,tp.y]],plan:null};else{TD={done:new Set(),err:false};applyTile(tp);}}

const B64='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-_';
const GRIDS={terr:[Uint8Array,0],tree:[Uint8Array,0],track:[Uint8Array,0],h:[Int8Array,4],tl:[Int8Array,4],tk:[Uint8Array,0],fix:[Uint8Array,0],bp:[Uint8Array,0],bpK:[Uint8Array,0],bpP:[Int16Array,1]};
const encG=(a,off)=>{const o=[];for(let i=0;i<a.length;){const c=B64[clamp(a[i]+off,0,63)];let j=i+1;while(j<a.length&&a[j]===a[i])j++;const n=j-i;if(n>=4)o.push('~'+c+n.toString(36)+'.');else o.push(c.repeat(n));i=j;}return o.join('');};
const decG=(s,T,off)=>{const a=new T(N);let p=0;for(let i=0;i<s.length&&p<N;){if(s[i]==='~'){const v=B64.indexOf(s[i+1])-off,e=s.indexOf('.',i+2),n=parseInt(s.slice(i+2,e),36);a.fill(v,p,Math.min(N,p+n));p+=n;i=e+1;}else{a[p++]=B64.indexOf(s[i])-off;i++;}}return a;};
function hashStr(s){let h=2166136261;for(let i=0;i<(s||'').length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function serializeLayout(name){

function stationAt(x,y){

  if(!m)return{err:'Stations go on straight track beside a town or industry.'};

  const hz=m===2,tiles=[];

function validateLayout(){

const inTable=(x,y)=>inMap(x,y)&&tableOf(x,y)>=0;
const freeTile=i=>!G.track[i]&&!G.bp[i]&&G.own[i]===-1&&!G.res[i];
function brushTiles(tp,r){const out=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(dx*dx+dy*dy>r*r+r)continue;const x=tp.x+dx,y=tp.y+dy;if(inTable(x,y))out.push([x,y]);}return out;}
function markDirty(x,y){const ri=tableOf(x,y);if(ri<0)return;const r=y-tb(ri).y0,d=ED.dirtyRows||(ED.dirtyRows=new Map()),c=d.get(ri);d.set(ri,c?[Math.min(c[0],r),Math.max(c[1],r)]:[r,r]);ED.dirty.add(ri);}
function edRebake(force){if(!ED.dirty.size)return;if(!force&&performance.now()-ED.lastBake<700)return;for(const ri of ED.dirty){const c=ED.dirtyRows&&ED.dirtyRows.get(ri);if(c)rebakeRows(ri,c[0],c[1]);else bakeTable(ri);}ED.dirty.clear();if(ED.dirtyRows)ED.dirtyRows.clear();ED.lastBake=performance.now();G.buildVer++;}
function edTerrain(tp){
  const t=ED.tool;let blocked=false;
  for(const[x,y]of brushTiles(tp,ED.r)){const i=idx(x,y);if(TD.done.has(i))continue;TD.done.add(i);
    if(['raise','lower','flatten','smooth'].includes(t)&&!freeTile(i)){blocked=true;continue;}
    if(t==='raise')G.h[i]=Math.min(7,G.h[i]+1);else if(t==='lower')G.h[i]=Math.max(0,G.h[i]-1);
    else if(t==='flatten'){if(TD.lvl==null)TD.lvl=G.h[idx(tp.x,tp.y)];G.h[i]=TD.lvl;}
    else if(t==='smooth'){let s=0,n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(inTable(x+dx,y+dy)&&tableOf(x+dx,y+dy)===tableOf(x,y)){s+=G.h[idx(x+dx,y+dy)];n++;}G.h[i]=Math.round(s/n);}
    else if(t==='water'){if(!freeTile(i)&&!(G.track[i]&&G.tk[i]===1)){blocked=true;continue;}G.terr[i]=1;G.tree[i]=0;}
    else if(t==='land')G.terr[i]=0;
    else if(t==='trees'){if(G.terr[i]||!freeTile(i))continue;if(Math.random()<.7)G.tree[i]=1+Math.floor(Math.random()*4);treeVer++;continue;}
    else if(t==='rocks'){if(G.terr[i]||!freeTile(i))continue;G.tree[i]=5;treeVer++;continue;}
    markDirty(x,y);}
  if(blocked&&!TD.warned){TD.warned=true;toast('Track, buildings and docks keep their ground. Erase them first to reshape it.','',2.4);}
  edRebake(false);
}
function edErase(tp){
  for(const[x,y]of brushTiles(tp,ED.r)){const i=idx(x,y);if(TD.done.has(i))continue;TD.done.add(i);
    if(G.depot&&G.depot.tiles.some(([a,b])=>a===x&&b===y))continue;
    if(G.track[i]||G.bp[i]){for(const t of G.trains)if(t.segs.some(s=>s.x===x&&s.y===y))G.trains=G.trains.filter(q=>q!==t);
      if(G.bp[i]){const p=G.projects[G.bpP[i]];if(p)p.tiles=p.tiles.filter(k=>k!==i);}
      G.track[i]=0;G.bp[i]=0;G.bpK[i]=0;G.bpP[i]=-1;G.tk[i]=0;G.fix[i]=0;for(let e=0;e<4;e++)delete G.sw[x+','+y+','+e];G.trackVer++;G.buildVer++;}
    if(G.tree[i]){G.tree[i]=0;treeVer++;}}
}
function edClickErase(tp){
  const tr=trainAt(tp);if(tr){G.trains=G.trains.filter(t=>t!==tr);return true;}
  if(!inMap(tp.x,tp.y))return false;const i=idx(tp.x,tp.y),o=G.own[i];
  if(o>=2000){edDelInd(o-2000);return true;}if(o>=1000){edDelTown(o-1000);return true;}
  if(G.depot&&G.depot.tiles.some(([a,b])=>a===tp.x&&b===tp.y)){for(const[x,y]of G.depot.tiles){const j=idx(x,y);G.track[j]=0;G.fix[j]=0;}G.trains=G.trains.filter(t=>!t.segs.some(s=>G.depot.tiles.some(([a,b])=>a===s.x&&b===s.y)));G.depot=null;recomputeOwnRes();computeZones();G.trackVer++;return true;}

const ARRK=['terr','tree','track','own','h','tl','tk','fix','bp','bpK','bpP','seen','zone','res'];

function worldRemap(newTables,map,rmap){
  const oMW=MW,oMH=MH,oTBL=TBL,old={};for(const k of ARRK)old[k]=G[k];
  const minX=Math.min(...newTables.map(t=>t.x0)),minY=Math.min(...newTables.map(t=>t.y0));for(const t of newTables){t.x0-=minX;t.y0-=minY;}
  setTables(newTables);
  for(const k of ARRK){const a=new old[k].constructor(N);if(k==='own'||k==='bpP')a.fill(-1);G[k]=a;}
  const got=new Uint8Array(N);
  const M=(x,y)=>{if(x<0||y<0||x>=oMW||y>=oMH)return null;const r=map(x,y,oTBL[y*oMW+x]);if(!r)return null;const nx=r[0]-minX,ny=r[1]-minY;if(nx<0||ny<0||nx>=MW||ny>=MH)return null;return[nx,ny];};
  for(let y=0;y<oMH;y++)for(let x=0;x<oMW;x++){const m=M(x,y);if(!m)continue;const oi=y*oMW+x,ni=m[1]*MW+m[0],wasT=oTBL[oi]>=0,isT=TBL[ni]>=0;
    if(!wasT&&isT){if((old.track[oi]||old.bp[oi])&&!got[ni]){for(const k of['track','tl','tk','fix','bp','bpK','bpP'])G[k][ni]=old[k][oi];G.h[ni]=Math.max(0,old.tl[oi]);G.terr[ni]=0;got[ni]=1;}continue;}
    if(wasT!==isT)continue;if(!wasT&&!old.track[oi]&&!old.bp[oi])continue;if(got[ni])continue;for(const k of ARRK)G[k][ni]=old[k][oi];got[ni]=1;}
  for(let i=0;i<N;i++){if(TBL[i]<0){G.terr[i]=3;G.h[i]=FLOOR_L;G.tree[i]=0;}else if(!got[i]){G.terr[i]=0;G.h[i]=1;}G.seen[i]=1;}
  const MP=p=>M(p[0],p[1]),MI=i=>{const r=M(i%oMW,Math.floor(i/oMW));return r?r[1]*MW+r[0]:-1;};
  G.towns=G.towns.filter(t=>{const c=MP([t.x,t.y]);if(!c)return false;const dk=t.dock?t.dock.map(MP):null;
    t.houses=t.houses.map(h=>{const p=MP([h.x,h.y]);return p?Object.assign(h,{x:p[0],y:p[1]}):null;}).filter(Boolean);t.x=c[0];t.y=c[1];t.dock=dk&&dk.every(Boolean)?dk:null;t.ri=tableOf(t.x,t.y);return t.ri>=0&&t.houses.length;});
  G.inds=G.inds.filter(o=>{const c=MP([o.x,o.y]),c2=MP([o.x+1,o.y+1]);if(!c||!c2||c2[0]!==c[0]+1||c2[1]!==c[1]+1)return false;const dk=o.dock?o.dock.map(MP):null;o.x=c[0];o.y=c[1];o.dock=dk&&dk.every(Boolean)?dk:null;o.ri=tableOf(o.x,o.y);return o.ri>=0;});
  if(G.depot){const d=G.depot.tiles.map(MP);G.depot=d.every(Boolean)?{tiles:d}:null;}
  G.trains=G.trains.filter(t=>{const ss=t.segs.map(q=>[q,MP([q.x,q.y])]);if(ss.some(z=>!z[1]))return false;for(const[q,p]of ss){q.x=p[0];q.y=p[1];}return true;});
  for(const p of G.projects){p.tiles=p.tiles.map(MI).filter(i=>i>=0);p.site=p.site>=0?MI(p.site):-1;}
  const sw={};for(const k in G.sw){const[x,y,e]=k.split(',').map(Number),r=MP([x,y]);if(r)sw[r[0]+','+r[1]+','+e]=G.sw[k];}G.sw=sw;
  if(rmap){for(const id in G.pdefs){const D=G.pdefs[id];const n=rmap[D.ri];D.ri=n>=0?n:0;if(D.gate!=null){const g=rmap[D.gate];D.gate=g>=0?g:undefined;}}
    const reg=[];rmap.forEach((n,o)=>{if(n>=0)reg[n]=G.reg[o];});G.reg=REGIONS.map((_,i)=>!!reg[i]);}
  else while(G.reg.length<REGIONS.length)G.reg.push(false);
  if(!G.reg.some(Boolean))G.reg[0]=true;
  for(let i=0;i<N;i++)if(G.bp[i]&&!G.projects[G.bpP[i]]){G.bp[i]=0;G.bpP[i]=-1;}
  for(const p of G.projects)p.tiles=p.tiles.filter(i=>G.bp[i]);
  if(G.camStart)G.camStart={x:G.camStart.x-minX*TS,y:G.camStart.y-minY*TS};cam.x-=minX*TS;cam.y-=minY*TS;
  recomputeOwnRes();rebuildDocks();computeZones();G.trackVer++;G.buildVer++;treeVer++;rowVer='';
}
function tblCheck(list){

  const w=Math.max(...list.map(t=>t.x0+t.w))-Math.min(...list.map(t=>t.x0)),h=Math.max(...list.map(t=>t.y0+t.h))-Math.min(...list.map(t=>t.y0));if(w*h>160000)return'That makes the layout too big.';
  return null;
}
function edTableOp(list,map,rmap,bake){

  bakeFloor();clampCam();ED.issues=[];edDraft();edOpts();Snd.build(3);return true;
}
function moveTable(ri,dx,dy){if(!dx&&!dy)return;const list=curTables();list[ri].x0+=dx;list[ri].y0+=dy;return edTableOp(list,(x,y,t)=>t===ri?[x+dx,y+dy]:[x,y],null,[]);}
function resizeTable(ri,rect){const list=curTables();Object.assign(list[ri],rect);const R=list[ri];
  return edTableOp(list,(x,y,t)=>t===ri&&(x<R.x0||y<R.y0||x>=R.x0+R.w||y>=R.y0+R.h)?null:[x,y],null,[ri]);}
function deleteTable(ri){if(REGIONS.length<2)return;const list=curTables();list.splice(ri,1);const rmap=REGIONS.map((_,i)=>i<ri?i:i===ri?-1:i-1);BAKE.splice(ri,1);
  return edTableOp(list,(x,y,t)=>t===ri?null:[x,y],rmap,[]);}
function addTable(style){const list=curTables();const x0=Math.max(...list.map(t=>t.x0+t.w))+3;list.push({style,name:STYLES[style].name,x0,y0:0,w:20,h:14});

function restyleTable(ri,style){const list=curTables();list[ri].style=style;setTables(list);bakeTable(ri);treeVer++;G.buildVer++;edDraft();}
function connections(){
  const out=[],M=i=>G.track[i]|G.bp[i],seen=new Set();
  for(let i=0;i<N;i++){if(TBL[i]>=0||!M(i)||seen.has(i))continue;const st=[i],tabs=new Set(),jobs=new Set();let bp=false,tun=false;seen.add(i);
    while(st.length){const j=st.pop(),x=j%MW,y=(j-x)/MW,m=M(j);if(G.bp[j]){bp=true;if(G.projects[G.bpP[j]])jobs.add(G.bpP[j]);}if(G.tk[j]===2||G.bpK[j]===2)tun=true;
      for(let e=0;e<4;e++){if(!edgeHas(m,e))continue;const nx=x+DX[e],ny=y+DY[e];if(!inMap(nx,ny))continue;const k=idx(nx,ny);if(!edgeHas(M(k),(e+2)&3))continue;
        if(TBL[k]>=0){tabs.add(TBL[k]);if(G.bp[k]&&G.projects[G.bpP[k]]){bp=true;jobs.add(G.bpP[k]);}continue;}if(!seen.has(k)){seen.add(k);st.push(k);}}}

    resize();cam.z=clamp(COARSE?1:1.25,minZoom(),4);cam.x=G.camStart.x;cam.y=G.camStart.y;clampCam();dispMoney=G.money;setSpeed(1);setTool('select');renderGoal(true);updateBadge();$('#edBack').classList.remove('hidden');toast('Playtest started. Your edits are kept.','big',3);};
  if(list.some(i=>i.lv==='err'))openChecks(go);else go();}
function edSave(){const all=LS.get('pj-layouts',{});all[ED.name]=serializeLayout(ED.name);if(LS.set('pj-layouts',all))toast(`Saved “${ED.name}” in this browser.`);else errToast('Could not save here. Use Export instead.');}
function openEdLoad(){
  const all=LS.get('pj-layouts',{}),names=Object.keys(all);
  openModal(`<div class="modal card menu"><div class="mh"><h2>Open a layout</h2><button class="x" data-a="close" aria-label="Close">✕</button></div>
    <div class="sect">Saved in this browser</div>${names.length?`<div class="tlist">${names.map(n=>`<div class="trow"><span><b>${esc(n)}</b></span><span><button class="btn" data-open="${esc(n)}">Open</button> <button class="mini-x" data-del="${esc(n)}" aria-label="Delete">✕</button></span></div>`).join('')}</div>`:'<p class="empty">Nothing saved yet.</p>'}
    <div class="sect">Start from</div><button class="btn" data-a="def">The standard tables</button><button class="btn" data-a="rand">Random terrain and lines</button><button class="btn" data-a="blank">Blank tables</button>
    <div class="sect">Import</div><textarea id="edImp" rows="3" placeholder="Paste exported layout code here"></textarea><div class="row"><button class="btn" data-a="imp">Import pasted code</button><label class="btn">Import file<input type="file" accept=".json,application/json" id="edFile" hidden></label></div></div>`,m=>{
    const q=s=>m.querySelector(s);q('[data-a=close]').onclick=closeModal;
    m.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{closeModal();openEditor(all[b.dataset.open]);});
    m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{delete all[b.dataset.del];LS.set('pj-layouts',all);openEdLoad();});
    q('[data-a=def]').onclick=()=>{closeModal();openEditor(DEFAULT_LAYOUT);};q('[data-a=rand]').onclick=()=>{closeModal();openEditor(randomLayout());};q('[data-a=blank]').onclick=()=>{closeModal();openEditor(blankLayout());};
    const imp=txt=>{try{const L=JSON.parse(txt);buildFromLayout(L);closeModal();openEditor(L);toast(`Imported “${L.name}”.`);}catch(e){errToast('That isn’t a valid layout.');}};
    q('[data-a=imp]').onclick=()=>imp(q('#edImp').value);q('#edFile').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(imp);};});
}
function openExport(){
  const L=serializeLayout(ED.name),txt=JSON.stringify(L);
  openModal(`<div class="modal card menu"><div class="mh"><h2>Export “${esc(ED.name)}”</h2><button class="x" data-a="close" aria-label="Close">✕</button></div>
    <p class="help">Copy this code to back up your tables or share them. Use them in your own game here, or send the code to have it become the game’s official layout.</p>
    <textarea id="edExp" rows="5" readonly>${esc(txt)}</textarea><div class="row"><button class="btn" data-a="copy">Copy code</button></div>
    <div class="sect">My game</div><button class="btn primary" data-a="use">Play these tables in my game</button>${LS.get('pj-active-layout',null)?'<button class="btn" data-a="std">Go back to the standard tables</button>':''}</div>`,m=>{
    const q=s=>m.querySelector(s);q('[data-a=close]').onclick=closeModal;
    q('[data-a=copy]').onclick=()=>{const ta=q('#edExp');ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Copied.'),()=>{if(!ok)toast('Select the text and copy it.');});else toast(ok?'Copied.':'Select the text and copy it.');};
    q('[data-a=use]').onclick=()=>{const list=validateLayout();if(list.some(i=>i.lv==='err')){closeModal();openChecks();errToast('Fix the problems first.');return;}LS.set('pj-active-layout',L);LS.del(SAVE_KEY);toast('Your next game will use these tables.','big',3);closeModal();};
    const s=q('[data-a=std]');if(s)s.onclick=()=>{LS.del('pj-active-layout');LS.del(SAVE_KEY);toast('Back to the standard tables for your next game.');closeModal();};});
}
