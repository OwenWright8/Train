<title>Puffwood Junction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: four model-railway tables on a workshop floor, drawn as layered foam terrain; rounded cards float at the edges */
:root{
  --panel:#fffaf1; --panel2:#f3ead9; --ink:#3b342b; --muted:#867c6d; --line:rgba(96,72,40,.15);
  --accent:#e2683a; --accent-ink:#ffffff; --good:#2f8f6a; --gold:#e9b23c; --danger:#cc4636;
  --shadow:0 10px 30px rgba(70,48,18,.20),0 2px 6px rgba(70,48,18,.12);
  --scrim:rgba(40,30,15,.38); --hint:rgba(43,36,27,.82); --hint-ink:#fff;
  --bg:#3a2d22;
  --display:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --pencil:'Caveat','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#24282b; --panel2:#2f3438; --ink:#f0e9dc; --muted:#a99f8f; --line:rgba(255,255,255,.10);
    --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
    --scrim:rgba(0,0,0,.5); --hint:rgba(20,22,24,.86); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#24282b; --panel2:#2f3438; --ink:#f0e9dc; --muted:#a99f8f; --line:rgba(255,255,255,.10);
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.5); --hint:rgba(20,22,24,.86); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#tilt{position:fixed;inset:0;pointer-events:none;z-index:1;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 22%,transparent 74%,#000 100%);mask-image:linear-gradient(180deg,#000 0%,transparent 22%,transparent 74%,#000 100%)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(20,12,4,.35) 100%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.2px}
.logo{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.pill{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-family:var(--display);font-weight:600;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
button.pill{cursor:pointer}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-size:12px;line-height:18px}
.spacer{flex:1}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e9b23c 60%,#c98f1c);box-shadow:inset 0 0 0 1.5px #c98f1c;flex:none;display:inline-block}
#moneyPill.bump{animation:bump .22s ease-out}
@keyframes bump{50%{transform:scale(1.12)}}
.seg{display:flex;gap:2px;padding:3px}
.seg button{border:0;background:transparent;width:34px;height:30px;border-radius:999px;display:grid;place-items:center}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);width:40px;height:40px;border-radius:50%;display:grid;place-items:center}

#goal{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(66px + env(safe-area-inset-top,0px));width:290px;padding:12px 14px;z-index:4;cursor:pointer}
#goal .eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
#goal h3{margin:3px 0 4px;font-family:var(--display);font-weight:600;font-size:17px;text-wrap:balance}
#goal p{margin:0;color:var(--muted);line-height:1.4;font-size:13px}
#goal .reward{margin-top:8px;display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:500;font-size:13px}
.need{display:flex;flex-direction:column;gap:5px;margin-top:8px}
#goal.min p,#goal.min .reward,#goal.min .need{display:none}
#goal.flash{animation:goalflash .9s ease-out}
@keyframes goalflash{30%{transform:scale(1.05);box-shadow:0 0 0 6px rgba(233,178,60,.55),var(--shadow)}}
.needrow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;font-size:12.5px;font-weight:600}
.needrow i{width:10px;height:10px;border-radius:3px;display:block}
.needrow b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}

#tools{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:3px;padding:6px;border-radius:22px;z-index:5}
.tool{width:66px;height:58px;border:0;border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--display);font-size:12px;font-weight:500;transition:transform .15s,background .15s}
.tool:hover{background:var(--panel2)}
.tool.on{background:var(--accent);color:var(--accent-ink);transform:translateY(-4px)}
.tool svg.i{width:22px;height:22px}
#hint{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:7px 15px;border-radius:999px;background:var(--hint);color:var(--hint-ink);font-size:13px;width:max-content;max-width:calc(100% - 32px);text-align:center;pointer-events:none;z-index:4;line-height:1.35;transition:opacity .6s}

#panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 180px);overflow:auto;padding:14px;z-index:6}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ph .grow{flex:1;min-width:0}
.ph input.name{width:100%;border:0;background:transparent;font-family:var(--display);font-weight:600;font-size:19px;padding:2px 4px;border-radius:8px}
.ph input.name:hover{background:var(--panel2)}
.ttl{font-family:var(--display);font-weight:600;font-size:19px;padding:2px 4px}
.sub{color:var(--muted);font-size:12.5px;padding-left:4px}
.x{border:0;background:var(--panel2);width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center}
.status{padding:8px 11px;border-radius:12px;background:var(--panel2);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;line-height:1.3}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--good)}
.dot.warn{background:var(--gold)}.dot.bad{background:var(--danger)}.dot.idle{background:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stats div{background:var(--panel2);border-radius:12px;padding:6px 9px}
.stats small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stats b{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.sect{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--panel2);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:3px;display:block}
.cars{display:flex;flex-direction:column;gap:4px}
.carrow{display:grid;grid-template-columns:82px 1fr 52px;align-items:center;gap:8px;font-size:12.5px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .25s}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:12px;padding:3px;margin:12px 0 4px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:7px;font-family:var(--display);font-weight:600}
.tabs button.on{background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.12)}
ol.orders{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ol.orders li{display:grid;grid-template-columns:24px 1fr auto auto;gap:6px;align-items:center;padding:6px;border-radius:12px;background:var(--panel2);border:2px solid transparent}
ol.orders li.cur{border-color:var(--accent)}
ol.orders .n{width:24px;height:24px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:12px}
ol.orders select{min-width:0;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px}
ol.orders label{font-size:11.5px;display:flex;align-items:center;gap:3px;white-space:nowrap;color:var(--muted)}
.mini-x{border:0;background:transparent;width:24px;height:24px;border-radius:50%;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 12px;font-family:var(--display);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.grow{flex:1;justify-content:center}
.btn.held{background:var(--danger);color:#fff}
.empty{color:var(--muted);font-size:13px;line-height:1.45;padding:8px 2px}
.tip{color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:8px}
.throttle{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center;margin-top:8px}
.throttle input{width:100%;accent-color:var(--accent);height:28px}
.throttle b{font-family:var(--display);font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.progress{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:99px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv b{font-variant-numeric:tabular-nums}

.modal-bg{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;padding:16px}
.modal{width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px 20px}
.mh{display:flex;align-items:center;gap:10px}
.mh h2{flex:1;margin:0;font-family:var(--display);font-weight:600;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.vcard{position:relative;border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:6px 10px 10px;text-align:left;display:flex;flex-direction:column;gap:3px}
.vcard.on{border-color:var(--accent);background:var(--panel)}
.vcard canvas{align-self:center}
.vcard b{font-family:var(--display);font-weight:600;font-size:15px}
.vcard small{color:var(--muted);font-size:12px;line-height:1.3}
.vcard .price{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:600;font-size:13px;margin-top:2px}
.vcard.locked{opacity:.55;cursor:not-allowed}
.vcard .lock{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--muted)}
.meter{display:inline-flex;gap:2px;vertical-align:middle}.meter i{width:12px;height:5px;border-radius:2px;background:var(--line)}.meter i.f{background:var(--accent)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.consist{background:var(--panel2);border-radius:14px;padding:10px;margin-top:10px}
.consist .chips{margin-top:6px}
.chip .rm{border:0;background:transparent;padding:0 0 0 2px;color:var(--muted);font-weight:700}
.mf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.mf input{flex:1;min-width:140px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px}
.total{font-family:var(--display);font-weight:600;display:flex;gap:6px;align-items:center}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel2);border:0;text-align:left}
.trow b{font-family:var(--display);font-weight:600}
.trow small{color:var(--muted)}
.menu{width:min(440px,100%)}
.menu .btn{width:100%;justify-content:flex-start;margin-top:6px}
.help{color:var(--muted);line-height:1.5;font-size:13.5px}
.help b{color:var(--ink)}
.ctable{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.cregion h4{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.cregion h4 i{width:12px;height:12px;border-radius:4px}
.ccard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.ccard.done{opacity:.6}
.ccard.locked{opacity:.5}
.ccard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ccard .top b{font-family:var(--display);font-weight:600;font-size:15px}
.ccard .top span{font-family:var(--display);font-weight:600;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.ccard p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.4}
.ccard p b{color:var(--ink)}
.tag{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--muted)}
.tag.go{background:var(--accent);color:var(--accent-ink)}

#toasts{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:30;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{padding:9px 16px;border-radius:999px;font-family:var(--display);font-weight:500;font-size:14.5px;animation:tin .35s cubic-bezier(.2,1.4,.4,1),tout .4s ease-in forwards;animation-delay:0s,var(--life,3s);text-align:center}
.toast.big{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:16px;font-weight:600}
.toast.err{color:var(--danger)}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}
.coinfly{position:fixed;left:0;top:0;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e9b23c 60%,#c98f1c);box-shadow:inset 0 0 0 1.5px #c98f1c;z-index:40;pointer-events:none;transition:transform .75s cubic-bezier(.55,-0.35,.6,1),opacity .2s .65s}
.hidden{display:none!important}

@media (max-width:760px){
  .brand span,#clockPill,.ctext{display:none}
  .brand{padding:5px}
  #goal{width:auto;right:max(16px,env(safe-area-inset-right,0px));padding:9px 12px}
  #goal h3{font-size:15px}
  #panel{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-height:46%}
  .tool{width:50px;font-size:10.5px}
  #hint{bottom:calc(88px + env(safe-area-inset-bottom,0px));font-size:12px}
  .seg button{width:28px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

.cons{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.vchip{display:inline-flex;flex-direction:column;padding:4px 9px 4px 11px;border-radius:10px;background:var(--panel2);border-left:4px solid var(--c);line-height:1.15}
.vchip b{font-family:var(--display);font-weight:600;font-size:12.5px}.vchip small{color:var(--muted);font-size:11px}
.vchip.eng{background:var(--panel)}
.cut{border:1px dashed var(--line);background:transparent;border-radius:8px;width:24px;height:30px;padding:0;color:var(--muted);font-size:13px}
.cut:hover{color:var(--danger);border-color:var(--danger)}
.drive{background:var(--panel2);border-radius:14px;padding:10px}
.dirrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dirrow span{color:var(--muted);font-size:12.5px;font-weight:600}
.drive .btn{background:var(--panel)}.drive .btn.primary{background:var(--accent)}.drive .btn.held{background:var(--danger);color:#fff}
ol.phases{margin:6px 0 4px;padding-left:20px;font-size:12.5px;line-height:1.5;color:var(--muted)}
ol.phases li.ok{text-decoration:line-through;opacity:.7}ol.phases li.cur{color:var(--ink);font-weight:600}
ol.phases small{opacity:.8;font-weight:400}
#goal .srcl{margin-top:6px;font-size:12px}
#goal .need{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.need{display:flex;flex-direction:column;gap:5px}
@media (max-width:760px){#panel .sub,#panel p.tip,.dirrow span{display:none}.drive{padding:7px}.drive .row,.throttle{margin-top:4px}#panel .status{margin-bottom:6px;padding:6px 10px}#panel .sect{margin:8px 0 4px}}

body.editing #top,body.editing #tools,body.editing #goal,body.editing #panel,body.editing #hint{display:none!important}
#edBack{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:7;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#edTop{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;padding:7px 10px;z-index:8;border-radius:18px}
.edTitle{font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap}
#edName{flex:0 1 200px;min-width:90px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 10px;font-family:var(--display);font-weight:600}
.edBtns{display:flex;gap:5px;margin-left:auto;overflow-x:auto;scrollbar-width:none}.edBtns .btn{padding:6px 10px;white-space:nowrap}
#edTools{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(66px + env(safe-area-inset-top,0px));bottom:16px;width:92px;overflow-y:auto;padding:6px;z-index:8;border-radius:18px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.edGroup{display:flex;flex-direction:column;gap:2px}.edGroup small{font-family:var(--display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 6px}
.edTool{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:10px;padding:6px 7px;font-size:12px;font-weight:600;text-align:left;color:var(--ink)}
.edTool .i{width:17px;height:17px;flex:none}.edTool:hover{background:var(--panel2)}.edTool.on{background:var(--accent);color:var(--accent-ink)}
#edOpts{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));width:260px;max-height:calc(100% - 90px);overflow:auto;padding:12px 14px;z-index:8;border-radius:18px}
#edOpts .edH{font-family:var(--display);font-weight:600;font-size:17px}#edOpts .tip{margin-top:4px}

function guide(){
  const bes=G.trains.find(t=>t.veh.some(v=>v.kind==='eng'&&v.e==='shunter'));
  if(!G.g.met&&bes)return{eb:'Getting started',t:'Meet Old Bessie',h:`Your depot has one tired shunter and three old cars. ${COARSE?'Tap':'Click'} the yellow shunter to take the controls.`,focus:bes};
  if(!G.g.coupled&&bes&&G.trains.some(t=>!hasEng(t)&&!t.ab))return{eb:'Getting started',t:'Couple up the cars',h:'Raise the throttle and creep Old Bessie into the cars parked on the siding. They couple when you touch them. Use Reverse to change direction.',focus:bes};
  for(const p of projOrder()){if(p.done||projDef(p).locked||!G.reg[projDef(p).ri])continue;const D=projDef(p);
    if(!p.seen)return{eb:'Explore',t:'Scout the line',h:`There is more to find on ${REGIONS[D.ri].name}. Drive along the main line (the Scout draisine is fast and sees far) to uncover what is out there.`};

const panel=$('#panel');let panelSig='';
function closePanel(){SEL=null;panel.classList.add('hidden');panel.innerHTML='';panelSig='';}
function select(k,id){SEL={k,id};panelSig='';buildPanel();}
const selTrain=()=>SEL&&SEL.k==='train'?G.trains.find(q=>q.id===SEL.id):null;
function statusOf(t){
  if(t.ab)return['Abandoned. Repair its siding, then drive an engine into it to recover it.','idle'];
  if(!hasEng(t))return['Parked. Push an engine into these cars to couple them.','idle'];
  if(t.heavy)return[`Too heavy: this engine can only pull ${t.pull} car${t.pull===1?'':'s'}. Cut some off.`,'bad'];
  if(t.v<.5&&t.svcMsg)return[t.svcMsg,/needs|nothing|full|takes|buys/.test(t.svcMsg)?'warn':''];
  if(t.v<.5&&t.thr>0&&t.look&&t.look.dead)return['End of the line. Reverse to go back.','warn'];
  if(t.v<.5&&t.brk)return['Brakes on','idle'];
  if(t.v<.5)return[t.thr>0?'Starting…':'Stopped. Raise the throttle to move.','idle'];
  return[`${Math.round(t.v)} mph${t.grade>0?' · climbing':t.grade<0?' · downhill':''}`,''];
}
function consHtml(t){
  return t.veh.map((v,i)=>{const cut=i>0&&!t.ab&&hasEng(t)?`<button class="cut" data-cut="${i}" title="Uncouple here" aria-label="Uncouple here">✂</button>`:'';
    const body=v.kind==='eng'?`<span class="vchip eng" style="--c:${v.color}"><b>${esc(v.name)}</b><small>${ENGINES[v.e].name}</small></span>`
      :`<span class="vchip" style="--c:${CARS[v.t].col}"><b>${CARS[v.t].name}</b><small>${v.t==='caboose'?'crew lookout':v.n?`${v.n}/${CARS[v.t].cap} ${(CARGO[v.c].short||CARGO[v.c].name).toLowerCase()}`:'empty'}</small></span>`;return cut+body;}).join('');
}

function wireTrain(t){

function depotPanel(){return`<div class="ph"><div class="grow"><div class="ttl">Engine Shed</div><div class="sub">${G.shop?'Repaired':'Run-down'}</div></div><button class="x" data-a="close" aria-label="Close">✕</button></div>
  <p class="help" style="margin:0">${G.shop?'Store engines here and park spare cars on the yard tracks. You can buy the odd car from the Fleet screen.':'The roof leaks and the yard is overgrown. Fix it up (see Jobs) to unlock car purchases and a bigger yard.'}</p>
  ${G.shop?'<div class="row"><button class="btn primary" data-a="fleet">Open Fleet</button></div>':''}`;}
function buildPanel(){
  if(!SEL){closePanel();return;}let html='';
  if(SEL.k==='train'){const t=selTrain();if(!t){closePanel();return;}html=trainPanel(t);panel.innerHTML=html;panel.classList.remove('hidden');wireTrain(t);panelSig='train'+t.id+':'+t.veh.length+(t.ab?1:0);updatePanel(true);return;}
  if(SEL.k==='ind')html=indPanel(G.inds[SEL.id]);else if(SEL.k==='town')html=townPanel(G.towns[SEL.id]);else if(SEL.k==='proj')html=projPanel(G.projects[SEL.id]);else if(SEL.k==='depot')html=depotPanel();
  if(html===panelSig)return;panelSig=html;panel.innerHTML=html;panel.classList.remove('hidden');
  panel.querySelector('[data-a=close]').onclick=closePanel;const f=panel.querySelector('[data-a=fleet]');if(f)f.onclick=openFleet;
}
let consSig='';
function updatePanel(force){
  if(!SEL)return;if(SEL.k!=='train'){buildPanel();return;}
  const t=selTrain();if(!t){closePanel();return;}
  if(panelSig!=='train'+t.id+':'+t.veh.length+(t.ab?1:0)){buildPanel();return;}
  const q=s=>panel.querySelector(s),[st,cl]=statusOf(t);q('#pst').textContent=st;q('#pdot').className='dot '+cl;
  if(q('#thr')){if(document.activeElement!==q('#thr')||force){q('#thr').value=Math.round(t.thr*100);q('#thrv').textContent=Math.round(t.thr*100)+'%';}
    const e=t.veh.find(v=>v.kind==='eng');q('#pdir').textContent=e.flip?'Running backwards':'Running forwards';q('[data-a=follow]').classList.toggle('primary',FOLLOW===t.id);}
  const ch=consHtml(t);if(force||ch!==consSig){consSig=ch;q('#pcons').innerHTML=ch;q('#pcons').querySelectorAll('[data-cut]').forEach(b=>b.onclick=()=>{const tt=selTrain();if(!tt)return;const r=uncouple(tt,+b.dataset.cut);if(r===true){Snd.clunk();toast('Uncoupled','',1.4);buildPanel();}else errToast(r);});}
}

function hoverHit(tp){if(!inMap(tp.x,tp.y))return false;if(EDIT)return ED.tool==='select'&&(G.own[idx(tp.x,tp.y)]!==-1||!!trainAt(tp));const i=idx(tp.x,tp.y);if(!G.seen[i])return false;if(G.own[i]!==-1||DOCK.has(i)||G.bp[i])return true;const m=G.track[i];if(m&&pieceCount(m)>1)return true;return!!trainAt(tp);}
function trainAt(tp){let best=null,bd=COARSE?30:18;const sy=tp.wy-(inMap(tp.x,tp.y)?lev(tp.x,tp.y):0)*LIFT;for(const t of G.trains)for(const p of vehiclePoses(t)){const tx=Math.floor(p.x/TS),ty=Math.floor(p.y/TS);if(!inMap(tx,ty)||!G.seen[idx(tx,ty)])continue;const d=Math.hypot(p.x-tp.wx,(p.y-p.z-5)-sy);if(d<bd){bd=d;best=t;}}return best;}
function clickAt(tp){if(EDIT){edClick(tp);return;}
  const tr=trainAt(tp);if(tr){Snd.click();if(tr.veh.some(v=>v.kind==='eng'&&v.e==='shunter'))G.g.met=true;select('train',tr.id);renderGoal();return;}
  if(!inMap(tp.x,tp.y)){closePanel();return;}const i=idx(tp.x,tp.y);
  if(tableOf(tp.x,tp.y)>=0&&!isOpen(tp.x,tp.y)){Snd.click();openContracts();return;}
  if(tableOf(tp.x,tp.y)>=0&&!G.seen[i]){toast('Unexplored. Drive a train nearby to scout it.','',2.2);return;}
  const m=G.track[i];
  if(m&&pieceCount(m)>1){let be=-1,bd=1e9;for(let e=0;e<4;e++){if(edgeCount(m,e)<2)continue;const ex=tp.x*TS+H+DX[e]*H,ey=tp.y*TS+H+DY[e]*H,d=Math.hypot(ex-tp.wx,ey-tp.wy);if(d<bd){bd=d;be=e;}}
    if(be>=0){const k=tp.x+','+tp.y+','+be;G.sw[k]=((G.sw[k]||0)+1)%edgeCount(m,be);G.swVer++;Snd.sw();burst(tp.x*TS+H+DX[be]*(H-4),tp.y*TS+H+DY[be]*(H-4)-G.tl[i]*LIFT-8,6,'255,214,90',40);return;}}
  const o=G.own[i];if(o>=2000){Snd.click();select('ind',o-2000);return;}if(o>=1000){Snd.click();select('town',o-1000);return;}
  if(G.depot&&G.depot.tiles.some(([x,y])=>x===tp.x&&y===tp.y)){Snd.click();const ps=shedProj();select(!ps||ps.done?'depot':'proj',!ps||ps.done?0:ps.idx);return;}
  if(G.bp[i]&&G.bpP[i]>=0){Snd.click();select('proj',G.bpP[i]);return;}
  for(const p of G.projects)if(p.site===i&&!p.done){Snd.click();select('proj',p.idx);return;}
  const d=DOCK.get(i);if(d){Snd.click();select(d.k,d.i);return;}
  closePanel();
}
function toolDown(tp){if(EDIT){edDown(tp);return;}if(!inMap(tp.x,tp.y))return;if(tool==='track')TD={tiles:[[tp.x,tp.y]],plan:null};else{TD={done:new Set(),err:false};applyTile(tp);}}
function applyTile(tp){
  if(!inMap(tp.x,tp.y))return;const k=idx(tp.x,tp.y);if(TD.done.has(k))return;TD.done.add(k);let r=false;
  if(tool==='station'){r=buildStation(tp.x,tp.y,false);if(r&&r.o){const o=r.o,m=o.dock[1];burst(m[0]*TS+H,m[1]*TS+H-lev(m[0],m[1])*LIFT,10,'230,220,200',50,{r:3,gr:7,kind:'',a:.8});fxText(m[0]*TS+H,m[1]*TS+H-lev(m[0],m[1])*LIFT-14,'-'+fmt(r.cost),'#ffd54a');Snd.build(6);toast(`Station built at ${o.name}.`,'',2.4);renderGoal(true);r=true;}}
  else if(tool==='bulldoze'){if(DOCK.has(k)){const o=removeStationAt(tp.x,tp.y);if(o){HOOK.dust(tp.x,tp.y);toast(`Removed the station at ${o.name}.`,'',2);r=true;}}else r=bulldozeAt(tp.x,tp.y);}else if(tool==='tree')r=plantAt(tp.x,tp.y);
  if(typeof r==='string'&&!TD.err){TD.err=true;errToast(r);}
}
function toolMove(tp){
  if(EDIT){edMove(tp);return;}if(!TD)return;
  if(tool==='track'){if(!inMap(tp.x,tp.y))return;const T=TD.tiles;let[lx,ly]=T[T.length-1];if(lx===tp.x&&ly===tp.y)return;let guard=0;
    while((lx!==tp.x||ly!==tp.y)&&guard++<200){const dx=tp.x-lx,dy=tp.y-ly;if(Math.abs(dx)>=Math.abs(dy))lx+=Math.sign(dx);else ly+=Math.sign(dy);const k=T.findIndex(([a,b])=>a===lx&&b===ly);if(k>=0)T.length=k+1;else T.push([lx,ly]);}
    TD.plan=planTrack(T);}else applyTile(tp);
}
function toolUp(){if(EDIT){edUp();return;}if(tool==='track'&&TD&&TD.plan&&TD.plan.items.length){const r=buildPlan(TD.plan);if(r!==true)errToast(r);}TD=null;}
const keys=new Set();
window.addEventListener('keydown',e=>{
  if(EDIT){edKey(e);return;}
  if(e.target.tagName==='INPUT'&&e.target.type!=='range'||e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();
  if(k==='escape'){if(modalOpen)closeModal();else if(tool!=='select')setTool('select');else closePanel();return;}if(modalOpen)return;
  if(k===' '){e.preventDefault();if(G.speed){G.prevSpeed=G.speed;setSpeed(0);}else setSpeed(G.prevSpeed||1);return;}
  const tlist=['select','track','station','bulldoze','tree','fleet'];if(/^[1-6]$/.test(k)){setTool(tlist[+k-1]);return;}if(k==='j'){openContracts();return;}
  const t=selTrain();
  if(t&&hasEng(t)&&!t.ab){
    if(k==='w'||k==='arrowup'){t.thr=clamp(t.thr+.1,0,1);t.brk=false;if(!FOLLOW)FOLLOW=t.id;e.preventDefault();updatePanel(true);return;}
    if(k==='s'||k==='arrowdown'){t.thr=clamp(t.thr-.1,0,1);e.preventDefault();updatePanel(true);return;}
    if(k==='b'){t.brk=true;t.thr=0;updatePanel(true);return;}
    if(k==='r'){if(t.v<1){reverseTrain(t);t.thr=0;Snd.click();updatePanel(true);}else errToast('Stop the train before reversing.');return;}
    if(k==='h'){toot(t);return;}if(k==='f'){FOLLOW=FOLLOW===t.id?null:t.id;return;}}
  keys.add(k);
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys.delete(k);if(k==='b'){const t=selTrain();if(t)t.brk=false;}});
window.addEventListener('blur',()=>keys.clear());

const B64='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-_';
const GRIDS={terr:[Uint8Array,0],tree:[Uint8Array,0],track:[Uint8Array,0],h:[Int8Array,4],tl:[Int8Array,4],tk:[Uint8Array,0],fix:[Uint8Array,0],bp:[Uint8Array,0],bpK:[Uint8Array,0],bpP:[Int16Array,1]};
const encG=(a,off)=>{let s='';for(let i=0;i<a.length;i++)s+=B64[clamp(a[i]+off,0,63)];return s;};
const decG=(s,T,off)=>{const a=new T(N);for(let i=0;i<N&&i<s.length;i++)a[i]=B64.indexOf(s[i])-off;return a;};
function hashStr(s){let h=2166136261;for(let i=0;i<(s||'').length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function serializeLayout(name){
  const grid={};for(const k in GRIDS)grid[k]=encG(G[k],GRIDS[k][1]);

    inds:G.inds.map(o=>({type:o.type,x:o.x,y:o.y,ri:o.ri,dock:o.dock||null})),depot:G.depot?G.depot.tiles:null,
    pdefs:G.pdefs,projects:G.projects.map(p=>({id:p.id,site:p.site})),
    trains:G.trains.map(t=>({name:t.name,ab:!!t.ab,hp:+t.hp.toFixed(2),segs:t.segs.map(s=>({x:s.x,y:s.y,p:s.p,d:s.d})),veh:t.veh.map(v=>v.kind==='eng'?{kind:'eng',e:v.e,color:v.color,flip:!!v.flip,name:v.name}:{kind:'car',t:v.t,c:v.c||null,n:v.n||0})}))};
}
function recomputeOwnRes(){
  G.own.fill(-1);G.res.fill(0);
  G.towns.forEach((t,ti)=>{for(const h of t.houses)G.own[idx(h.x,h.y)]=1000+ti;for(const[x,y]of t.dock||[])if(inMap(x,y))G.res[idx(x,y)]=1;});
  G.inds.forEach((o,ii)=>{for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)G.own[idx(o.x+dx,o.y+dy)]=2000+ii;for(const[x,y]of o.dock||[])if(inMap(x,y))G.res[idx(x,y)]=1;});
  if(G.depot)for(const[x,y]of G.depot.tiles)G.res[idx(x,y)]=1;
  G.buildVer++;
}
function buildFromLayout(L){
  if(!L||L.fmt!=='puffwood-layout')throw new Error('Not a Puffwood layout');
  setTables(L.tables||DEFAULT_TABLES());if(!L.tables&&L.rnames)L.rnames.forEach((n,i)=>{if(n&&REGIONS[i])REGIONS[i].name=n;});
  G=baseG(hashStr(L.name));G.layoutName=L.name;G.money=L.money??3000;G.reg=REGIONS.map((_,i)=>L.reg?!!L.reg[i]:i===0);if(!G.reg.some(Boolean))G.reg[0]=true;
  G.pdefs=JSON.parse(JSON.stringify(L.pdefs||{}));
  for(const k in GRIDS)G[k]=L.grid&&L.grid[k]?decG(L.grid[k],GRIDS[k][0],GRIDS[k][1]):new GRIDS[k][0](N).fill(k==='bpP'?-1:0);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(tableOf(x,y)<0){const i=idx(x,y);G.terr[i]=3;G.h[i]=FLOOR_L;}
  G.towns=(L.towns||[]).map(t=>({x:t.x,y:t.y,name:t.name,pop:t.pop||120,lvl:0,ri:t.ri,dock:t.dock?t.dock.map(d=>d.slice()):null,seen:false,houses:(t.houses||[]).map(h=>({...h,born:-99}))}));
  for(const t of G.towns){if(!t.houses.length)t.houses.push({x:t.x,y:t.y,hall:true,c:0,r:0,s:1,born:-99});t.lvl=townLevel(t.pop);}
  G.inds=(L.inds||[]).map(o=>{const D=IND[o.type];return{type:o.type,x:o.x,y:o.y,ri:o.ri,name:D.name,stock:D.stock?Object.assign({},D.stock):{},inp:0,acc:0,dock:o.dock?o.dock.map(d=>d.slice()):null,seen:false};});
  G.depot=L.depot?{tiles:L.depot.map(d=>d.slice())}:null;
  recomputeOwnRes();
  G.projects=(L.projects||[]).map((p,i)=>({id:p.id,idx:i,phase:0,prog:{},done:false,tiles:[],site:p.site??-1,seen:false}));
  for(let i=0;i<N;i++){if(G.bp[i]&&G.projects[G.bpP[i]])G.projects[G.bpP[i]].tiles.push(i);else if(G.bp[i]){G.bp[i]=0;G.bpP[i]=-1;}G.pieces+=pieceCount(G.track[i]);}
  G.trains=(L.trains||[]).map(t=>({id:G.nid++,name:t.name,veh:JSON.parse(JSON.stringify(t.veh)),segs:t.segs.map(s=>({...s})),hp:t.hp,v:0,thr:0,brk:false,ab:!!t.ab,odo:0}));
  applyNames();
  const dm=G.depot?G.depot.tiles[Math.min(3,G.depot.tiles.length-1)]:[REGIONS[0].x0+(REGIONS[0].w>>1),REGIONS[0].y0+(REGIONS[0].h>>1)];
  G.camStart=L.camStart||{x:dm[0]*TS+H,y:dm[1]*TS};
  if(G.depot)revealAround(dm[0],dm[1],6,true);
  for(const t of G.trains){if(t.ab)continue;const e=t.veh.find(v=>v.kind==='eng');if(!e)continue;const h=pointBehind(t,0);revealAround(Math.floor(h.x/TS),Math.floor(h.y/TS),ENGINES[e.e].reveal,true);}
  rebuildDocks();computeZones();checkDiscover(true);

}

  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=idx(x,y),ri=tableOf(x,y);if(ri<0){G.terr[i]=3;G.h[i]=FLOOR_L;}else G.h[i]=1;}
  const L=serializeLayout('Blank tables');L.reg=REGIONS.map((_,i)=>i===0);G=keep;setTables(keepT);return L;

// ---- stations: built by the player on straight track beside a town or industry ----
const STATION_COST={town:400,ind:600};
function stationAt(x,y){
  if(!inMap(x,y))return{err:'Click on track.'};const i=idx(x,y),m=G.track[i];
  if(!m)return{err:'Stations go on straight track beside a town or industry.'};
  if((m!==1&&m!==2)||G.tk[i])return{err:'Stations need plain straight track: no junctions, bridges or tunnels.'};
  const hz=m===2,tiles=[];
  for(const k of[-1,0,1]){const X=hz?x+k:x,Y=hz?y:y+k;if(!inMap(X,Y))return{err:'A station needs 3 straight tiles in a row.'};const j=idx(X,Y);
    if(G.track[j]!==m||G.tk[j]||G.tl[j]!==G.tl[i])return{err:'A station needs 3 straight, level tiles of track in a row.'};if(DOCK.has(j))return{err:'There’s already a station here.'};tiles.push([X,Y]);}
  const ri=tableOf(x,y);let best=null,bd=1e9;
  const dist=(o,isInd)=>{let d=1e9;for(const[X,Y]of tiles){if(isInd){const dx=Math.max(o.x-X,0,X-(o.x+1)),dy=Math.max(o.y-Y,0,Y-(o.y+1));d=Math.min(d,Math.max(dx,dy));}else for(const hh of o.houses)d=Math.min(d,Math.max(Math.abs(hh.x-X),Math.abs(hh.y-Y)));}return d;};
  G.inds.forEach((o,k)=>{if(o.ri!==ri||(!EDIT&&!o.seen))return;const d=dist(o,true);if(d<=3&&d<bd){bd=d;best={k:'ind',i:k};}});
  G.towns.forEach((o,k)=>{if(o.ri!==ri||(!EDIT&&!o.seen))return;const d=dist(o,false)+.5;if(d<=3.5&&d<bd){bd=d;best={k:'town',i:k};}});
  if(!best)return{tiles,err:'Build a station within 3 tiles of a town or industry.'};
  const o=best.k==='ind'?G.inds[best.i]:G.towns[best.i];
  if(o.dock)return{tiles,target:best,err:`${o.name} already has a station. Remove it first to move it.`};
  return{tiles,target:best,o,cost:STATION_COST[best.k]};
}
function buildStation(x,y,free){
  if(!EDIT&&inMap(x,y)&&!G.seen[idx(x,y)])return'You haven’t explored there yet.';
  const r=stationAt(x,y);if(r.err)return r.err;const cost=free?0:r.cost;if(G.money<cost)return'Not enough coins.';
  G.money-=cost;r.o.dock=r.tiles;recomputeOwnRes();rebuildDocks();G.buildVer++;return r;
}
function removeStationAt(x,y){const d=inMap(x,y)&&DOCK.get(idx(x,y));if(!d)return false;const o=d.k==='ind'?G.inds[d.i]:G.towns[d.i];
  o.dock=null;recomputeOwnRes();rebuildDocks();G.buildVer++;if(!EDIT)G.money+=STATION_COST[d.k]/2;return o;}
function stationNeed(p){
  const need=curNeed(p);
  for(const c of Object.keys(need)){if((p.prog[c]||0)>=need[c])continue;const chain=c==='slabs'?['gravel','slabs']:c==='planks'?['logs','planks']:[c];
    for(const cc of chain){const srcs=G.inds.filter(o=>(CARGO_SRC[cc]||[]).includes(o.type)&&G.reg[o.ri]&&o.seen);if(srcs.length&&!srcs.some(o=>o.dock))return{o:srcs[0],cargo:cc};}}
  return null;
}

// ---- checks that keep hand-built tables playable ----
const CARGO_SRC={logs:['woodlot','lumber'],gravel:['gravel'],slabs:['cement'],planks:['sawmill'],rails:['railyard'],beams:['railyard']};
const CARGO_CAR={logs:'logcar',gravel:'hopper',planks:'flatcar',slabs:'flatcar',rails:'flatcar',beams:'flatcar'};
function validateLayout(){
  const out=[],E=(msg,tile,lv='err')=>out.push({msg,tile,lv});
  const t2i=(x,y)=>idx(x,y);
  if(!G.depot)E('There is no depot. Use the Depot tool to place the engine shed siding.',null);
  else if(G.depot.tiles.some(([x,y])=>!G.track[t2i(x,y)]))E('Depot siding is missing track.',t2i(...G.depot.tiles[0]));
  const engs=G.trains.filter(t=>!t.ab&&t.veh.some(v=>v.kind==='eng'&&ENGINES[v.e].pull>0));
  if(!engs.length)E('No working engine that can pull cars. Place Old Bessie or another engine.',null);
  for(const t of G.trains)for(const s of t.segs.slice(0,Math.max(1,Math.ceil(trainLen(t)/TS)+1)))if(!((G.track[t2i(s.x,s.y)]|(t.ab?G.bp[t2i(s.x,s.y)]:0))&(1<<s.p))){E(`${t.name} is not sitting on track.`,t2i(s.x,s.y));break;}
  const dockOk=(dock,name)=>{const hz=dock[0][1]===dock[1][1];for(const[x,y]of dock){if(!inMap(x,y)){E(`${name}'s dock runs off the map.`,null);return;}const m=G.track[t2i(x,y)]|G.bp[t2i(x,y)];if(!(m&(1<<(hz?1:0)))){E(`${name}'s loading dock needs straight track along all three dock tiles.`,t2i(x,y));return;}}};
  G.towns.forEach(t=>t.dock&&dockOk(t.dock,t.name));G.inds.forEach(o=>o.dock&&dockOk(o.dock,o.name));
  const nearReach=(cx,cy,r)=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(inMap(cx+dx,cy+dy)&&reach.has(t2i(cx+dx,cy+dy)))return true;return false;};
  // connectivity with every job finished
  const M=i=>G.track[i]|G.bp[i],reach=new Set();
  if(G.depot){const st=[t2i(...G.depot.tiles[0])];reach.add(st[0]);while(st.length){const i=st.pop(),x=i%MW,y=(i-x)/MW,m=M(i);for(let e=0;e<4;e++){if(!edgeHas(m,e))continue;const nx=x+DX[e],ny=y+DY[e];if(!inMap(nx,ny))continue;const j=t2i(nx,ny);if(reach.has(j)||!edgeHas(M(j),(e+2)&3))continue;reach.add(j);st.push(j);}}
    for(const t of G.towns)if(!nearReach(t.x,t.y,4))E(`No track runs near ${t.name} (or it can’t be reached from the depot), so no station can serve it.`,t2i(t.x,t.y),'warn');
    for(const o of G.inds)if(!nearReach(o.x,o.y,3)&&!nearReach(o.x+1,o.y+1,3))E(`No track runs near the ${o.name} (or it can’t be reached from the depot), so no station can serve it.`,t2i(o.x,o.y),'warn');}
  // regions & jobs
  const openable=new Set(G.reg.map((o,i)=>o?i:-1).filter(i=>i>=0));for(const p of G.projects){const D=projDef(p);if(D.gate!=null&&!D.locked)openable.add(D.gate);}
  const haveInd=new Set(G.inds.filter(o=>openable.has(o.ri)).map(o=>o.type)),startCars=new Set(G.trains.flatMap(t=>t.veh.filter(v=>v.kind==='car').map(v=>v.t)));
  const shop=G.projects.some(p=>projDef(p).unlock==='shop');let railNeed={rails:0,beams:0};
  for(const p of G.projects){const D=projDef(p);if(D.locked)continue;const nm=D.name||p.id;
    if(!openable.has(D.ri))E(`${nm} is in ${REGIONS[D.ri].name}, which never opens.`,p.site>=0?p.site:null);
    if(p.site<0)E(`${nm} has no delivery site. Pick it in Jobs and use the Site tool.`,p.tiles[0]??null);
    else{let near=false;const sx=p.site%MW,sy=(p.site-sx)/MW;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(inMap(sx+dx,sy+dy)&&G.track[t2i(sx+dx,sy+dy)])near=true;if(!near)E(`${nm}'s site isn't next to real track, so cars can't deliver to it.`,p.site);}
    if(!D.phases||!D.phases.length)E(`${nm} has no phases.`,p.site>=0?p.site:null);
    if(D.unlock!=='shop'&&!p.tiles.length)E(`${nm} has no blueprint track. Draw it with the Blueprint tool.`,p.site>=0?p.site:null,'warn');
    if(D.gate!=null&&!p.tiles.some(i=>tableOf(i%MW,Math.floor(i/MW))===D.gate))E(`${nm} opens ${REGIONS[D.gate].name}, but none of its blueprint reaches that table.`,p.site>=0?p.site:null,'warn');
    for(const ph of D.phases||[])for(const c in ph.need){if(!(ph.need[c]>0))continue;
      if(CARGO_SRC[c]&&!CARGO_SRC[c].some(t=>haveInd.has(t)))E(`${nm} needs ${CARGO[c].name.toLowerCase()}, but nothing makes it on any table that can open.`,p.site>=0?p.site:null);
      if(c==='slabs'&&!haveInd.has('gravel'))E('Cement Works need gravel, but there is no Gravel Pit.',null,'warn');
      if(c==='planks'&&!haveInd.has('woodlot')&&!haveInd.has('lumber'))E('The Sawmill needs logs, but there is no Woodlot or Lumber Camp.',null,'warn');
      if(CARGO_CAR[c]&&!startCars.has(CARGO_CAR[c])&&!shop)E(`${nm} needs ${CARGO[c].name.toLowerCase()}, but there's no ${CARS[CARGO_CAR[c]].name.toLowerCase()} and no way to buy one.`,null,'warn');
      if(c in railNeed)railNeed[c]+=ph.need[c];}}
  const yards=G.inds.filter(o=>o.type==='railyard'&&openable.has(o.ri)).length;
  for(const c in railNeed)if(railNeed[c]>yards*(IND.railyard.stock[c]||0))E(`Jobs need ${railNeed[c]} ${c}, but the rail yards only hold ${yards*(IND.railyard.stock[c]||0)}.`,null,'warn');
  return out;
}

// ---- editing operations ----
const inTable=(x,y)=>inMap(x,y)&&tableOf(x,y)>=0;
const freeTile=i=>!G.track[i]&&!G.bp[i]&&G.own[i]===-1&&!G.res[i];
function brushTiles(tp,r){const out=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(dx*dx+dy*dy>r*r+r)continue;const x=tp.x+dx,y=tp.y+dy;if(inTable(x,y))out.push([x,y]);}return out;}
function markDirty(x,y){const ri=tableOf(x,y);if(ri>=0)ED.dirty.add(ri);}
function edRebake(force){if(!ED.dirty.size)return;if(!force&&performance.now()-ED.lastBake<700)return;for(const ri of ED.dirty)bakeTable(ri);ED.dirty.clear();ED.lastBake=performance.now();G.buildVer++;}
function edTerrain(tp){
  const t=ED.tool;let blocked=false;
  for(const[x,y]of brushTiles(tp,ED.r)){const i=idx(x,y);if(TD.done.has(i))continue;TD.done.add(i);
    if(['raise','lower','flatten','smooth'].includes(t)&&!freeTile(i)){blocked=true;continue;}
    if(t==='raise')G.h[i]=Math.min(7,G.h[i]+1);else if(t==='lower')G.h[i]=Math.max(0,G.h[i]-1);
    else if(t==='flatten'){if(TD.lvl==null)TD.lvl=G.h[idx(tp.x,tp.y)];G.h[i]=TD.lvl;}
    else if(t==='smooth'){let s=0,n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(inTable(x+dx,y+dy)&&tableOf(x+dx,y+dy)===tableOf(x,y)){s+=G.h[idx(x+dx,y+dy)];n++;}G.h[i]=Math.round(s/n);}
    else if(t==='water'){if(!freeTile(i)&&!(G.track[i]&&G.tk[i]===1)){blocked=true;continue;}G.terr[i]=1;G.tree[i]=0;}
    else if(t==='land')G.terr[i]=0;
    else if(t==='trees'){if(G.terr[i]||!freeTile(i))continue;if(Math.random()<.7)G.tree[i]=1+Math.floor(Math.random()*4);treeVer++;continue;}
    else if(t==='rocks'){if(G.terr[i]||!freeTile(i))continue;G.tree[i]=5;treeVer++;continue;}
    markDirty(x,y);}
  if(blocked&&!TD.warned){TD.warned=true;toast('Track, buildings and docks keep their ground. Erase them first to reshape it.','',2.4);}
  edRebake(false);
}
function edErase(tp){
  for(const[x,y]of brushTiles(tp,ED.r)){const i=idx(x,y);if(TD.done.has(i))continue;TD.done.add(i);
    if(G.depot&&G.depot.tiles.some(([a,b])=>a===x&&b===y))continue;
    if(G.track[i]||G.bp[i]){for(const t of G.trains)if(t.segs.some(s=>s.x===x&&s.y===y))G.trains=G.trains.filter(q=>q!==t);
      if(G.bp[i]){const p=G.projects[G.bpP[i]];if(p)p.tiles=p.tiles.filter(k=>k!==i);}
      G.track[i]=0;G.bp[i]=0;G.bpK[i]=0;G.bpP[i]=-1;G.tk[i]=0;G.fix[i]=0;for(let e=0;e<4;e++)delete G.sw[x+','+y+','+e];G.trackVer++;G.buildVer++;}
    if(G.tree[i]){G.tree[i]=0;treeVer++;}}
}
function edClickErase(tp){

  if(!inMap(tp.x,tp.y))return false;const i=idx(tp.x,tp.y),o=G.own[i];

function edDelTown(ti){const t=G.towns[ti];if(!t)return;for(const tr of G.trains.slice())if(t.dock&&tr.segs.some(s=>t.dock.some(([a,b])=>a===s.x&&b===s.y)))G.trains=G.trains.filter(q=>q!==tr);G.towns.splice(ti,1);recomputeOwnRes();rebuildDocks();computeZones();markDirty(t.x,t.y);edRebake(true);}
function edDelInd(ii){const o=G.inds[ii];if(!o)return;G.inds.splice(ii,1);recomputeOwnRes();rebuildDocks();computeZones();markDirty(o.x,o.y);edRebake(true);}
function areaFree(pts,ri){for(const[x,y]of pts){if(!inTable(x,y)||tableOf(x,y)!==ri)return'Keep it all on one table.';const i=idx(x,y);if(G.terr[i]===1)return'That’s water.';if(G.own[i]!==-1||G.res[i])return'Something is already there.';}return null;}
function townDock(x,y,side){return side===0?[[x-1,y+3],[x,y+3],[x+1,y+3]]:side===1?[[x-1,y-3],[x,y-3],[x+1,y-3]]:side===2?[[x+3,y-1],[x+3,y],[x+3,y+1]]:[[x-3,y-1],[x-3,y],[x-3,y+1]];}
function indDock(x,y,side){const o=[];for(let k=0;k<3;k++){if(side===0)o.push([x-1+k,y+2]);else if(side===1)o.push([x-1+k,y-1]);else if(side===2)o.push([x+2,y-1+k]);else o.push([x-1,y-1+k]);}return o;}
function flattenUnder(pts,lv){for(const[x,y]of pts){const i=idx(x,y);if(!G.track[i]&&!G.bp[i]){G.h[i]=lv;G.terr[i]=0;}G.tree[i]=0;markDirty(x,y);}treeVer++;}
function edPlaceTown(tp){
  const{x,y}=tp,ri=tableOf(x,y);if(ri<0)return'Place towns on a table.';const dock=[],core=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)core.push([x+dx,y+dy]);
  const err=areaFree(core,ri)||areaFree(dock.filter(([a,b])=>!G.track[idx(a,b)]),ri);if(err)return err;
  const lv=G.h[idx(x,y)];flattenUnder([[x,y],...dock.filter(([a,b])=>!G.track[idx(a,b)])],lv);

function edResizeTown(ti,pop){const t=G.towns[ti];t.pop=pop;t.lvl=townLevel(pop);t.houses=t.houses.filter(h=>h.hall);recomputeOwnRes();const R=mulberry32(hashStr(t.name+t.x+t.y));for(let k=0;k<Math.ceil(pop/30);k++)addHouse(ti,R,true);recomputeOwnRes();markDirty(t.x,t.y);edRebake(true);}
function edPlaceInd(tp){
  const{x,y}=tp,ri=tableOf(x,y);if(ri<0)return'Place industries on a table.';const core=[[x,y],[x+1,y],[x,y+1],[x+1,y+1]],dock=[];

}
function edPlaceDepot(tp){
  const{x,y}=tp,ri=tableOf(x,y),hz=ED.side===2||ED.side===3,tiles=[];for(let k=0;k<6;k++)tiles.push(hz?[x+k,y]:[x,y+k]);

  for(const[a,b]of tiles){const i=idx(a,b);if(G.own[i]!==-1||G.res[i]||G.terr[i]===1)return'Something is in the way.';if(G.track[i]&&!(G.track[i]&(1<<(hz?1:0))))return'Other track is in the way.';}

function placeConsist(x,y,veh,ab,name){
  if(!inMap(x,y))return'Click on track.';const i=idx(x,y),m=G.track[i];if(!m)return'Click on real track (not blueprint).';
  const len=veh.reduce((a,v,k)=>a+vlen(v)+(k?GAP:0),0);
  for(let p=0;p<6;p++){if(!(m&(1<<p)))continue;for(const d of[0,1]){const segs=[{x,y,p,d}];let cover=PLEN[p]*.6;const seen=new Set([x+','+y+','+p]);
    while(cover<len+TS&&segs.length<60){const pv=prevs(segs[segs.length-1]);const n=pv.find(q=>!seen.has(q.x+','+q.y+','+q.p));if(!n)break;seen.add(n.x+','+n.y+','+n.p);segs.push(n);cover+=PLEN[n.p];}
    if(cover>=len+2){const t={id:G.nid++,name,veh,segs,hp:PLEN[p]*.6,v:0,thr:0,brk:false,ab:!!ab,odo:0};trimSegs(t);
      const mine=vehiclePoses(t);for(const o of G.trains)for(const q of vehiclePoses(o))for(const r of mine)if(Math.hypot(q.x-r.x,q.y-r.y)<(q.L+r.L)/2+2)return'Another train is in the way.';
      G.trains.push(t);return t;}}}

function edPlan(tiles,bpMode){
  const out=[],n=tiles.length;let prevL=null,err=null;if(n<2)return{items:out,cost:0,err};
  for(let i=0;i<n;i++){const[x,y]=tiles[i];
    let ep=i>0?dirTo(x,y,tiles[i-1][0],tiles[i-1][1]):-1,en=i<n-1?dirTo(x,y,tiles[i+1][0],tiles[i+1][1]):-1;const end=ep<0||en<0;
    if(end){const known=ep>=0?ep:en,straight=(known+2)&3;let g=-1;const m0=G.track[idx(x,y)]|G.bp[idx(x,y)];if(edgeHas(m0,straight))g=straight;else for(const d of[(known+1)&3,(known+3)&3])if(edgeHas(m0,d)){g=d;break;}if(g<0)g=straight;if(ep<0)ep=g;else en=g;}
    const p=pieceFor(ep,en),ii=idx(x,y),m=G.track[ii]|G.bp[ii],gap=tableOf(x,y)<0;let L,k=0,bad=null;
    if(m){L=G.tl[ii];k=G.tk[ii]||G.bpK[ii];if(prevL!=null&&Math.abs(L-prevL)>1)bad='Too steep to join this track.';}
    else{const tun=gap&&ED.gapKind==='tunnel',gh=gap?(tun?99:-9):G.h[ii],water=(gap&&!tun)||G.terr[ii]===1;if(prevL==null){L=Math.max(0,gh);if(water)bad='Start on dry land.';}else if(!water&&Math.abs(gh-prevL)<=1)L=gh;else if(gh<=prevL){L=prevL;k=1;}else{L=prevL;k=2;}}
    if(!bad){if(G.own[ii]!==-1)bad='Buildings are in the way.';
      else if(m&&(G.tk[ii]||G.bpK[ii])&&!(m&(1<<p)))bad='No junctions on bridges or in tunnels.';
      else if(!m&&k&&p>=2)bad=k===1?'Bridges must be straight.':'Tunnels must be straight.';
      else if(!m&&k&&end&&i===n-1)bad=k===1?'Bridges must end on solid ground.':'Tunnels must come out the other side.';

function edBuild(plan,bpMode){
  if(plan.err)return plan.err;const pr=bpMode?G.projects[ED.proj]:null;if(bpMode&&!pr)return'Make a job first.';

  recomputeOwnRes();rebuildDocks();computeZones();G.trackVer++;G.buildVer++;treeVer++;rowVer='';
}
function tblCheck(list){
  for(const t of list)if(t.w<8||t.h<6||t.w>60||t.h>40)return'Tables must be 8 to 60 tiles wide and 6 to 40 deep.';
  for(let a=0;a<list.length;a++)for(let b=a+1;b<list.length;b++){const A=list[a],B=list[b];if(A.x0<B.x0+B.w&&B.x0<A.x0+A.w&&A.y0<B.y0+B.h&&B.y0<A.y0+A.h)return'Tables can’t overlap.';}
  const w=Math.max(...list.map(t=>t.x0+t.w))-Math.min(...list.map(t=>t.x0)),h=Math.max(...list.map(t=>t.y0+t.h))-Math.min(...list.map(t=>t.y0));if(w*h>26000)return'That makes the layout too big.';
  return null;
}
function edTableOp(list,map,rmap,bake){
  const err=tblCheck(list);if(err){errToast(err);return false;}
  worldRemap(list,map,rmap);
  if(bake==='all'){BAKE.length=0;for(let ri=0;ri<REGIONS.length;ri++)bakeTable(ri);}else for(const ri of bake||[])bakeTable(ri);
  bakeFloor();clampCam();ED.issues=[];edDraft();edOpts();Snd.build(3);return true;
}
function moveTable(ri,dx,dy){if(!dx&&!dy)return;const list=curTables();list[ri].x0+=dx;list[ri].y0+=dy;return edTableOp(list,(x,y,t)=>t===ri?[x+dx,y+dy]:[x,y],null,[]);}
function resizeTable(ri,rect){const list=curTables();Object.assign(list[ri],rect);const R=list[ri];
  return edTableOp(list,(x,y,t)=>t===ri&&(x<R.x0||y<R.y0||x>=R.x0+R.w||y>=R.y0+R.h)?null:[x,y],null,[ri]);}
function deleteTable(ri){if(REGIONS.length<2)return;const list=curTables();list.splice(ri,1);const rmap=REGIONS.map((_,i)=>i<ri?i:i===ri?-1:i-1);BAKE.splice(ri,1);
  return edTableOp(list,(x,y,t)=>t===ri?null:[x,y],rmap,[]);}
function addTable(style){const list=curTables();const x0=Math.max(...list.map(t=>t.x0+t.w))+3;list.push({style,name:STYLES[style].name,x0,y0:0,w:20,h:14});
  return edTableOp(list,(x,y)=>[x,y],null,[list.length-1]);}
function restyleTable(ri,style){const list=curTables();list[ri].style=style;setTables(list);bakeTable(ri);treeVer++;G.buildVer++;edDraft();}
function connections(){
  const out=[],M=i=>G.track[i]|G.bp[i],seen=new Set();
  for(let i=0;i<N;i++){if(TBL[i]>=0||!M(i)||seen.has(i))continue;const st=[i],tabs=new Set(),jobs=new Set();let bp=false,tun=false;seen.add(i);
    while(st.length){const j=st.pop(),x=j%MW,y=(j-x)/MW,m=M(j);if(G.bp[j]){bp=true;if(G.projects[G.bpP[j]])jobs.add(G.bpP[j]);}if(G.tk[j]===2||G.bpK[j]===2)tun=true;
      for(let e=0;e<4;e++){if(!edgeHas(m,e))continue;const nx=x+DX[e],ny=y+DY[e];if(!inMap(nx,ny))continue;const k=idx(nx,ny);if(!edgeHas(M(k),(e+2)&3))continue;
        if(TBL[k]>=0){tabs.add(TBL[k]);if(G.bp[k]&&G.projects[G.bpP[k]]){bp=true;jobs.add(G.bpP[k]);}continue;}if(!seen.has(k)){seen.add(k);st.push(k);}}}
    out.push({tabs:[...tabs],bp,tun,jobs:[...jobs],tile:i});}
  const pairs=new Set();
  for(let i=0;i<N;i++){const a=TBL[i];if(a<0)continue;const x=i%MW,y=(i-x)/MW,m=M(i);for(const e of[1,2]){if(!edgeHas(m,e))continue;const nx=x+DX[e],ny=y+DY[e];if(!inMap(nx,ny))continue;const k=idx(nx,ny),b=TBL[k];
    if(b>=0&&b!==a&&edgeHas(M(k),(e+2)&3)&&!pairs.has(i)){pairs.add(i);const jobs=[i,k].filter(q=>G.bp[q]&&G.projects[G.bpP[q]]).map(q=>G.bpP[q]);out.push({tabs:[a,b],bp:jobs.length>0,tun:false,jobs,tile:i,direct:true});}}}
  return out;
}

function wireTables(o){
  o.querySelectorAll('[data-tn]').forEach(inp=>inp.onchange=()=>{REGIONS[+inp.dataset.tn].name=inp.value||STYLE_NAMES[REGIONS[+inp.dataset.tn].style];G.buildVer++;edDraft();edOpts();});

  o.querySelectorAll('[data-to]').forEach(cb=>cb.onchange=()=>{G.reg[+cb.dataset.to]=cb.checked;if(!G.reg.some(Boolean))G.reg[0]=true;edDraft();edOpts();});

  const conns=connections();o.querySelectorAll('[data-conn]').forEach(b=>b.onclick=()=>focusTile(conns[+b.dataset.conn].tile));
}
function tableHit(fx,fy){
  for(let ri=REGIONS.length-1;ri>=0;ri--){const r=REGIONS[ri],T=.7;if(fx<r.x0-T||fx>r.x0+r.w+T||fy<r.y0-T||fy>r.y0+r.h+T)continue;
    const e={l:Math.abs(fx-r.x0)<T,r:Math.abs(fx-(r.x0+r.w))<T,t:Math.abs(fy-r.y0)<T,b:Math.abs(fy-(r.y0+r.h))<T};
    if(e.l||e.r||e.t||e.b)return{ri,mode:e};if(fx>r.x0&&fx<r.x0+r.w&&fy>r.y0&&fy<r.y0+r.h)return{ri,mode:'move'};}
  return null;
}
function tblDragRect(fx,fy){const r=REGIONS[TD.ri],dx=Math.round(fx-TD.fx),dy=Math.round(fy-TD.fy);let{x0,y0,w,h}=r;
  if(TD.mode==='move'){x0+=dx;y0+=dy;}else{const m=TD.mode;if(m.l){const d=Math.min(dx,w-8);x0+=d;w-=d;}if(m.r)w=Math.max(8,w+dx);if(m.t){const d=Math.min(dy,h-6);y0+=d;h-=d;}if(m.b)h=Math.max(6,h+dy);}
  const list=curTables();list[TD.ri]={...list[TD.ri],x0,y0,w,h};return{x0,y0,w,h,bad:tblCheck(list)};}
